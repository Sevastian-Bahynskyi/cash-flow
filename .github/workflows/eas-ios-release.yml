name: EAS iOS Release

# Triggers an iOS IPA build on EAS when a commit pushed to main contains
# a release marker in its message:  [release:patch] | [release:minor] | [release:major]
# The marker bumps expo.version in app.json (committed back with [skip ci]),
# then EAS builds the IPA with the `production` profile (buildNumber auto-increments).

on:
  push:
    branches:
      - main

concurrency:
  group: eas-ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Skip bot bump commits, run only when a release marker is present.
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (contains(github.event.head_commit.message, '[release:patch]') ||
       contains(github.event.head_commit.message, '[release:minor]') ||
       contains(github.event.head_commit.message, '[release:major]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release type
        id: rel
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MSG" | grep -q '\[release:major\]'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$MSG" | grep -q '\[release:minor\]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump app version
        id: bump
        run: node scripts/bump-version.cjs "${{ steps.rel.outputs.type }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA (production)
        run: eas build --platform ios --profile production --non-interactive --no-wait

      - name: Summary
        run: |
          {
            echo "### iOS release triggered :rocket:"
            echo ""
            echo "- Type: \`${{ steps.rel.outputs.type }}\`"
            echo "- Version: \`${{ steps.bump.outputs.previous }}\` -> \`${{ steps.bump.outputs.version }}\`"
            echo "- Build queued on EAS (production profile). Track it at https://expo.dev"
          } >> "$GITHUB_STEP_SUMMARY"
