<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cashflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Colour rule: two people, two colours. Indigo is you, saffron is Anna; anything shared carries both.
   Red only where a budget line was crossed, green only for money coming in. Everything else is ink. */
:root{
  --ground:#E9E8E4; --surface:#FAFAF8; --surface-2:#F1F0EC; --line:rgba(23,24,43,.10); --line-2:rgba(23,24,43,.18);
  --ink:#17182B; --ink-2:#4F5264; --ink-3:#666979;
  --you:#2D2F8F; --you-deep:#23246F; --you-text:#2D2F8F; --you-soft:#DFE0F3; --you-mark:#2D2F8F; --on-you:#FFFFFF; --on-you-2:rgba(255,255,255,.74); --on-you-line:rgba(255,255,255,.22);
  --anna:#E7A53C; --anna-text:#8A5800; --on-anna:#2A1A00;
  --over-fill:#B4352B; --over-card:#A9322A; --over-text:#B4352B; --over-soft:#F5DEDA;
  --in:#1D7646;
  --focus:#2D2F8F; --scrim:rgba(18,18,30,.38); --shadow:0 1px 2px rgba(20,20,40,.06),0 8px 24px rgba(20,20,40,.08);
  --skel:rgba(23,24,43,.08);
}
:root[data-theme="dark"]{
  --ground:#0E0F16; --surface:#181925; --surface-2:#20212F; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --ink:#ECECF3; --ink-2:#B5B7C8; --ink-3:#9496AB;
  --you:#3A3DA6; --you-deep:#2C2E86; --you-text:#AEB1FF; --you-soft:#2A2C5A; --you-mark:#7E82F2; --on-you:#FFFFFF; --on-you-2:rgba(255,255,255,.76); --on-you-line:rgba(255,255,255,.22);
  --anna:#F0B04A; --anna-text:#F3C06E; --on-anna:#2A1A00;
  --over-fill:#C4463B; --over-card:#8F2C25; --over-text:#FF948A; --over-soft:#3A1E1E;
  --in:#74D6A0;
  --focus:#AEB1FF; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --skel:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:400 15px/1.4 'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-optical-sizing:auto}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dash{font-family:'Newsreader',Georgia,serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
#view{padding:47px 16px 120px;max-width:640px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr) 72px;padding:6px 8px 34px;align-items:center}
.brand{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:48px;color:var(--ink-3);font-size:11px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--you-text)}
.addbtn{justify-self:center;width:52px;height:52px;border-radius:16px;background:var(--you);color:var(--on-you);display:grid;place-items:center}
.addbtn span{display:none}
.addbtn svg.i{width:24px;height:24px;stroke-width:2}

.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:48px;margin:0 -4px 8px}
.bar h1{margin:0;text-align:center;font-size:16px;font-weight:600}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.pagehead{display:none}

h2.sec{font-size:13px;font-weight:600;color:var(--ink-2);margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a,h2.sec button{font-weight:500;color:var(--you-text);font-size:13px}
.panel{background:var(--surface);border-radius:18px;overflow:hidden}

/* hero: the month as an object you hold */
.hero{position:relative;background:var(--you);color:var(--on-you);border-radius:24px;padding:18px 20px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--shadow);overflow:hidden}
.hero.over{background:var(--over-card)}
.hero .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--on-you-2)}
.hero .top b{color:var(--on-you);font-weight:600;font-size:14px}
.big{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:64px;line-height:1;letter-spacing:-.02em;margin:22px 0 4px}
.hero .sub{font-size:15px;color:var(--on-you-2)}
.hero .sub em{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:19px;color:var(--on-you)}
.days{margin-top:22px;position:relative}
.days svg{display:block;width:100%;height:auto;overflow:visible}
.axis{position:relative;height:16px;margin-top:6px;font-size:11px;color:var(--on-you-2)}
.axis span{position:absolute;top:0;white-space:nowrap}
.pace{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:13px;color:var(--on-you-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--on-you-line)}
.pace b{color:var(--on-you);font-weight:500}
.key{display:flex;gap:14px;font-size:12px;color:var(--on-you-2)}
.key i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.16);color:var(--on-you)}
.grow{transform-origin:50% 100%;transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleY(.15)}}

/* rows */
.row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 14px;min-height:56px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.row .meta svg.i{width:14px;height:14px}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.row .amt small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.amt.in{color:var(--in)}
.amt.moved{color:var(--ink-2);font-weight:400}
.who{width:28px;height:28px;display:grid;place-items:center}
.who svg{width:26px;height:26px}
.cat{color:var(--ink-2)}

/* needs a look */
.alert{background:var(--over-card);color:#fff;border-radius:18px;overflow:hidden}
.alert .row{border-color:rgba(255,255,255,.16);color:#fff}
.alert .row .meta{color:rgba(255,255,255,.78)}
.alert .row:hover{background:rgba(255,255,255,.06)}
.alert .who{color:#fff}
.alert .row{min-height:68px}
.alert .nm{font-size:17px}
.alert .ovq{color:#fff;font-size:17px}
.alert .ovdot{display:none}
.ovq{display:inline-flex;align-items:center;gap:7px;color:var(--over-text)}
.ovdot{width:7px;height:7px;border-radius:50%;background:var(--over-fill)}

/* shared pot */
.pot{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;width:100%;text-align:left}
.pair{position:relative;width:80px;height:44px}
.pair span{position:absolute;top:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;border:2px solid var(--surface)}
.pair .a{left:0;background:var(--anna);color:var(--on-anna)}
.pair .y{left:34px;background:var(--you);color:var(--on-you);font-size:12px}
.pot .v{font-family:'Newsreader',Georgia,serif;font-size:28px;line-height:1.1}
.pot p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 6px;gap:2px}
.split i{display:block}
.potlines{grid-column:1/-1;display:grid;gap:0;border-top:1px solid var(--line);margin:0 -16px -16px}
.potlines div{display:flex;justify-content:space-between;padding:10px 16px;font-size:14px;border-top:1px solid var(--line)}
.potlines div:first-child{border-top:0}
.potlines span{color:var(--ink-2)}

/* transactions */
.filters{display:flex;gap:8px;align-items:center;margin:4px 0 6px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;height:42px;margin:8px 0;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;height:100%;color:var(--ink)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px 6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.dayh .num{font-weight:500}
.bubbles{display:grid;gap:8px;padding:12px}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:13px}
.bub b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:22px;line-height:1.15}
.bub.a{background:var(--anna);color:var(--on-anna);border-bottom-left-radius:6px;justify-self:start}
.bub.y{background:var(--you);color:var(--on-you);border-bottom-right-radius:6px;justify-self:end;text-align:right}
.bub span{opacity:.8}
.note{font-size:13px;color:var(--ink-2);padding:10px 4px 0}

/* budgets */
.brow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow:hover{background:var(--surface-2)}
.brow[aria-current="true"]{background:var(--surface-2)}
.brow .nm{font-weight:500}
.brow .meter{grid-column:2/4;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.brow[aria-current="true"] .meter{background:var(--line-2)}
.brow .meter i{display:block;height:100%;background:var(--you)}
.brow .meter i.ov{background:var(--over-fill)}
.brow .cap{grid-column:2/4;font-size:12px;color:var(--ink-3)}
.brow .dcol{display:none}
.pill{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--you-soft);color:var(--you-text);white-space:nowrap}
.pill.ov{background:var(--over-fill);color:#fff}
.pill.zero{background:var(--surface-2);color:var(--ink-2)}
.chart{background:var(--surface);border-radius:18px;padding:16px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* analytics */
.answer{font-family:'Newsreader',Georgia,serif;font-size:30px;line-height:1.15;margin:8px 4px 6px;letter-spacing:-.01em}
.answer em{color:var(--you-text)}
.lede{color:var(--ink-2);margin:0 4px 18px;font-size:15px}
.hb{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.hb:first-child{border-top:0}
.hb .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.hb .nm svg{color:var(--ink-2)}
.hb .v{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.hb .track{grid-column:1/-1;position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.hb .track i{position:absolute;left:0;top:0;bottom:0;background:var(--you);border-radius:5px}
.hb .track u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.hb .d{grid-column:1/-1;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hb .d b{font-weight:500;color:var(--ink-2)}

/* states */
.sk{background:var(--skel);border-radius:6px;display:block;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{50%{opacity:.5}}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--you);color:var(--on-you)}
.btn:disabled{opacity:.38;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.empty .btn{margin-top:14px}
.err{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--over-soft);color:var(--ink);border-radius:14px;padding:10px 10px 10px 14px;font-size:13px;margin:0 0 12px}
.err button{font-weight:600;color:var(--over-text);padding:8px 10px;border-radius:10px}
.updating{opacity:.55}

/* prototype state switcher: owner-only chrome */
.proto{position:fixed;top:8px;right:8px;z-index:60;display:flex;gap:1px;padding:2px;border-radius:9px;background:var(--ink);opacity:.86;font-size:10px}
.proto button{color:var(--ground);padding:4px 7px;border-radius:7px;min-height:24px}
.proto button[aria-pressed="true"]{background:var(--ground);color:var(--ink)}
.proto[hidden]{display:none}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;z-index:50;background:var(--ground);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .in{flex:1;display:flex;flex-direction:column;padding:47px 16px 34px;min-height:0;overflow:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 6px}
.steps button{text-align:left;font-size:12px;color:var(--ink-3);padding:8px 0 4px;border-top:3px solid var(--line-2)}
.steps button.done{color:var(--ink-2);border-color:var(--you)}
.steps button[aria-current="step"]{color:var(--ink);border-color:var(--you);font-weight:600}
.amountbox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:150px}
.amountbox .big{margin:0;font-size:68px;font-variant-numeric:tabular-nums}
.amountbox .big.zero{color:var(--ink-3)}
.amountbox p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.off{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.off button{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:500;min-height:40px;color:var(--ink-2)}
.off button[aria-pressed="true"]{background:var(--you-soft);color:var(--you-text)}
.off svg.i{width:16px;height:16px}
.off .shmark svg{width:20px;height:16px}
.notein{width:100%;border:0;border-radius:12px;background:var(--surface);padding:12px 14px;margin:0 0 10px;outline:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:54px;border-radius:14px;background:var(--surface);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--surface-2)}
.next{margin-top:10px;width:100%;min-height:54px;font-size:16px}
.catlist{display:grid;gap:12px;margin-top:8px}
.catlist .lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin:6px 4px 0}
.catlist .row{min-height:52px}
.recent .row{min-height:60px}
.recent .row .nm{font-size:17px}
.namebox{margin-top:12px}
.namebox label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 4px 6px}
.namebox input{width:100%;height:56px;border:0;border-radius:14px;background:var(--surface);padding:0 16px;font-size:18px;outline:none}
.namebox input:focus{box-shadow:0 0 0 2px var(--focus)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sugs button{padding:9px 14px;border-radius:12px;background:var(--surface);font-weight:500;min-height:42px}
.summary{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:8px}
.summary .serif{font-size:30px}
.spacer{flex:1}
.toast{position:fixed;left:50%;bottom:118px;z-index:70;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:var(--ground);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:14px;font-size:14px;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--ground);font-weight:600;padding:8px 12px;border-radius:10px;background:rgba(127,127,127,.25)}
.detail .in{padding-top:47px}
.dl{background:var(--surface);border-radius:18px;margin-top:18px}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-top:1px solid var(--line);font-size:14px}
.dl div:first-child{border-top:0}
.dl dt{color:var(--ink-2)} .dl dd{margin:0;text-align:right}
.dhero{text-align:center;padding:24px 0 4px}
.dhero .big{margin:0;font-size:56px}
.dhero p{margin:6px 0 0;color:var(--ink-2)}
.deskdetail{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* desktop: the same app, more of it on one screen */
@media (min-width:960px){
  body{display:grid;grid-template-columns:232px 1fr}
  .nav{position:sticky;top:0;height:100vh;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:28px 16px;grid-row:1}
  .brand{display:block;font-family:'Newsreader',Georgia,serif;font-size:26px;padding:0 10px 22px}
  .addbtn{order:-1;width:auto;height:44px;border-radius:12px;display:flex;gap:8px;justify-content:center;margin:0 0 18px;font-weight:600;justify-self:auto}
  .addbtn span{display:inline}
  .addbtn svg.i{width:20px;height:20px}
  .brand{order:-2}
  .tab{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;border-radius:10px;min-height:42px;color:var(--ink-2)}
  .tab[aria-current="page"]{background:var(--surface);color:var(--ink)}
  #view{max-width:1120px;width:100%;padding:36px 48px 64px;margin:0;grid-column:2}
  .bar{display:none}
  .pagehead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 20px;gap:16px}
  .pagehead h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:36px;margin:0;letter-spacing:-.01em}
  .pagehead p{margin:0;color:var(--ink-2)}
  .pagehead .back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:14px;margin-bottom:6px}
  .cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:start}
  .cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cols > div > h2.sec:first-child{margin-top:0}
  .hero{padding:24px 28px 20px}
  .big{font-size:88px}
  .brow{grid-template-columns:28px minmax(0,1fr) 96px 96px 120px}
  .brow .dcol{display:block;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .brow .meter,.brow .cap{grid-column:2/6}
  .brow .cap{display:none}
  .thead{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 96px 120px;gap:12px;padding:0 14px 8px;font-size:12px;color:var(--ink-3)}
  .thead span{text-align:right}
  .deskdetail{display:block;position:sticky;top:36px}
  .proto{top:12px;right:16px}

/* the month as a row of days: personal in white, shared in saffron, the days still to come drawn open */
function daysSvg(m, loading){
  const W = 310, H = 72, step = W / NDAYS, bw = 6, cap = 180000;
  let s = `<svg viewBox="0 -2 ${W} ${H + 18}" role="img" aria-label="Spending per day this cycle">`;
  for (let i = 0; i < NDAYS; i++){
    const x = i * step + (step - bw) / 2, d = m.daily[i];
    if (i > todayIdx || loading){
      s += `<rect x="${x}" y="${H - 8}" width="${bw}" height="8" rx="3" fill="none" stroke="var(--on-you-line)" stroke-width="1.2"/>`;
      continue;
    }
    const tot = d.mine + d.shared;
    if (!tot){ s += `<rect x="${x}" y="${H - 2}" width="${bw}" height="2" rx="1" fill="var(--on-you-line)"/>`; continue; }
    const h = Math.max(4, Math.min(1, tot / cap) * (H - 4));
    const hs = h * d.shared / tot, hm = h - hs;
    const g = (justSaved && i === todayIdx) ? ' class="grow"' : '';
    s += `<g${g}>`;
    if (hm > 0) s += `<rect x="${x}" y="${H - hm}" width="${bw}" height="${hm}" rx="3" fill="var(--on-you)"/>`;
    if (hs > 0) s += `<rect x="${x}" y="${H - h}" width="${bw}" height="${Math.max(2, hs - (hm ? 1.5 : 0))}" rx="3" fill="var(--anna)"/>`;
    if (tot > cap) s += `<path d="M${x - 1} ${H - h + 12}l${bw + 2} -3M${x - 1} ${H - h + 16}l${bw + 2} -3" stroke="var(--you)" stroke-width="1.6"/>`;
    s += '</g>';
  }
  const tx = todayIdx * step + step / 2;
  s += `<circle cx="${tx}" cy="${H + 7}" r="2.4" fill="var(--on-you)"/>`;
  // money line against the days: how far the budgets have gone vs how far the cycle has
  const used = Math.min(1, m.flexSpent / m.flexBudget);
  s += `<line x1="0" x2="${W}" y1="${H + 14}" y2="${H + 14}" stroke="var(--on-you-line)" stroke-width="2" stroke-linecap="round"/>`;
  if (!loading) s += `<line x1="0" x2="${(W * used).toFixed(1)}" y1="${H + 14}" y2="${H + 14}" stroke="var(--on-you)" stroke-width="2" stroke-linecap="round"/>`;
  s += `<line x1="${todayIdx * step}" x2="${todayIdx * step}" y1="${H + 10}" y2="${H + 18}" stroke="var(--anna)" stroke-width="2" stroke-linecap="round"/>`;
  return s + '</svg>';
}

/* budgets */
function paceSvg(cid, T){
  const c = cats[cid];
  const cum = (list, start, n) => { const a = new Array(n).fill(0); list.forEach(t => { const i = Math.round((Date.parse(t.date + 'T00:00:00Z') - start) / DAY); if (i >= 0 && i < n) a[i] += t.amount_minor; }); for (let i = 1; i < n; i++) a[i] += a[i - 1]; return a; };
  const now = cum(T.filter(t => t.kind === 'expense' && t.category === cid), t0, todayIdx + 1);
  const lastN = (t0 - lastStart) / DAY;
  const last = cum(D.last_cycle_transactions.filter(t => t.kind === 'expense' && t.category === cid), lastStart, lastN);
  const W = 320, H = 150, L = 0, R = 316, top = 10;
  const max = Math.max(c.budget_minor, now[now.length - 1] || 0, last[last.length - 1] || 0) * 1.08 || 1;
  const X = i => L + (R - L) * (i + 1) / NDAYS, Y = v => top + (H - top) * (1 - v / max);
  const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const by = Y(c.budget_minor);
  const n = now[now.length - 1];
  return `<svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="${c.name}: spent by day this cycle against last cycle and the budget">
    <line x1="${L}" x2="${R}" y1="${H}" y2="${H}" stroke="var(--line-2)"/>
    <line x1="${L}" x2="${R}" y1="${by}" y2="${by}" stroke="var(--over-fill)" stroke-width="1.2"/>
    <path d="${path(last)}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-linejoin="round" opacity=".7"/>
    <path d="${path(now)}" fill="none" stroke="var(--you-text)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(todayIdx)}" cy="${Y(n)}" r="4" fill="var(--you-text)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H + 16}" font-size="10" fill="var(--ink-3)">${fTime(D.cycle.start)}</text>
    <text x="${X(todayIdx)}" y="${H + 16}" font-size="10" fill="var(--ink-3)" text-anchor="middle">Today</text>
  </svg>`;
}

/* Budgets: the cycle plan one tap away, and a budget you can set */
function budget(){

  const m = model(curT());
  return budgetC1()
    .replace('<div class="cols even">', `<div class="panel" style="margin-bottom:12px">${navRow('plan', 'sack', 'Cycle plan', `Salary ${kr(salaryOf(curT()), true)}, ${kr(Math.max(0, salaryOf(curT()) - m.budget), true)} to save if every budget is spent`)}</div><div class="cols even">`)
    .replace('<h2 class="sec">Pace through the cycle</h2>', `<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn ghost" data-go="f-budget" data-arg="${selCat}">${ic('edit')}Set budget</button></div><h2 class="sec">Pace through the cycle</h2>`);
}
const salaryOf = T => T.filter(t => t.kind === 'income' && t.category === 'salary').reduce((a, t) => a + t.amount_minor, 0);
function plan(){
  const T = planOff ? D.last_cycle_transactions : curT(), m = model(T), lbl = planOff ? D.last_cycle.label : D.cycle.label;
  const inc = T.filter(t => t.kind === 'income').reduce((a, t) => a + t.amount_minor, 0), sal = salaryOf(T);
  const leftInBudgets = budgets.reduce((a, c) => a + Math.max(0, c.budget_minor - (m.by[c.id] || 0)), 0);

  return `${header('Cycle plan', {big: 'Cycle plan', right: '<span></span>'})}${stateTop('Couldn’t refresh the plan.')}
  <div class="hrow" style="margin:0 0 12px"><div class="cyclepick"><button class="iconbtn" data-p="planprev" aria-label="Previous cycle" ${planOff ? 'disabled' : ''}>${ic('back')}</button><b>${lbl} cycle</b><button class="iconbtn" data-p="plannext" aria-label="Next cycle" ${planOff ? '' : 'disabled'}>${ic('chev')}</button></div></div>
  <div class="cols even"><div>
    <div class="stats"><div class="stat"><div class="big2 num">${kr(sal, true)}</div><p>Salary this cycle</p></div><div class="stat"><button data-go="f-target" style="text-align:left;width:100%"><div class="big2 num">${kr(XD.target, true)}</div><p>Cycle target to save ${ic('edit')}</p></button></div></div>

      <div class="flowrow"><span>If every budget is fully spent</span><b>${kr(inc - m.budget, true)} to save</b></div>
      <div class="flowrow"><span>Real available to save, with what is left in budgets kept back</span><b style="color:${inc - m.spent - leftInBudgets >= XD.target ? 'var(--in)' : 'var(--over-text)'}">${kr(inc - m.spent - leftInBudgets, true)}</b></div></div>
    <p class="note">${inc - m.spent - leftInBudgets >= XD.target ? 'On track for the target.' : `${kr(XD.target - (inc - m.spent - leftInBudgets), true)} short of the target.`}</p>

    <h2 class="sec">Notes</h2><div class="field"><textarea id="plannote" data-f="plannote" aria-label="Notes for this cycle" placeholder="Notes for this cycle">${esc(FS.plannote ?? 'Christmas gifts come out of the December cycle.')}</textarea><span class="hint">**bold** works</span></div>
  </div></div>`;

/* Where it went, plus money in and out by week, cycle or year */
function analytics(){
  const T = state === 'new' || state === 'empty' ? [] : txs.concat(D.last_cycle_transactions);
  const range = flowPer === 'week' ? [addDays(today, -6), today] : flowPer === 'cycle' ? [D.cycle.start, today] : ['2026-01-01', today];
  const L = T.filter(t => t.date >= range[0] && t.date <= range[1]);
  const inn = L.filter(t => t.kind === 'income').reduce((a, t) => a + t.amount_minor, 0), out = L.filter(t => t.kind === 'expense').reduce((a, t) => a + t.amount_minor, 0);
  const label = flowPer === 'week' ? 'Last 7 days' : flowPer === 'cycle' ? `${D.cycle.label} cycle so far` : '2026 so far, since your first cycle';
  let body;
  if (state === 'loading') body = `<div class="panel">${skRows(3)}</div>`;
  else if (!L.length) body = `<div class="panel"><div class="empty"><b>Nothing in or out yet</b>Money in and out shows here once you add it.</div></div>`;
  else {
    const days = [...new Set(L.map(t => t.date))].sort(); let run = 0; const pts = days.map(d => { L.filter(t => t.date === d).forEach(t => { if (t.kind === 'income') run += t.amount_minor; if (t.kind === 'expense') run -= t.amount_minor; }); return run; });
    const W = 320, H = 110, mn = Math.min(0, ...pts), mx = Math.max(1, ...pts), X = i => days.length < 2 ? W / 2 : 4 + (W - 8) * i / (days.length - 1), Y = v => 6 + (H - 12) * (1 - (v - mn) / (mx - mn));
    body = `<div class="panel"><div class="flowrow"><span>Money in</span><b style="color:var(--in)">${plus(inn, true)}</b></div><div class="flowrow"><span>Money out</span><b>${kr(out, true)}</b></div><div class="flowrow"><span>Left over</span><b>${inn - out < 0 ? kr(inn - out, true) : plus(inn - out, true)}</b></div></div>
      <div class="chart" style="margin-top:8px"><svg viewBox="0 0 ${W} ${H + 18}" role="img" aria-label="Running total of money in minus money out, ${label}">
        <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)"/><path d="${pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('')}" fill="none" stroke="var(--you-text)" stroke-width="2.2" stroke-linejoin="round"/>
        <text x="0" y="${H + 14}" font-size="10" fill="var(--ink-3)">${fTime(days[0])}</text><text x="${W}" y="${H + 14}" font-size="10" fill="var(--ink-3)" text-anchor="end">${fTime(days[days.length - 1])}</text></svg>
        <div class="legend"><span><i style="background:var(--you-text)"></i>Money in minus money out, day by day</span></div></div>`;
  }
  return analyticsC1() + `<div style="max-width:760px"><h2 class="sec" style="margin-top:32px">Money in and out</h2><div class="hrow" style="margin:0 0 10px">${segOf('flow', flowPer, [['week', 'Week'], ['cycle', 'Cycle'], ['year', 'Year']])}<span class="note" style="padding:0">${label}</span></div>${body}</div>`;
}

    <div class="panel" style="margin-top:12px;padding:16px"><p class="owes">Your part of <span class="num">${kr(m.sharedSpend, true)}</span> spent together is <em class="num">${kr(yours, true)}</em></p><p class="note" style="padding:6px 0 0">Your part follows what you each put in, ${m.myPct} of every 100 kr. Nobody types a ratio.</p></div>

/* Bank: savings, loans and money owed to you */
function bank(){

    <div class="stat deskonly"><div class="big2 num">${kr(openLo.reduce((a, l) => a + l.remaining, 0), true)}</div><p>Still to repay</p></div><div class="stat deskonly"><div class="big2 num">${kr(openOw.reduce((a, l) => a + l.remaining, 0), true)}</div><p>Owed to you</p></div></div>
  <div class="cols3">
    <div>${sec('Savings', 'f-savings', sv.map(s => item('f-savings', s, s.mark, kr(s.balance, true), s.goal ? `${pctOf(s.balance, s.goal)} of 100 toward ${kr(s.goal, true)}` : 'No goal set yet', s.goal ? Math.min(100, pctOf(s.balance, s.goal)) : null)).join(''), 'No savings yet. Name a pot and set a goal.')}</div>

function save(another){
  const t = {id: editId || 'n' + Date.now(), date: addDays(today, -A.dOff), amount_minor: amtMinor(), kind: A.kind, category: A.kind === 'topup' ? null : A.cat, name: A.name.trim(), shared: A.kind === 'topup' || (A.kind === 'expense' && A.shared), paid_by: 'me'};
  if (A.note) t.note = A.note;
  txs = [t].concat(txs.filter(x => x.id !== t.id)).sort((a, b) => b.date.localeCompare(a.date));
  if (state === 'new' && t.category === 'salary') state = 'content';
  const was = editId; editId = null;
  const msg = state === 'offline' ? `Saved on this phone, ${esc(t.name)}. It syncs when you’re online.` : was ? `Changed ${esc(t.name)}` : `Saved ${kr(t.amount_minor)}, ${esc(t.name)}`;
  if (another === true) { resetAdd(); renderAdd(); toast(msg, t.id); return; }
  if (state !== 'offline' && state !== 'new') state = 'content';
  closeAdd(); closeDetail();
  toast(msg, was ? null : t.id);
}

        <div class="dhero"><div class="big serif num">${val ? kr(val, true) : 'Settled'}</div><p>${kind === 'savings' ? (x.goal ? `of ${kr(x.goal, true)} goal` : 'No goal set yet') : kind === 'loan' ? `left to repay of ${kr(x.principal, true)}` : `still owed of ${kr(x.principal, true)}`}</p></div>
        <div style="margin:18px 0 12px">${segOf('act', act, acts)}</div>${amountField('Amount', 'amt1', 0)}
        <button class="btn" data-p="bankact" style="width:100%">Save</button>
        <h2 class="sect">History</h2><div class="panel">${x.history.map(e => `<div class="row"><span class="who cat">${ic(e.kind === 'add' || e.kind === 'lent' || e.kind === 'borrowed' ? 'in' : e.kind === 'set' ? 'edit' : 'out')}</span><span><div class="nm">${word[e.kind]}</div><div class="meta">${fDay.format(dUTC(e.date))}</div></span><span class="amt">${kr(e.amount, true)}</span></div>`).join('') || '<div class="empty">No history yet.</div>'}</div>`;
    }
  } else if (formId === 'f-import') {
    const rows = XD.imports;
    const card = r => `<div class="icard"><div class="top"><span class="nm">${esc(r.name)}</span><b class="num ${r.kind === 'income' ? '' : ''}" style="${r.kind === 'income' ? 'color:var(--in)' : ''}">${r.kind === 'income' ? plus(r.amount) : kr(r.amount)}</b></div>
      <div class="meta">${ic('cal')}${dayLabel(r.date)}<span>·</span>${r.cat ? `${ic(cats[r.cat].mark)}${cats[r.cat].name}` : '<span class="need">Needs a category</span>'}</div>
      <div class="acts"><button data-p="impcat" data-arg="${r.id}">${r.cat ? 'Change category' : 'Pick a category'}</button><button data-p="impdrop" data-arg="${r.id}">Remove</button></div>
      ${FS.impPick === r.id ? `<div class="panel">${D.categories.filter(c => c.kind === r.kind).map(c => `<button class="row" data-p="impset" data-arg="${r.id}:${c.id}"><span class="who cat">${ic(c.mark)}</span><span class="nm">${c.name}</span><span></span></button>`).join('')}</div>` : ''}</div>`;
    const need = rows.filter(r => !r.cat).length;
    h = fhead('Check the import') + `<p class="note" style="padding:4px 4px 12px">${rows.length} found${FS.src === 'csv' ? ' in the statement' : ' on the receipt'}. Nothing saves until you do.</p>
      <div style="display:grid;gap:8px">${rows.map(card).join('') || '<div class="panel"><div class="empty"><b>No transactions left</b>Close to start again.</div></div>'}</div>
      <div class="formfoot" style="position:sticky;bottom:0;background:var(--ground)"><button class="btn" data-p="impsave" ${rows.length && !need ? '' : 'disabled'}>${need ? `${need} still need a category` : `Save ${rows.length}`}</button></div>`;
  } else if (formId === 'f-bulkcat') {
    h = fhead('Category for ' + selSet.size) + `<div class="panel">${budgets.map(c => `<button class="row" data-p="bulkcatset" data-arg="${c.id}"><span class="who cat">${ic(c.mark)}</span><span class="nm">${c.name}</span><span></span></button>`).join('')}</div>`;
  } else if (formId === 'f-bulkdate') {
    h = fhead('Date for ' + selSet.size) + `<label class="field"><span>Date</span><input type="date" id="bd" data-f="bd" value="${FS.bd || today}"></label><p class="note">Amount, name and category stay as they are.</p><div class="formfoot"><button class="btn" data-p="bulkdateset">Apply date</button></div>`;
  } else if (formId === 'f-bulkdel') {
    h = fhead('Delete ' + selSet.size) + `<div class="dhero"><div class="big serif num">${selSet.size}</div><p>transactions will be deleted for good.</p></div><div class="formfoot"><button class="btn ghost" data-p="fclose">Cancel</button><button class="btn danger" data-p="bulkdelyes">Delete ${selSet.size}</button></div>`;
  }
  el.innerHTML = h;
}
function formAction(p, arg){
  const amt = () => { const v = FS.amt1; if (v === undefined) return undefined; const m = parseMinor(v); if (m === null && v !== '') { FS.err = 'amt1'; renderForm(); return null; } return m || 0; };
  switch (p){
    case 'fclose': FS = {plannote: FS.plannote, rq: FS.rq}; return closeForm();
    case 'pickicon': FS.icon = arg; return renderForm();
    case 'fdel': FS.delAsk = true; return renderForm();
    case 'fdelno': FS.delAsk = false; return renderForm();
    case 'fdelyes': {
      if (formId === 'f-rule') XD.rules = XD.rules.filter(r => r.id !== formArg);
      if (formId === 'f-person') XD.people = XD.people.filter(r => r.id !== formArg);
      if (formId === 'f-savings') XD.savings = XD.savings.filter(r => r.id !== formArg);
      if (formId === 'f-loan') XD.loans = XD.loans.filter(r => r.id !== formArg);
      if (formId === 'f-owed') XD.owed = XD.owed.filter(r => r.id !== formArg);
      FS = {}; closeForm(); return toast('Deleted');
    }
    case 'budgetsave': { const m = amt(); if (m === null) return; if (formId === 'f-target') XD.target = m ?? XD.target; else { const c = cats[formArg] || cats[selCat]; if (m !== undefined) c.budget_minor = m || null; if (!budgets.includes(c) && c.budget_minor) budgets.push(c); } FS = {}; closeForm(); return toast('Budget saved'); }
    case 'budgetrm': { const c = cats[formArg] || cats[selCat]; FS = {}; closeForm(); return toast(`${c.name} keeps no budget now`); }
    case 'catsave': if (FS.cname !== undefined && !FS.cname.trim()) { FS.err = 'cname'; return renderForm(); } FS = {}; closeForm(); return toast('Category saved');
    case 'opensub': FS = {}; formArg = arg; return renderForm();
    case 'addsub': FS = {}; formArg = 'new'; return renderForm();
    case 'personsave': if (FS.pn !== undefined && FS.pn.trim()) { if (formArg === 'new') XD.people.push({id: 'p' + Date.now(), name: FS.pn.trim()}); else XD.people.find(x => x.id === formArg).name = FS.pn.trim(); } FS = {}; closeForm(); return toast('Saved');
    case 'rcat': FS.cat = arg; return renderForm();
    case 'rulesave': {
      const r = XD.rules.find(x => x.id === formArg), get = k => FS[k] ?? r?.[k];
      if (!(get('pattern') || '').trim()) { FS.err = 'pattern'; return renderForm(); }
      if (!get('block') && !get('topup') && !get('cat')) { FS.err = 'cat'; return renderForm(); }
      const nr = {id: r?.id || 'r' + Date.now(), pattern: get('pattern').trim().toLowerCase(), match: get('match') || 'exact', kind: get('kind') || 'expense', cat: get('cat'), block: !!get('block'), topup: !!get('topup'), note: get('note')};
      XD.rules = r ? XD.rules.map(x => x.id === r.id ? nr : x) : [nr].concat(XD.rules);
      FS = {}; closeForm(); return toast('Rule saved');
    }
    case 'bankedit': FS.editing = true; return renderForm();
    case 'banksave': { if (FS.bname !== undefined && !FS.bname.trim()) { FS.err = 'bname'; return renderForm(); } const m = amt(); if (m === null) return; const kind = formId.slice(2), list = kind === 'savings' ? XD.savings : kind === 'loan' ? XD.loans : XD.owed, x = list.find(i => i.id === formArg);
      if (!x) { if (!(FS.bname || '').trim()) { FS.err = 'bname'; return renderForm(); } list.push(kind === 'savings' ? {id: 's' + Date.now(), name: FS.bname.trim(), mark: FS.icon || 'savings', balance: 0, goal: m || 0, history: []} : {id: 'x' + Date.now(), name: FS.bname.trim(), principal: m || 0, remaining: m || 0, history: [{date: today, kind: kind === 'loan' ? 'borrowed' : 'lent', amount: m || 0}]}); }
      else { if (FS.bname) x.name = FS.bname.trim(); if (m !== undefined) kind === 'savings' ? x.goal = m : x.principal = m; if (FS.icon) x.mark = FS.icon; }
      FS = {}; closeForm(); return toast('Saved'); }
    case 'bankact': { const m = amt(); if (!m) { FS.err = 'amt1'; return renderForm(); } const kind = formId.slice(2), list = kind === 'savings' ? XD.savings : kind === 'loan' ? XD.loans : XD.owed, x = list.find(i => i.id === formArg), act = FS.act || {savings: 'add', loan: 'repaid', owed: 'repaid'}[kind];
      if (kind === 'savings') x.balance = act === 'add' ? x.balance + m : act === 'remove' ? Math.max(0, x.balance - m) : m; else x.remaining = act === 'repaid' ? Math.max(0, x.remaining - m) : x.remaining + m;
      if (act === 'borrowed' || act === 'lent') x.principal += m;
      x.history.unshift({date: today, kind: act, amount: m}); FS = {}; renderForm(); return toast('Saved'); }
    case 'impcat': FS.impPick = FS.impPick === arg ? null : arg; return renderForm();
    case 'impset': { const [id, c] = arg.split(':'); XD.imports.find(r => r.id === id).cat = c; FS.impPick = null; return renderForm(); }
    case 'impdrop': XD.imports = XD.imports.filter(r => r.id !== arg); return renderForm();
    case 'impsave': { const n = XD.imports.length; XD.imports.forEach(r => txs.unshift({id: 'm' + r.id + Date.now(), date: r.date, amount_minor: r.amount, kind: r.kind, category: r.cat, name: r.name, shared: false, paid_by: 'me'})); txs.sort((a, b) => b.date.localeCompare(a.date)); FS = {}; closeForm(); return toast(`Saved ${n} transactions`); }
    case 'bulkcatset': txs.forEach(t => { if (selSet.has(t.id) && t.kind === 'expense') t.category = arg; }); return bulkDone(`Moved ${selSet.size} to ${cats[arg].name}`);
    case 'bulkdateset': { const d = FS.bd || today; txs.forEach(t => { if (selSet.has(t.id)) t.date = d; }); txs.sort((a, b) => b.date.localeCompare(a.date)); return bulkDone(`Changed the date of ${selSet.size}`); }
    case 'bulkdelyes': { const n = selSet.size; txs = txs.filter(t => !selSet.has(t.id)); return bulkDone(`Deleted ${n}`); }
  }
}
function bulkDone(msg){ selSet = new Set(); selMode = false; FS = {}; closeForm(true); render(); toast(msg); }

/* the screens, the chrome around them, and routing that knows the new places */
const MORE = {home, transactions, budget, analytics, shared, bank, categories, rules, alerts, profile, plan, signin, signup, consent, callback};
const PHONE_TAB = {plan: 'budget', bank: 'home', categories: 'home', rules: 'home', alerts: 'home', profile: 'home', analytics: 'home'}, DESK_TAB = {plan: 'budget'};
const DEF = {'f-budget': 'eating_out', 'f-target': 'target', 'f-category': 'eating_out', 'f-person': 'p1', 'f-rule': 'r1', 'f-savings': 's1', 'f-loan': 'l1', 'f-owed': 'o1'};
function render(){
  const s = screen === 'add' ? under : screen, auth = AUTH.includes(s);
  document.getElementById('view').innerHTML = MORE[s]();
  document.body.classList.toggle('authpage', auth);
  if (state === 'offline' && !auth) { const h = document.querySelector('#view .pagehead'); if (h) h.insertAdjacentHTML('afterend', offBar()); }
  decorateSelect();
  syncChrome();
}
function syncChrome(){
  const s = screen === 'add' ? under : screen, wide = matchMedia('(min-width:960px)').matches;
  const cur = (wide ? DESK_TAB[s] : PHONE_TAB[s]) || s;
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.go === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const pr = document.getElementById('proto'); pr.hidden = screen === 'add' || (AUTH.includes(s) && s !== 'callback');
  pr.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.state === state));
}
function go(s, push){
  let st, a; [s, st, a] = String(s).split('~'); if (st) state = st;
  if (FORMS[s]) { FS = {}; return openForm(s, a); }
  if (formId) closeForm(true);
  if (document.getElementById('detail').classList.contains('on')) closeDetail();
  selMode = s === 'select'; selSet = new Set(); if (s === 'select') s = 'transactions';
  if (s === 'detail') { goC1('transactions'); return openDetail(txs[0].id); }
  if (s === 'import') { goC1('home'); openAdd(); A.step = 'import'; return renderAdd(); }
  if (s === 'add' && st === 'new') { goC1('home'); return startSalary(); }
  goC1(s, push);
}
function startSalary(){ openAdd(); A.kind = 'income'; A.cat = 'salary'; renderAdd(); }

/* clicks and typing for everything above; runs before the direction's own handler */
document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-go]'); if (!el) return;
  const d = el.dataset;
  if (d.go && (FORMS[d.go] || d.go.includes('~') || d.push)) { e.stopPropagation(); if (FORMS[d.go]) { FS = {}; return openForm(d.go, d.arg); } return go(d.go, !!d.push); }
  if (selMode && d.tx) { e.stopPropagation(); selSet.has(d.tx) ? selSet.delete(d.tx) : selSet.add(d.tx); return decorateSelect(); }
  if (d.act === 'save' && document.getElementById('add').classList.contains('on')) { e.stopPropagation(); if (A.name.trim()) save(); return; }
  if (d.act === 'next' && A && A.kind === 'topup') { e.stopPropagation(); if (amtMinor() > 0) { A.step = 3; A.name = A.name || 'Top-up, shared account'; renderAdd(); } return; }
  if (d.act === 'add' && state === 'new') { e.stopPropagation(); return startSalary(); }
  if (d.act === 'kind') return;
  if (d.pick && A && A.step === 3) { e.stopPropagation(); A.cat = d.pick; sugOff = false; return renderAdd(); }
  if (!d.p) return;
  e.stopPropagation();
  const p = d.p, arg = d.arg;
  if (formId && document.getElementById('form').contains(el)) {
    if (p === 'seg') { const [k, v] = arg.split(':'); FS[{ckind: 'kind', rkind: 'kind', match: 'match', act: 'act'}[k] || k] = v; if (k === 'rkind') FS.cat = null; return renderForm(); }
    if (p === 'toggle') { const r = XD.rules.find(x => x.id === formArg); FS[arg] = !(FS[arg] ?? r?.[arg]); return renderForm(); }
    return formAction(p, arg);
  }
  switch (p){
    case 'seg': { const [k, v] = arg.split(':'); if (k === 'flow') flowPer = v; else if (k === 'shared') sharedPer = v; else FS[k] = v; return render(); }
    case 'toggle': if (arg === 'reminder') { XD.reminder = !XD.reminder; render(); return toast(XD.reminder ? 'Reminder on, every day at 18:00' : 'Daily reminder off'); } return;
    case 'salary': return startSalary();
    case 'select': selMode = true; selSet = new Set(); return render();
    case 'selcancel': selMode = false; selSet = new Set(); return render();
    case 'selall': txList(curT()).forEach(t => selSet.add(t.id)); return render();
    case 'bulkmove': { const pick = txs.filter(t => selSet.has(t.id)), to = !pick.every(t => t.shared); pick.forEach(t => { if (t.kind === 'expense') t.shared = to; }); return bulkDone(`Moved ${pick.length} to ${to ? 'shared' : 'yours'}`); }
    case 'older': olderOpen++; return render();
    case 'planprev': planOff = 1; return render();
    case 'plannext': planOff = 0; return render();
    case 'addshared': openAdd(); A.shared = true; return renderAdd();
    case 'sharedall': filter = 'shared'; return go('transactions', true);
    case 'avatar': return toast('Pick a photo from your phone');
    case 'export': return toast(`Exported ${(FS.fmt || 'csv').toUpperCase()}, ${fTime(FS.ex1 || D.last_cycle.start)} – ${fTime(FS.ex2 || today)}`);
    case 'del': delAsk = true; return refreshDetail(arg);
    case 'delno': delAsk = false; return refreshDetail();
    case 'delyes': { const t = txs.find(x => x.id === arg); txs = txs.filter(x => x.id !== arg); delAsk = false; selTx = null; closeDetail(); render(); return toast(`Deleted ${esc(t.name)}`); }
    case 'dup': { const t = txs.find(x => x.id === arg), n = {...t, id: 'n' + Date.now(), date: today}; txs = [n].concat(txs); closeDetail(); render(); return toast(`Duplicated ${esc(t.name)} to today`, n.id); }
    case 'move': { const t = txs.find(x => x.id === arg); t.shared = !t.shared; refreshDetail(arg); render(); return toast(t.shared ? 'Shared with Anna' : 'Now yours only'); }
    case 'edit': { const t = txs.find(x => x.id === arg); closeDetail(); openAdd(); editId = t.id; Object.assign(A, {step: 1, amt: minorIn(t.amount_minor), kind: t.kind, shared: t.shared, cat: t.category, name: t.name, note: t.note ?? null, dOff: Math.max(0, Math.round((Date.parse(today) - Date.parse(t.date)) / DAY))}); return renderAdd(); }
    case 'ruleFrom': { const t = txs.find(x => x.id === arg); closeDetail(); FS = {pfill: t.name.toLowerCase(), cat: t.category, match: 'exact'}; return openForm('f-rule', 'new'); }
    case 'kind': A.kind = A.kind === arg ? 'expense' : arg; A.shared = false; A.cat = null; return renderAdd();
    case 'duplast': { const t = txs.find(x => x.kind === 'expense'); Object.assign(A, {amt: minorIn(t.amount_minor), cat: t.category, name: t.name, shared: t.shared, step: 3}); return renderAdd(); }
    case 'saveanother': if (A.name.trim()) save(true); return;
    case 'nosug': sugOff = true; renderAdd(); return toast(`No more suggestions for ${esc(A.name.trim())}`);
    case 'importpick': A.step = 'import'; return renderAdd();
    case 'importgo': A.step = 'busy'; A.src = arg; renderAdd(); return setTimeout(() => { closeAdd(); FS = {src: arg}; openForm('f-import'); }, 900);
  }
}, true);
function refreshDetail(id){ const t = txs.find(x => x.id === (id || selTx || document.querySelector('#detailin [data-arg]')?.dataset.arg)); if (!t) return; if (document.getElementById('detail').classList.contains('on')) document.getElementById('detailin').innerHTML = `<div class="bar" style="display:grid"><button class="iconbtn" data-act="closedetail" aria-label="Close">${ic('close')}</button><h1>${t.kind === 'expense' ? 'Expense' : t.kind === 'income' ? 'Money in' : 'Moved'}</h1><span></span></div>${detailBody(t)}`; else { selTx = t.id; render(); } }
document.addEventListener('input', e => {
  const k = e.target.dataset.f; if (!k) return;
  FS[k] = e.target.value; if (FS.err === k || (k === 'amt1' && FS.err === 'amt1')) { FS.err = null; }
  if (k === 'rq' || k === 'cq') { const pos = e.target.selectionStart; k === 'rq' ? render() : renderAdd(); const i = document.getElementById(k); i.focus(); i.setSelectionRange(pos, pos); }
  if (['ex1', 'ex2'].includes(k)) render();
}, true);
document.addEventListener('input', e => { if (e.target.id === 'nm' && A && A.step === 3) { const pos = e.target.selectionStart; renderAdd(); const i = document.getElementById('nm'); i.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && formId) { e.stopPropagation(); closeForm(); } }, true);
document.getElementById('scrim').addEventListener('click', e => { if (formId) { e.stopImmediatePropagation(); closeForm(); } }, true);
matchMedia('(min-width:960px)').addEventListener('change', () => render());

/* start */
document.querySelectorAll('[data-ic]').forEach(e => { e.outerHTML = ic(e.dataset.ic); });
const Q = new URLSearchParams(location.search), PR = window.PROTO || {};
document.documentElement.dataset.theme = (PR.theme || Q.get('theme')) === 'dark' ? 'dark' : 'light';
const start = PR.screen || Q.get('screen') || 'home';
if (start === 'add') { screen = 'home'; render(); openAdd(); } else { const b0 = start.split('~')[0]; go(SCREENS.includes(b0) || FORMS[b0] || ['select', 'detail', 'import'].includes(b0) ? start : 'home'); }
})();
</script>
