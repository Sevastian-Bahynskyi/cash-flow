<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow: Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
/* Colour rule: signal colours, as on a station board. The band shows the state of the cycle
   (green while the budget holds, red once it is spent). Amber is the shared account, everywhere.
   Red is reserved for over. Ink and paper carry everything else. */
:root{
  --paper:#FFFFFF; --ground:#F2F2EF; --ink:#111214; --ink-2:#3F4248; --ink-3:#5E626A;
  --rule:#E1E1DC; --rule-strong:#111214;
  --band:#0C5A3B; --band-ink:#FFFFFF; --band-2:rgba(255,255,255,.72); --band-cell:rgba(255,255,255,.22);
  --band-over:#B3261E;
  --shared:#E3A600; --shared-text:#7A5600; --shared-bg:#FCF1CF; --shared-band:rgba(227,166,0,.38);
  --personal-band:rgba(17,18,20,.16);
  --in:#137A47; --over:#C0262D; --over-bg:#C0262D; --over-ink:#FFFFFF; --over-soft:#FBE3E1;
  --bar:#111214; --bar-2:#BDBFC4;
  --accent:#111214; --accent-ink:#FFFFFF;
  --focus:#2F6FEB;
  --cond:72%;
  --f:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"]{
  --paper:#141518; --ground:#0B0C0E; --ink:#F1F1EE; --ink-2:#C2C4C8; --ink-3:#9A9DA4;
  --rule:#26282D; --rule-strong:#F1F1EE;
  --band:#0E6A46; --band-ink:#FFFFFF; --band-2:rgba(255,255,255,.75); --band-cell:rgba(255,255,255,.2);
  --band-over:#A8241D;
  --shared:#F2C230; --shared-text:#F2C230; --shared-bg:#2E2610; --shared-band:rgba(242,194,48,.42);
  --personal-band:rgba(241,241,238,.18);
  --in:#4FD18E; --over:#FF6B5E; --over-bg:#A8241D; --over-ink:#FFFFFF; --over-soft:#3A1715;
  --bar:#F1F1EE; --bar-2:#4A4D54;
  --accent:#F1F1EE; --accent-ink:#0B0C0E;
  --focus:#7FA8FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.38;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cond{font-stretch:var(--cond)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:none}
svg.i.s{width:16px;height:16px}

/* ---------- shell ---------- */
.app{min-height:100%}
.desk-nav{display:none}
.wrap{padding:0 16px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:2px solid var(--rule-strong);display:grid;grid-template-columns:repeat(4,1fr) 76px;padding-bottom:34px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;font-size:11.5px;color:var(--ink-3);border-right:1px solid var(--rule)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--ink)}
.tab-add{background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;height:58px}
.tab-add svg{width:28px;height:28px;stroke-width:2}

/* band */
.band{background:var(--band);color:var(--band-ink);margin:0 -16px;padding:47px 16px 16px}
.band.over{background:var(--band-over)}
.band .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.band .r .muted{color:var(--band-2)}
.band h1{font-size:15px;font-weight:600;margin:0}
.hero{font-stretch:var(--cond);font-weight:600;font-size:84px;line-height:.92;letter-spacing:-.01em;margin:18px 0 6px;font-variant-numeric:lining-nums}
.hero .frac{font-size:.5em;vertical-align:.72em;letter-spacing:0}
.hero .cur{font-size:.32em;margin-left:6px;font-weight:500;letter-spacing:0}
.band .meta{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:end;margin-top:10px;font-size:14px;color:var(--band-2)}
.band .meta b{display:block;font-stretch:var(--cond);font-size:40px;line-height:1;font-weight:600;color:var(--band-ink)}
.band .meta .rt{text-align:right}
.strip{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-top:16px}
.strip i{height:16px;background:var(--band-cell)}
.strip i.past{background:var(--band-ink);opacity:.82}
.strip i.today{background:var(--band-ink);opacity:1;box-shadow:0 0 0 2px var(--band),0 0 0 3.5px var(--band-ink)}
.strip-l{display:flex;justify-content:space-between;font-size:12px;color:var(--band-2);margin-top:6px}

/* timetable sections */
.sec{margin-top:24px}
.sec > h2{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:0 0 8px;border-bottom:2px solid var(--rule-strong);font-size:16px;font-weight:600}
.sec > h2 small{font-weight:400;font-size:13.5px;color:var(--ink-3)}
.sec > h2.red{border-color:var(--over)}
.sec > h2.amber{border-color:var(--shared)}
.tt{background:var(--paper)}
.trow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 12px 11px 10px;border-bottom:1px solid var(--rule);width:100%;text-align:left;min-height:48px}
.trow .t small{display:block;font-size:13px;color:var(--ink-3)}
.fig{font-stretch:var(--cond);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;text-align:right;white-space:nowrap}
.fig.muted{color:var(--ink-3)}
.fig.in{color:var(--in)}
.fig.over{color:var(--over)}
.fig small{font-stretch:100%;font-size:12.5px;font-weight:400;color:var(--ink-3);margin-left:4px}
.mk{width:14px;height:14px;display:grid;place-items:center;color:var(--ink-3)}
.mk.p::before{content:"";width:10px;height:10px;background:var(--ink)}
.mk.s::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--shared)}
.mk.m::before{content:"";width:10px;height:10px;border:1.5px dashed var(--ink-3)}
.mk.o::before{content:"";width:10px;height:10px;background:var(--over)}
.trow.total{border-bottom:2px solid var(--rule-strong)}
.trow.total .fig{font-weight:600}

/* pace bars */
.pace{background:var(--paper);padding:14px 12px 12px}
.pbar{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.pbar span{font-size:13.5px;color:var(--ink-2)}
.pbar .tr{height:14px;background:var(--rule);position:relative}
.pbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.pbar b{font-stretch:var(--cond);font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pace p{margin:10px 0 0;font-size:14px;color:var(--ink-2)}

/* shared */
.pair{display:flex}
.pair span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--paper)}
.pair span:first-child{background:var(--shared);color:#1D1600}
.pair span+span{margin-left:-9px;background:var(--ink);color:var(--paper)}
.shared-box{background:var(--paper);padding:14px 12px}
.shared-box .top{display:flex;justify-content:space-between;align-items:center}
.shared-box .big{font-stretch:var(--cond);font-size:44px;font-weight:600;line-height:1;margin:12px 0 2px;font-variant-numeric:lining-nums}
.shared-box .lbl{font-size:13.5px;color:var(--ink-3)}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:2px solid var(--shared)}
.duo > div{padding:10px 0 0}
.duo > div + div{border-left:1px solid var(--rule);padding-left:12px}
.duo h3{margin:0 0 6px;font-size:13.5px;font-weight:600}
.duo .l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);padding:3px 0}
.duo .l b{font-stretch:var(--cond);font-size:16px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.splitbar{display:flex;height:10px;margin-top:12px;gap:2px}
.splitbar i{background:var(--ink)}
.splitbar i+i{background:var(--shared)}

/* over list */
.overrow{display:grid;grid-template-columns:22px 1fr auto 16px;gap:10px;align-items:center;padding:11px 12px 11px 10px;border-bottom:1px solid var(--rule);width:100%;text-align:left;background:var(--paper)}
.overrow .t small{display:block;font-size:13px;color:var(--ink-3)}

/* transactions */
.filters{display:flex;gap:8px;align-items:center;margin:14px 0 4px}
.seg{display:inline-flex;border:1.5px solid var(--rule-strong)}
.seg button{padding:7px 12px;font-size:14px;min-height:38px;color:var(--ink-2)}
.seg button + button{border-left:1.5px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--rule-strong);height:40px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px;color:var(--ink)}
.day{margin-top:18px}
.day h3{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:6px 0;border-bottom:2px solid var(--rule-strong);font-size:15px;font-weight:600}
.day h3 .fig{font-size:16px;font-weight:500;color:var(--ink-2)}
.tx{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px 10px 10px;border-bottom:1px solid var(--rule);min-height:56px;background:var(--paper)}
.tx .nm{font-size:15.5px}
.tx .meta{display:block;font-size:13px;color:var(--ink-3)}
.tx .meta b{font-weight:600;color:var(--shared-text)}
.tx.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--shared-bg)}to{background:var(--paper)}}
.detail{background:var(--paper);margin:0;padding:4px 12px 12px 42px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.detail dt{color:var(--ink-3)}
.detail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.ttable{width:100%;border-collapse:collapse;background:var(--paper)}
.ttable th{font-weight:600;font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:2px solid var(--rule-strong);color:var(--ink-2)}
.ttable th.r, .ttable td.r{text-align:right}
.ttable td{padding:0 12px;height:48px;border-bottom:1px solid var(--rule);font-size:14.5px}
.ttable td.d{color:var(--ink-3);white-space:nowrap}
.ttable tr.dayhead td{height:40px;font-weight:600;border-bottom:1px solid var(--rule-strong);background:var(--ground)}
.ttable tr.click{cursor:pointer}
.ttable tr.click:hover td{background:color-mix(in srgb,var(--ink) 4%,var(--paper))}
.acct{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.acct.s{color:var(--shared-text);font-weight:600}
.acct.m{color:var(--ink-3)}

/* budget */
.bhead{padding:12px 0 0}
.bhead .hero{color:var(--ink);font-size:72px;margin:6px 0 4px}
.bhead .of{font-size:15px;color:var(--ink-2)}
.overband{background:var(--over-bg);color:var(--over-ink);display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;margin-top:14px}
.overband b{font-stretch:var(--cond);font-size:30px;font-weight:600}
.leftband{background:var(--band);color:var(--band-ink);display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;margin-top:14px}
.leftband b{font-stretch:var(--cond);font-size:30px;font-weight:600}
.chart{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f);font-size:11.5px;fill:var(--ink-3)}
.chart .lab{fill:var(--ink);font-weight:600}
.chart .col{fill:var(--bar)}
.chart .col.o{fill:var(--over)}
.chart .col.f{fill:var(--bar-2)}
.chart .bl{stroke:var(--ink);stroke-width:1.5}
.chart .ll{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:0}
.vs{display:grid;grid-template-columns:1fr 1fr;background:var(--paper)}
.vs > div{padding:12px}
.vs > div + div{border-left:1px solid var(--rule)}
.vs span{font-size:13px;color:var(--ink-3)}
.vs b{display:block;font-stretch:var(--cond);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.vs b.muted{color:var(--ink-3)}
.vs p{grid-column:1/-1;margin:0;padding:10px 12px;border-top:1px solid var(--rule);font-size:14px}
.brow{display:grid;grid-template-columns:1fr 84px 92px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}
.brow[aria-current="true"]{box-shadow:inset 4px 0 0 var(--ink)}
.brow .c{font-size:15px}
.brow .c small{display:block;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.brow .m{height:8px;background:var(--rule);position:relative}
.brow .m i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.brow .m i.o{background:var(--over)}
.brow .fig{font-size:17px}
.bh{display:grid;grid-template-columns:1fr 84px 92px;gap:10px;padding:8px 12px;font-size:12.5px;color:var(--ink-3);background:var(--paper);border-bottom:1px solid var(--rule)}
.bh span:last-child{text-align:right}

/* analytics */
.answer{font-stretch:var(--cond);font-weight:600;font-size:40px;line-height:1.02;margin:14px 0 8px;letter-spacing:-.005em}
.answer .up{color:var(--over)}
.answer .down{color:var(--in)}
.lead{font-size:14.5px;color:var(--ink-2);margin:0 0 4px}
.sankey{background:var(--paper);padding:14px 12px}
.sankey .pb{fill:var(--personal-band)}
.sankey .sb{fill:var(--shared-band)}
.sankey .pn{fill:var(--ink)}
.sankey .sn{fill:var(--shared)}
.sankey .cn{fill:var(--ink)}
.sankey .nm{fill:var(--ink);font-size:13.5px;font-weight:600}
.sankey .am{fill:var(--ink);font-size:13.5px;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.sankey .up{fill:var(--over)}
.sankey .dn{fill:var(--in)}
.sankey .eq{fill:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* states */
.state-msg{padding:20px 12px;background:var(--paper)}
.state-msg p{margin:0 0 12px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.skel{height:12px;background:var(--rule);margin:18px 12px}
.skel.w6{width:60%}.skel.w4{width:40%}.skel.w8{width:80%}
.skwrap{background:var(--paper);padding:2px 0}
.loading .hero{opacity:.6}
.updating{display:inline-block;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.band .updating{color:var(--band-2)}
.err{display:flex;gap:10px;align-items:flex-start;background:var(--over-soft);border-top:2px solid var(--over);padding:12px;font-size:14px}
.err svg{color:var(--over)}

.proto{position:fixed;top:8px;right:8px;z-index:20;display:flex;gap:2px;background:var(--paper);border:1px dashed var(--ink-3);padding:2px;font-size:11px}
.proto button{padding:4px 7px;color:var(--ink-2)}
.proto button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- add ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:10;background:var(--ground);display:flex;flex-direction:column}
.sheet{flex:1;display:flex;flex-direction:column;padding:47px 16px 34px;min-height:0;position:relative}
.sheet-title{font-weight:600;font-size:16px;padding:10px 0 10px;border-bottom:2px solid var(--rule-strong)}
.entry{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--rule);background:var(--paper)}
.entry .sep{display:none}
.entry button{padding:8px 10px 9px;text-align:left;font-size:14.5px;min-height:52px;border-right:1px solid var(--rule);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry button::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:1px}
.entry button:last-of-type{border-right:0}
.entry button.todo{color:var(--ink-3)}
.entry button.cur{box-shadow:inset 0 -3px 0 var(--ink);font-weight:600}
.steps{display:none}
.amount-read{font-stretch:var(--cond);font-weight:600;font-size:88px;line-height:1;text-align:right;margin:auto 0 0;padding:20px 4px 4px;font-variant-numeric:tabular-nums lining-nums}
.amount-read .cur{font-size:28px;font-weight:500;color:var(--ink-3);margin-left:6px}
.amount-read.empty{color:var(--ink-3)}
.amount-read .caret{display:inline-block;width:3px;height:.72em;background:var(--ink);vertical-align:-.02em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.off{display:flex;gap:0;flex-wrap:wrap;margin:12px 0;border:1.5px solid var(--rule-strong)}
.off button{flex:1;font-size:13px;padding:8px 6px;min-height:40px;display:inline-flex;gap:5px;align-items:center;justify-content:center;color:var(--ink-2);background:var(--paper)}
.off button + button{border-left:1.5px solid var(--rule-strong)}
.off button[aria-pressed="true"]{background:var(--shared);color:#1D1600;font-weight:600}
.off button.inc[aria-pressed="true"]{background:var(--in);color:#fff}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.keypad button{height:58px;background:var(--paper);font-size:26px;font-stretch:var(--cond);font-weight:500}
.keypad button:active{background:var(--ground)}
.next{margin-top:10px;width:100%;height:56px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.next[disabled]{opacity:.3;cursor:not-allowed}
.cats{display:flex;flex-direction:column;overflow:auto;margin-top:4px}
.cats h3{font-size:13px;font-weight:600;margin:14px 0 0;padding-bottom:6px;border-bottom:2px solid var(--rule-strong)}
.cat{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;border-bottom:1px solid var(--rule);background:var(--paper);text-align:left;font-size:16px}
.cat small{color:var(--ink-3);font-size:13.5px}
.namefield label{display:block;font-size:13px;font-weight:600;margin:18px 0 6px}
.namefield input{width:100%;height:54px;border:0;border-bottom:2px solid var(--ink);background:var(--paper);padding:0 12px;font-size:18px;outline:none}
.sugg{display:flex;gap:0;flex-wrap:wrap;margin-top:12px;align-items:stretch}
.sugg span{font-size:13px;color:var(--ink-3);width:100%;margin-bottom:6px}
.sugg button{padding:9px 14px;background:var(--paper);font-size:15px;min-height:44px;border:1px solid var(--rule);margin:0 -1px -1px 0}
.more{background:var(--paper);padding:10px 12px;margin:0 0 12px;display:grid;gap:10px;border-top:2px solid var(--rule-strong)}
.more .r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.more .seg button{padding:6px 9px;font-size:13px;min-height:34px}
.more input{flex:1;height:38px;border:0;border-bottom:1.5px solid var(--ink-3);background:none;min-width:0;outline:none}
.saved{margin:auto 0;text-align:left;padding:0 4px}
.saved .tick{width:56px;height:56px;background:var(--band);color:#fff;display:grid;place-items:center;margin:0 0 18px}
.saved .tick svg{width:30px;height:30px;stroke-width:2.4}
.saved p{font-stretch:var(--cond);font-weight:600;font-size:44px;line-height:1;margin:0 0 8px}
.saved small{color:var(--ink-3);font-size:15px}
.closex{position:absolute;right:8px;top:51px;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2)}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .wrap{padding:0 40px 60px;max-width:1280px;margin:0 auto}
  .tabbar{display:none}
  .band{margin:0 -40px;padding:20px 40px 22px}
  .desk-nav{display:flex;align-items:center;gap:2px;margin:-4px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--band-cell)}
  .desk-nav .brand{font-weight:700;font-size:16px;margin-right:22px}
  .desk-nav .nav{padding:8px 12px;font-size:14.5px;color:var(--band-2);min-height:40px}

<body>
<div id="root"></div>
<script src="../../data/cashflow-fake.js"></script>
<script>
(function(){
const D = window.CASHFLOW_DATA;
const SCREENS = ['home','add','transactions','budget','analytics'];
const params = new URLSearchParams(location.search);
const P = window.PROTO || {};
const S = {
  screen: SCREENS.includes(P.screen) ? P.screen : (SCREENS.includes(params.get('screen')) ? params.get('screen') : 'home'),
  theme: (P.theme || params.get('theme')) === 'dark' ? 'dark' : 'light',
  base: 'home', back: null, view: 'content', cat: 'eating_out',
  filter: 'all', q: '', open: null, newId: null, focus: null,
  tx: D.transactions.slice(),
  add: null
};
if (S.screen !== 'add') S.base = S.screen;

/* ---------- money and dates: integer øre, Intl at the edge ---------- */
const nf = o => new Intl.NumberFormat(D.locale, Object.assign({style:'currency', currency:D.currency}, o));
const F2 = nf({}), F0 = nf({maximumFractionDigits:0, minimumFractionDigits:0}), FS = nf({signDisplay:'exceptZero'}), F0S = nf({maximumFractionDigits:0, minimumFractionDigits:0, signDisplay:'exceptZero'});
const MINUS = '−';
const m = (minor, o={}) => (o.whole ? (o.sign ? F0S : F0) : o.sign ? FS : F2).format(minor/100).replace('-', MINUS);
function heroMoney(minor){
  return F2.formatToParts(minor/100).map(p => {
    if (p.type === 'decimal' || p.type === 'fraction') return `<span class="frac">${p.value}</span>`;
    if (p.type === 'currency') return `<span class="cur">${p.value}</span>`;
    if (p.type === 'literal') return '';
    if (p.type === 'minusSign') return MINUS;
    return p.value;
  }).join('').replace('</span><span class="frac">','');
}
const pct = (a,b) => Math.round(a*100/b);
const dt = s => { const [y,mo,d] = s.split('-').map(Number); return new Date(y, mo-1, d); };
const dayIdx = (s, start) => Math.round((dt(s) - dt(start)) / 864e5);
const DF = (o) => new Intl.DateTimeFormat(D.locale, o);
function dayLabel(s){
  const diff = dayIdx(D.today, s);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  const parts = DF({weekday:'short', day:'numeric', month:'short'}).formatToParts(dt(s));
  return parts.filter(p => p.type !== 'literal').map(p => p.value).join(' ');
}
const cycleRange = DF({day:'numeric', month:'short'}).format(dt(D.cycle.start)) + ' \u2013 ' + DF({day:'numeric', month:'short'}).format(new Date(dt(D.cycle.next_payday) - 864e5));
const CAT = Object.fromEntries(D.categories.map(c => [c.id, c]));
const EXP = D.categories.filter(c => c.kind === 'expense');

/* ---------- everything computed from transactions ---------- */
function calc(tx){
  const spent = {}, spentShared = {}, lastSpent = {};
  EXP.forEach(c => { spent[c.id] = 0; spentShared[c.id] = 0; lastSpent[c.id] = 0; });
  let myTop = 0, annaTop = 0, income = 0, moved = 0, savings = 0;
  const cum = new Array(D.cycle.days_total).fill(0);
  for (const t of tx){
    if (t.kind === 'expense'){ spent[t.category] += t.amount_minor; if (t.shared) spentShared[t.category] += t.amount_minor; cum[dayIdx(t.date, D.cycle.start)] += t.amount_minor; }
    else if (t.kind === 'topup'){ if (t.paid_by === 'me') myTop += t.amount_minor; else annaTop += t.amount_minor; }
    else if (t.kind === 'income') income += t.amount_minor;
    else if (t.kind === 'transfer') savings += t.amount_minor;
  }
  const lastCum = new Array(D.cycle.days_total).fill(0);
  for (const t of D.last_cycle_transactions){
    if (t.kind !== 'expense') continue;
    lastSpent[t.category] += t.amount_minor;
    lastCum[dayIdx(t.date, D.last_cycle.start)] += t.amount_minor;
  }
  for (let i=1;i<cum.length;i++){ cum[i] += cum[i-1]; lastCum[i] += lastCum[i-1]; }
  const budget = EXP.reduce((a,c) => a + c.budget_minor, 0);
  const total = Object.values(spent).reduce((a,b) => a+b, 0);
  const shared = Object.values(spentShared).reduce((a,b) => a+b, 0);
  const lastTotal = Object.values(lastSpent).reduce((a,b) => a+b, 0);
  const allTop = myTop + annaTop;
  const todayIdx = dayIdx(D.today, D.cycle.start);
  const left = budget - total;
  return {
    spent, spentShared, lastSpent, budget, total, shared, personal: total - shared, lastTotal,
    left, perDay: Math.floor(left / D.cycle.days_left), income, savings,
    myTop, annaTop, allTop,
    myShare: allTop ? Math.round(shared * myTop / allTop) : 0,
    myPct: allTop ? pct(myTop, allTop) : 0,
    sharedLeft: allTop - shared,
    cum, lastCum, todayIdx,
    overs: EXP.filter(c => spent[c.id] > c.budget_minor).map(c => ({c, over: spent[c.id] - c.budget_minor})).sort((a,b) => b.over - a.over)
  };
}
function catCum(tx, id, start, len){
  const a = new Array(len).fill(0);
  tx.forEach(t => { if (t.kind === 'expense' && t.category === id){ const i = dayIdx(t.date, start); if (i>=0 && i<len) a[i] += t.amount_minor; }});
  for (let i=1;i<len;i++) a[i] += a[i-1];
  return a;
}


/* ---------- icons: one family, 1.75 stroke, square ends, drawn on a 24 grid ---------- */
const I = {
  cycle:'<rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M8 14h3v3H8z" fill="currentColor"/>',
  ledger:'<path d="M4 6h16M4 12h16M4 18h16"/><path d="M15 3v18"/>',
  budgets:'<path d="M4 6h10M4 12h16M4 18h7"/><path d="M14 4v4M20 10v4M11 16v4"/>',
  compare:'<path d="M5 20V9M10 20V4M15 20v-8M20 20v-5"/>',
  plus:'<path d="M12 4v16M4 12h16"/>',
  back:'<path d="M15 4l-8 8 8 8"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  search:'<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>',
  close:'<path d="M5 5l14 14M19 5L5 19"/>',
  shared:'<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',
  moved:'<path d="M3 12h15M13 6l6 6-6 6"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  del:'<path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 17.5v1"/>',
  cal:'<rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  noteI:'<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h4"/>',
  inI:'<path d="M12 20V5M6 11l6-6 6 6"/>'
};
const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const isDesk = () => window.innerWidth >= 900;

/* ---------- shared pieces ---------- */
const TABS = [['home','Cycle','cycle'],['transactions','Transactions','ledger'],['budget','Budgets','budgets'],['analytics','Compare','compare']];
function tabbar(){
  return `<nav class="tabbar" aria-label="Main">${TABS.map(([id,l,i]) => `<button class="tab" data-go="${id}" ${S.base===id?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('')}<button class="tab-add" data-go="add" aria-label="Add a transaction">${ic('plus')}</button></nav>`;
}
function deskNav(){
  return `<nav class="desk-nav" aria-label="Main"><span class="brand">Cashflow</span>${TABS.map(([id,l]) => `<button class="nav" data-go="${id}" ${S.base===id?'aria-current="page"':''}>${l}</button>`).join('')}<button class="add" data-go="add">${ic('plus','s')}Add</button></nav>`;
}
function protoSwitch(){
  if (S.screen === 'add') return '';
  const b = v => `<button data-view="${v}" aria-pressed="${S.view===v}">${v[0].toUpperCase()+v.slice(1)}</button>`;
  return `<div class="proto" role="group" aria-label="Prototype state">${b('content')}${b('empty')}${b('loading')}${b('error')}<button data-theme-toggle aria-label="Switch theme">${S.theme==='dark'?'Light':'Dark'}</button></div>`;
}
const skel = (n=4) => `<div class="skwrap">${Array.from({length:n}, (_,i) => `<div class="skel ${['w8','w6','w4','w6'][i%4]}"></div>`).join('')}</div>`;
const errBox = what => `<div class="err" role="alert">${ic('alert')}<div>${what} could not load. Check your connection and try again.<div style="margin-top:10px"><button class="btn ghost" data-view="content">Retry</button></div></div></div>`;
const emptyBox = text => `<div class="state-msg"><p>${text}</p><button class="btn" data-go="add">${ic('plus','s')}Add a transaction</button></div>`;
const listState = (what, empty, body) => S.view === 'loading' ? skel() : S.view === 'error' ? errBox(what) : S.view === 'empty' ? emptyBox(empty) : body;
const updating = () => S.view === 'loading' ? `<span class="updating">Updating…</span>` : '';

/* ---------- the band: the cycle's state, on every desktop screen and on Home ---------- */
function band(C, slim){
  const strip = Array.from({length:D.cycle.days_total}, (_,i) => `<i class="${i<C.todayIdx?'past':i===C.todayIdx?'today':''}"></i>`).join('');
  const short = DF({day:'numeric', month:'short'});
  const status = C.left < 0 ? 'over' : '';
  const heroBlock = `<div><div class="r"><h1>${D.cycle.label} cycle</h1><span class="muted">${cycleRange}</span></div>
      <div class="hero" aria-label="${m(Math.abs(C.left))} ${C.left<0?'over budget':'left to spend'}">${heroMoney(Math.abs(C.left))}</div>
      <div style="font-size:15px">${C.left<0?'over budget':'left to spend'} of ${m(C.budget,{whole:1})} ${updating()}</div></div>`;
  const timeBlock = `<div><div class="meta"><div><b>${D.cycle.days_left}</b>days to payday</div><div class="rt"><b class="num">${m(Math.max(C.perDay,0),{whole:1})}</b>a day until then</div></div>
      <div class="strip" aria-hidden="true">${strip}</div>
      <div class="strip-l"><span>${short.format(dt(D.cycle.start))}</span><span>Today, day ${C.todayIdx+1} of ${D.cycle.days_total}</span><span>Payday ${short.format(dt(D.cycle.next_payday))}</span></div></div>`;
  if (slim) return `<header class="band slim ${status}">${deskNav()}<div class="bandgrid"><div><div class="hero">${heroMoney(Math.abs(C.left))}</div><div style="font-size:14px">${C.left<0?'over budget':'left to spend'}, ${D.cycle.label} cycle</div></div>${timeBlock}</div></header>`;
  return `<header class="band ${status}">${isDesk()?deskNav():''}<div class="${isDesk()?'bandgrid':''}">${heroBlock}${timeBlock}</div></header>`;
}
function pageHead(title, sub){
  const back = S.back ? `<button class="iconbtn" data-go="${S.back}" aria-label="Back" style="width:44px;height:44px;display:grid;place-items:center;margin-left:-12px">${ic('back')}</button>` : '';
  if (isDesk()) return `${band(calc(S.tx), true)}<div style="display:flex;align-items:center;gap:6px;margin:26px 0 0">${back}<div><h1 style="margin:0;font-size:28px;font-weight:600;font-stretch:85%">${title}</h1>${sub?`<div style="font-size:14px;color:var(--ink-3)">${sub}</div>`:''}</div></div>`;
  return `<header style="padding-top:47px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:${47+50}px;border-bottom:2px solid var(--rule-strong);margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--paper)">
    <span>${back}</span><div style="text-align:center"><h1 style="margin:0;font-size:17px;font-weight:600">${title}</h1>${sub?`<div style="font-size:12.5px;color:var(--ink-3)">${sub}</div>`:''}</div><span></span></header>`;
}

/* ---------- Home ---------- */
function splitTable(C){
  return `<section class="sec"><h2>Spent this cycle <small class="num">${m(C.total)}</small></h2><div class="tt">
    <div class="trow"><i class="mk"></i><div class="t">Personal</div><div class="fig">${m(C.personal)}</div></div>
    <div class="trow"><i class="mk s"></i><div class="t">Shared with ${D.partner}</div><div class="fig">${m(C.shared)}</div></div>
    <div class="trow"><i class="mk m"></i><div class="t">Moved to the shared account<small>Not spending, it pays for shared costs</small></div><div class="fig muted">${m(C.myTop)}</div></div>
  </div></section>`;
}
function sharedBox(C){
  const annaShare = C.shared - C.myShare;
  return `<section class="sec"><h2 class="amber">Shared account with ${D.partner} <small><button data-go="transactions" data-filter="shared" style="color:var(--ink);text-decoration:underline;text-underline-offset:3px">Shared transactions</button></small></h2>
    <div class="shared-box"><div class="top"><span class="lbl">Left in the account</span><span class="pair" aria-hidden="true"><span>${D.partner[0]}</span><span>You</span></span></div>
    <div class="big num">${m(C.sharedLeft)}</div><div class="lbl">${m(C.allTop,{whole:1})} put in, ${m(C.shared,{whole:1})} spent together</div>
    <div class="splitbar" aria-hidden="true"><i style="flex:${C.myTop}"></i><i style="flex:${C.annaTop}"></i></div>
    <div class="duo"><div><h3>You, ${C.myPct}%</h3><div class="l">Put in<b>${m(C.myTop,{whole:1})}</b></div><div class="l">Your share<b>${m(C.myShare,{whole:1})}</b></div></div>
    <div><h3>${D.partner}, ${100-C.myPct}%</h3><div class="l">Put in<b>${m(C.annaTop,{whole:1})}</b></div><div class="l">Her share<b>${m(annaShare,{whole:1})}</b></div></div></div>
    </div></section>`;
}
function paceBars(C){
  const cyc = pct(C.todayIdx+1, D.cycle.days_total), used = pct(C.total, C.budget);
  const diff = C.cum[C.todayIdx] - C.lastCum[C.todayIdx];
  return `<section class="sec"><h2>Pace</h2><div class="pace">
    ${S.view==='loading'?skel(2):S.view==='error'?errBox('Pace'):`
    <div class="pbar"><span>Cycle gone</span><span class="tr"><i style="width:${cyc}%"></i></span><b>${cyc}%</b></div>
    <div class="pbar"><span>Budget used</span><span class="tr"><i style="width:${Math.min(used,100)}%;${used>100?'background:var(--over)':''}"></i></span><b>${used}%</b></div>
    <p class="num">${S.view==='empty' ? 'Nothing spent yet this cycle.' : `${m(Math.abs(diff),{whole:1})} ${diff>=0?'more':'less'} than ${D.last_cycle.label} by this day.`}</p>`}
  </div></section>`;
}
function overList(C){
  if (!C.overs.length) return `<section class="sec"><h2>Budgets</h2><div class="state-msg"><p>Every budget is holding.</p></div></section>`;
  return `<section class="sec"><h2 class="red">Over budget <small>${C.overs.length} of ${EXP.length}</small></h2>${C.overs.map(o =>
    `<button class="overrow" data-go="budget" data-cat="${o.c.id}" data-back="home"><i class="mk o"></i><span class="t">${o.c.name}<small class="num">${m(C.spent[o.c.id],{whole:1})} of ${m(o.c.budget_minor,{whole:1})}</small></span><span class="fig over">${m(o.over)}<small>over</small></span>${ic('chev','s')}</button>`).join('')}</section>`;
}
function home(){
  const C = calc(S.view === 'empty' ? [] : S.tx);
  S._c = C;
  const latest = `<section class="sec"><h2>Latest <small><button data-go="transactions" style="color:var(--ink);text-decoration:underline;text-underline-offset:3px">All transactions</button></small></h2>${listState('Transactions','No transactions yet this cycle.', groupDays(S.tx.slice(0,7), true))}</section>`;
  const overs = S.view === 'content' || S.view === 'loading' ? overList(C) : '';
  if (isDesk()) return `<div class="${S.view==='loading'?'loading':''}">${band(C)}<div class="cols3"><div>${splitTable(C)}${paceBars(C)}</div><div>${overs}${sharedBox(C)}</div><div>${latest}</div></div></div>`;
  return `<div class="${S.view==='loading'?'loading':''}">${band(C)}${overs}${splitTable(C)}${paceBars(C)}${sharedBox(C)}</div>`;
}

/* ---------- Transactions ---------- */
function marker(t){
  if (t.kind === 'income') return `<i class="mk" style="color:var(--in)">${ic('plus','s')}</i>`;
  if (t.kind === 'topup' || t.kind === 'transfer') return `<i class="mk m"></i>`;
  return t.shared ? `<i class="mk s"></i>` : `<i class="mk"></i>`;
}
function rowParts(t){
  const c = t.category ? CAT[t.category] : null;
  if (t.kind === 'expense') return {meta: t.shared ? `${c.name}, <b>shared with ${D.partner}</b>` : c.name, acct: t.shared ? `<span class="acct s">${ic('shared','s')}Shared</span>` : `<span class="acct">Personal</span>`, amt: m(t.amount_minor), cls:''};
  if (t.kind === 'income') return {meta: c.name, acct:`<span class="acct">Personal</span>`, amt: m(t.amount_minor,{sign:1}), cls:'in'};
  if (t.kind === 'topup' && t.paid_by === 'me') return {meta:'Moved to the shared account, not spending', acct:`<span class="acct m">${ic('moved','s')}To shared</span>`, amt: m(t.amount_minor), cls:'muted'};
  if (t.kind === 'topup') return {meta:`${D.partner} put money into the shared account`, acct:`<span class="acct m">${ic('moved','s')}${D.partner} to shared</span>`, amt: m(t.amount_minor), cls:'muted'};
  return {meta:'Moved to savings, not spending', acct:`<span class="acct m">${ic('moved','s')}To savings</span>`, amt: m(t.amount_minor), cls:'muted'};
}
function detail(t){
  if (S.open !== t.id) return '';
  const C = S._c || calc(S.tx);
  return `<dl class="detail"><dt>Date</dt><dd>${DF({weekday:'long',day:'numeric',month:'long'}).format(dt(t.date))}</dd>
    ${t.kind==='expense'?`<dt>Account</dt><dd>${t.shared?`Shared with ${D.partner}`:'Personal'}</dd>`:''}
    ${t.shared && t.kind==='expense' && C.allTop ? `<dt>Your share, ${C.myPct}%</dt><dd>${m(Math.round(t.amount_minor*C.myTop/C.allTop))}</dd>` : ''}
    ${t.note?`<dt>Note</dt><dd>${t.note}</dd>`:''}</dl>`;
}
function txRow(t){
  const r = rowParts(t);
  return `<button class="tx ${S.newId===t.id?'new':''}" data-open="${t.id}" aria-expanded="${S.open===t.id}">${marker(t)}<span><span class="nm">${t.name}</span><span class="meta">${r.meta}</span></span><span class="fig ${r.cls}">${r.amt}</span></button>${detail(t)}`;
}
function byDay(list){
  const days = {};
  list.forEach(t => (days[t.date] = days[t.date] || []).push(t));
  return Object.keys(days).sort().reverse().map(d => [d, days[d], days[d].filter(t => t.kind === 'expense').reduce((a,t) => a + t.amount_minor, 0)]);
}
function groupDays(list){
  return byDay(list).map(([d, items, out]) => `<section class="day"><h3><span>${dayLabel(d)}</span><span class="fig">${out?m(out):''}</span></h3>${items.map(txRow).join('')}</section>`).join('');
}
function txTable(list){
  return `<table class="ttable"><thead><tr><th style="width:34px"><span class="sr">Kind</span></th><th>Name</th><th>Category</th><th>Account</th><th class="r">Amount</th></tr></thead><tbody>${
    byDay(list).map(([d, items, out]) => `<tr class="dayhead"><td colspan="4">${dayLabel(d)}</td><td class="r"><span class="fig" style="font-size:16px">${out?m(out):''}</span></td></tr>` + items.map(t => {
      const r = rowParts(t);
      return `<tr><td>${marker(t)}</td><td>${t.name}${t.note?`<div style="font-size:12.5px;color:var(--ink-3)">${t.note}</div>`:''}</td><td class="d">${t.category?CAT[t.category].name:''}</td><td>${r.acct}</td><td class="r"><span class="fig ${r.cls}">${r.amt}</span></td></tr>`;
    }).join('')).join('')}</tbody></table>`;
}
function transactions(){
  const C = S._c = calc(S.tx);
  const q = S.q.trim().toLowerCase();
  let list = S.tx.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  if (S.filter === 'personal') list = list.filter(t => !t.shared);
  if (S.filter === 'shared') list = list.filter(t => t.shared);
  if (q) list = list.filter(t => (t.name + ' ' + (t.category ? CAT[t.category].name : '')).toLowerCase().includes(q));
  const f = (v,l) => `<button data-filter="${v}" aria-pressed="${S.filter===v}">${l}</button>`;
  const sum = S.filter === 'shared' ? `Shared spending ${m(C.shared)}` : S.filter === 'personal' ? `Personal spending ${m(C.personal)}` : `Spent ${m(C.total)}`;
  const filters = `<div class="filters"><div class="seg" role="group" aria-label="Show">${f('all','All')}${f('personal','Personal')}${f('shared','Shared')}</div>
    <label class="search">${ic('search','s')}<span class="sr">Search</span><input id="q" type="search" placeholder="Search" value="${S.q.replace(/"/g,'&quot;')}"></label></div>
    <div class="legend" style="margin:8px 0 0"><span><i class="mk s"></i>Shared with ${D.partner}</span><span><i class="mk m"></i>Moved, not spending</span></div>`;
  const empty = `<div class="state-msg"><p>Nothing matches ${S.q ? 'this search' : 'this filter'}.</p><button class="btn ghost" data-clear>Show all</button></div>`;
  if (isDesk()) return `${pageHead('Transactions', `${D.cycle.label} cycle, ${sum}`)}<div class="cols-t"><div>${filters}<div style="margin-top:14px">${updating()}${listState('Transactions','No transactions yet this cycle.', list.length ? txTable(list) : empty)}</div></div><div>${splitTable(C)}${sharedBox(C)}</div></div>`;
  return `${pageHead('Transactions', `${D.cycle.label} cycle, ${sum}`)}${filters}${updating()}${listState('Transactions','No transactions yet this cycle.', list.length ? groupDays(list) : empty)}`;
}

/* ---------- Budget ---------- */
function catChart(cur, last, budget, todayIdx, label){
  const n = cur.length, w = isDesk() ? 700 : 360, h = isDesk() ? 220 : 150, padT = 16, padB = 22;
  const max = Math.max(budget, cur[todayIdx], last[n-1]) * 1.1;
  const y = v => padT + (h-padT-padB) * (1 - v/max);
  const cw = w / n;
  let cols = '';
  for (let i=0;i<n;i++){
    const x = i*cw + 1, bw = cw - 2;
    if (i > todayIdx){ continue; }
    const v = cur[i];
    if (v <= budget) cols += `<rect class="col" x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}"/>`;
    else cols += `<rect class="col" x="${x}" y="${y(budget)}" width="${bw}" height="${y(0)-y(budget)}"/><rect class="col o" x="${x}" y="${y(v)}" width="${bw}" height="${y(budget)-y(v)}"/>`;
  }
  const lp = last.map((v,i) => `${i?'L':'M'}${(i*cw+cw/2).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">
    ${cols}
    <path class="ll" d="${lp}"/>
    <line class="bl" x1="0" x2="${w}" y1="${y(budget)}" y2="${y(budget)}"/>
    <text x="0" y="${y(budget)-6}" class="lab">Budget ${m(budget,{whole:1})}</text>
    <line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule-strong)"/>
    <text x="0" y="${h-5}">${DF({day:'numeric',month:'short'}).format(dt(D.cycle.start))}</text>
    <text x="${todayIdx*cw+cw/2}" y="${h-5}" text-anchor="middle" class="lab">Today</text>
  </svg>
  <div class="legend"><span><i class="mk p"></i>${D.cycle.label}, day by day</span><span><i class="mk o"></i>Over budget</span><span><i style="display:inline-block;width:16px;border-top:1.5px solid var(--ink-3)"></i>${D.last_cycle.label}</span></div>`;
}
function budgetTable(C){
  return `<div class="bh"><span>Category</span><span>Spent</span><span>Left</span></div>` + EXP.map(c => {
    const s = C.spent[c.id], b = c.budget_minor, d = b - s;
    const w = Math.min(100, s*100/b);
    const left = d < 0 ? `<span class="fig over">${m(-d,{whole:1})}<small>over</small></span>` : d === 0 ? `<span class="fig muted" style="font-size:15px">Used up</span>` : `<span class="fig">${m(d,{whole:1})}</span>`;
    return `<button class="brow" data-cat="${c.id}" ${S.cat===c.id?'aria-current="true"':''}><span class="c">${c.name}<small>${m(s,{whole:1})} of ${m(b,{whole:1})}</small></span><span class="m"><i class="${d<0?'o':''}" style="width:${w}%"></i></span>${left}</button>`;
  }).join('');
}
function budget(){
  const tx = S.view === 'empty' ? [] : S.tx;
  const C = S._c = calc(tx);
  const c = CAT[S.cat], s = C.spent[c.id], b = c.budget_minor, over = s - b;
  const cur = catCum(tx, c.id, D.cycle.start, D.cycle.days_total);
  const last = catCum(D.last_cycle_transactions, c.id, D.last_cycle.start, D.cycle.days_total);
  const lastTotal = C.lastSpent[c.id], diff = s - lastTotal;
  const list = tx.filter(t => t.category === c.id).sort((a,b) => a.date < b.date ? 1 : -1);
  const statusBand = over > 0 ? `<div class="overband"><span>Over budget</span><b class="num">${m(over)}</b></div>` : `<div class="leftband"><span>Left</span><b class="num">${m(-over)}</b></div>`;
  const detailCol = `<div class="bhead"><div class="hero num">${heroMoney(s)}</div><div class="of">spent of ${m(b,{whole:1})}, ${D.cycle.days_left} days to payday ${updating()}</div>${statusBand}</div>
    <section class="sec"><h2>Through the cycle</h2><div class="tt" style="padding:14px 12px 12px">${S.view==='loading'?skel(3):S.view==='error'?errBox('The chart'):S.view==='empty'?'<p style="margin:4px 0;color:var(--ink-2)">Nothing spent here yet this cycle.</p>':catChart(cur, last, b, C.todayIdx, `${c.name} day by day against the budget`)}</div></section>
    <section class="sec"><h2>Against ${D.last_cycle.label}</h2><div class="vs"><div><span>${D.cycle.label}, so far</span><b class="num">${m(s,{whole:1})}</b></div><div><span>${D.last_cycle.label}, whole cycle</span><b class="num muted">${m(lastTotal,{whole:1})}</b></div>
      <p class="num">${diff === 0 ? 'The same as ' + D.last_cycle.label + '.' : `${m(Math.abs(diff),{whole:1})} ${diff>0?'more':'less'} than ${D.last_cycle.label}, with ${D.cycle.days_left} days to go.`}</p></div></section>
    <section class="sec"><h2>${c.name} this cycle <small>${list.length}</small></h2>${listState(c.name, `No ${c.name.toLowerCase()} yet this cycle.`, list.map(txRow).join(''))}</section>`;
  const all = `<section class="sec" id="allb"><h2>All budgets <small class="num">${m(C.total,{whole:1})} of ${m(C.budget,{whole:1})}</small></h2>${S.view==='loading'?skel(6):S.view==='error'?errBox('Budgets'):budgetTable(C)}</section>`;
  if (isDesk()) return `${pageHead('Budgets', `${D.cycle.label} cycle`)}<div class="cols-b"><div>${all}</div><div><section class="sec"><h2 style="font-size:22px;font-stretch:85%">${c.name}</h2></section>${detailCol}</div></div>`;
  return `${pageHead(c.name, 'Budget')}<div style="display:flex;justify-content:flex-end;margin:6px 0 -6px"><button data-jump="allb" style="font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:40px">All budgets</button></div>${detailCol}${all}`;
}

/* ---------- Compare: where it went, personal and shared, against last cycle ---------- */
function sankey(C, W){
  const rows = EXP.map(c => ({c, s:C.spent[c.id], sh:C.spentShared[c.id], l:C.lastSpent[c.id]})).filter(r => r.s).sort((a,b) => b.s - a.s);
  const H = W > 600 ? 380 : 300, k = H / C.total;
  const nodeW = 10, gapL = 22, xr = Math.round(W * (W > 600 ? 0.5 : 0.4)), lx = xr + nodeW + 10;
  const pH = C.personal * k, sY = pH + gapL;
  let py = 0, sy = sY, cursor = 0, links = '', nodes = '', labels = '';
  const band = (x1, a1, b1, x2, a2, b2, cls) => { const xm = (x1+x2)/2; return `<path class="${cls}" d="M${x1} ${a1}C${xm} ${a1} ${xm} ${a2} ${x2} ${a2}L${x2} ${b2}C${xm} ${b2} ${xm} ${b1} ${x1} ${b1}Z"/>`; };
  rows.forEach(r => {
    const h = r.s * k, slot = Math.max(h, 40), p = (r.s - r.sh) * k, sh = r.sh * k;
    if (p > 0){ links += band(nodeW, py, py+p, xr, cursor, cursor+p, 'pb'); py += p; }
    if (sh > 0){ links += band(nodeW, sy, sy+sh, xr, cursor+p, cursor+p+sh, 'sb'); sy += sh; }
    nodes += `<rect class="cn" x="${xr}" y="${cursor}" width="${nodeW}" height="${Math.max(h,2)}"/>`;
    const d = r.s - r.l;
    const ch = d === 0 ? ['eq', 'same as ' + D.last_cycle.label.slice(0,3)] : [d > 0 ? 'up' : 'dn', m(d,{whole:1,sign:1}) + ' vs ' + D.last_cycle.label.slice(0,3)];
    labels += `<text class="nm" x="${lx}" y="${cursor+14}">${r.c.name}</text><text x="${lx}" y="${cursor+31}"><tspan class="am">${m(r.s,{whole:1})}</tspan><tspan class="${ch[0]}" dx="8" font-size="12.5">${ch[1]}</tspan></text>`;
    cursor += slot + 6;
  });
  nodes += `<rect class="pn" x="0" y="0" width="${nodeW}" height="${pH}"/><rect class="sn" x="0" y="${sY}" width="${nodeW}" height="${C.shared*k}"/>`;
  const total = Math.max(cursor, sY + C.shared*k + 30);
  return `<svg class="chart sankey-svg" viewBox="0 0 ${W} ${total}" style="width:${W}px;max-width:100%" role="img" aria-label="Spending this cycle from your personal money and the shared account, by category">${links}${nodes}${labels}</svg>`;
}
function analytics(){
  const tx = S.view === 'empty' ? [] : S.tx;
  const C = calc(tx);
  const diff = C.total - C.lastTotal;
  const rows = EXP.map(c => ({c, d:C.spent[c.id]-C.lastSpent[c.id]})).sort((a,b) => b.d - a.d);
  const answer = S.view === 'empty' ? `<p class="answer">${m(0,{whole:1})} spent so far. ${D.last_cycle.label} came to ${m(C.lastTotal,{whole:1})} in all.</p>` :
    `<p class="answer num">${m(C.total,{whole:1})} spent, <span class="${diff>=0?'up':'down'}">${m(Math.abs(diff),{whole:1})} ${diff>=0?'more':'less'}</span> than all of ${D.last_cycle.label}.</p>
     <p class="lead">Most of the rise is ${rows[0].c.name}, ${rows[1].c.name} and ${rows[2].c.name}. ${m(C.shared,{whole:1})} of it came from the shared account.</p>`;
  const W = isDesk() ? Math.min(window.innerWidth, 1280) - 80 - 388 - 24 : Math.min(window.innerWidth, 600) - 56;
  const changes = `<section class="sec" style="margin-top:0"><h2>Against ${D.last_cycle.label}</h2><div class="bh" style="grid-template-columns:1fr 80px 80px"><span>Category</span><span style="text-align:right">${D.cycle.label.slice(0,3)}</span><span>Change</span></div>${
    EXP.map(c => ({c, s:C.spent[c.id], d:C.spent[c.id]-C.lastSpent[c.id]})).sort((a,b) => b.d - a.d).map(r => `<div class="brow" style="grid-template-columns:1fr 80px 80px"><span class="c">${r.c.name}</span><span class="fig" style="font-size:16px">${m(r.s,{whole:1})}</span><span class="fig ${r.d>0?'over':r.d<0?'in':'muted'}" style="font-size:16px">${r.d?m(r.d,{whole:1,sign:1}):'Same'}</span></div>`).join('')}</section>`;
  const chart = `<div class="sankey"><div class="legend" style="margin:0 0 12px"><span><i class="mk p"></i>Personal ${m(C.personal,{whole:1})}</span><span><i class="mk s"></i>Shared ${m(C.shared,{whole:1})}</span></div>${sankey(C, W)}</div>`;
  const body = listState('Spending', 'Each category shows here after your first transaction.', chart);
  if (isDesk()) return `${pageHead('Where it went', `${D.cycle.label} cycle against ${D.last_cycle.label}`)}${answer}${updating()}<div class="cols-t" style="grid-template-columns:minmax(0,1fr) 360px;margin-top:14px"><div>${body}</div><div>${S.view==='content'?changes:''}</div></div>`;
  return `${pageHead('Where it went', `${D.cycle.label} cycle against ${D.last_cycle.label}`)}${answer}${updating()}<section class="sec" style="margin-top:14px">${body}</section>`;
}

/* ---------- navigation ---------- */
function post(){ try { parent.postMessage({type:'at', screen:S.screen}, '*'); } catch(e){} }
function go(screen, opts={}){
  if (!SCREENS.includes(screen)) return;
  if (screen === 'add'){ S.add = newAdd(); }
  else { S.back = opts.back || null; S.base = screen; S.open = null; }
  if (opts.cat) S.cat = opts.cat;
  S.screen = screen;
  render(); post();
  if (screen !== 'add') window.scrollTo(0,0);
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'go') go(d.screen);
  if (d.type === 'theme'){ S.theme = d.theme === 'dark' ? 'dark' : 'light'; applyTheme(); }
});
function applyTheme(){ document.documentElement.setAttribute('data-theme', S.theme); }

/* ---------- add: amount, category, name, saved ---------- */
function newAdd(){ return {step:'amount', digits:'', cat:null, name:'', kind:'expense', shared:false, date:D.today, note:'', more:false}; }
function addMinor(a){
  if (!a.digits) return 0;
  const [i, f=''] = a.digits.split('.');
  return parseInt(i || '0', 10) * 100 + parseInt((f + '00').slice(0,2), 10);
}
function typedAmount(a){
  const [i, f] = a.digits.split('.');
  const parts = F0.formatToParts(parseInt(i || '0', 10));
  let out = '', cur = '';
  parts.forEach(p => { if (p.type === 'currency') cur = p.value; else if (p.type !== 'literal') out += p.value; });
  const dec = F2.formatToParts(1.5).find(p => p.type === 'decimal').value;
  if (f !== undefined) out += dec + f;
  return {out, cur};
}
function add(){
  const a = S.add;
  const minor = addMinor(a);
  const catName = a.cat ? CAT[a.cat].name : 'Category';
  const step = (id, label, done) => `<button class="${a.step===id?'cur':done?'':'todo'}" data-step="${id}" data-label="${{amount:'Amount',category:'Category',name:'Name'}[id]}" ${!done && a.step!==id ? 'disabled' : ''}>${done ? label : '&nbsp;'}</button>`;
  const entry = `<div class="entry" aria-label="New entry">
    ${step('amount', minor ? m(minor) : 'Amount', !!minor)}<span class="sep">,</span>
    ${step('category', catName, !!a.cat)}<span class="sep">,</span>
    ${step('name', a.name || 'Name', !!a.name)}</div>`;
  const offRow = `<div class="off">
    <button data-more aria-expanded="${a.more}">${ic('cal','s')}${a.date===D.today?'Today':dayLabel(a.date)}</button>
    <button data-toggle="shared" aria-pressed="${a.shared}">${ic('shared','s')}${a.shared?'Shared':'Personal'}</button>
    <button class="inc" data-toggle="kind" aria-pressed="${a.kind==='income'}">${a.kind==='income'?'Income':'Expense'}</button>
    <button data-more aria-expanded="${a.more}">${ic('noteI','s')}${a.note?'Note added':'Note'}</button></div>`;
  const more = a.more ? `<div class="more">
    <div class="r"><span>Date</span><span class="seg">${[0,1,2].map(n => { const d = new Date(dt(D.today) - n*864e5); const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; return `<button data-date="${iso}" aria-pressed="${a.date===iso}">${dayLabel(iso)}</button>`; }).join('')}</span></div>
    <div class="r"><label for="note">Note</label><input id="note" value="${a.note.replace(/"/g,'&quot;')}" placeholder="Note"></div></div>` : '';
  let body = '';
  if (a.step === 'amount'){
    const t = typedAmount(a);
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'];
    const dec = F2.formatToParts(1.5).find(p => p.type === 'decimal').value;
    body = `<div class="amount-read ${a.digits?'':'empty'}" role="status" aria-live="polite" aria-label="Amount ${minor?m(minor):'empty'}">${t.out}<span class="caret"></span><span class="cur">${t.cur}</span></div>
      <div style="text-align:right;font-size:13.5px;color:var(--ink-3);padding-right:4px" class="num">${m(calc(S.tx).left)} left this cycle</div>
      ${offRow}${more}
      <div class="keypad" role="group" aria-label="Amount keypad">${keys.map(k => `<button data-key="${k}" aria-label="${k==='del'?'Delete':k==='.'?'Decimal':k}">${k==='del'?ic('del'):k==='.'?dec:k}</button>`).join('')}</div>
      <button class="next" data-step="category" ${minor?'':'disabled'}>Next</button>`;
  } else if (a.step === 'category'){
    const C = calc(S.tx);
    const recent = D.suggestions.last_used_categories;
    const list = a.kind === 'income' ? D.categories.filter(c => c.kind === 'income') : EXP;
    const row = c => `<button class="cat" data-pick="${c.id}"><span>${c.name}</span><small class="num">${!c.budget_minor ? '' : c.budget_minor === C.spent[c.id] ? 'Used up' : m(Math.abs(c.budget_minor - C.spent[c.id]),{whole:1}) + (c.budget_minor < C.spent[c.id] ? ' over' : ' left')}</small></button>`;
    body = a.kind === 'income' ? `<div class="cats">${list.map(row).join('')}</div>` :
      `<div class="cats"><h3>Recent</h3>${recent.map(id => row(CAT[id])).join('')}<h3>All</h3>${list.filter(c => !recent.includes(c.id)).map(row).join('')}</div>`;
    body = offRow + more + body;
  } else if (a.step === 'name'){
    const sug = (D.suggestions.name_suggestions[a.cat] || topNames(a.cat)).slice(0,4);
    body = `<div class="namefield"><label for="nm">Name</label><input id="nm" autocomplete="off" enterkeyhint="done" value="${a.name.replace(/"/g,'&quot;')}" placeholder="Shop or person"></div>
      ${sug.length ? `<div class="sugg"><span>Suggested</span>${sug.map(n => `<button data-name="${n}">${n}</button>`).join('')}</div>` : ''}
      <div style="flex:1"></div>${offRow}${more}
      <button class="next" data-save ${a.name.trim()?'':'disabled'}>Save</button>`;
  } else {
    body = `<div class="saved" role="status"><div class="tick">${ic('check')}</div><p class="num">Saved ${m(minor)}</p><small>${catName}, ${a.name}${a.shared?', shared with '+D.partner:''}</small></div>`;
  }
  return `<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="Add a transaction"><div class="sheet" tabindex="-1" style="outline:none">
    <button class="closex" data-close aria-label="Close">${ic('close')}</button>
    <div class="sheet-title">${a.kind==='income'?'New income':'New expense'}</div>
    ${a.step!=='saved'?entry:''}
    ${body}</div></div>`;
}
function topNames(cat){
  const n = {}; S.tx.forEach(t => { if (t.category === cat) n[t.name] = (n[t.name]||0) + 1; });
  return Object.keys(n).sort((a,b) => n[b]-n[a]);
}
function saveAdd(){
  const a = S.add;
  const t = {id:'n'+Date.now(), date:a.date, amount_minor:addMinor(a), kind:a.kind, category:a.cat, name:a.name.trim(), shared:a.shared, paid_by:'me', note:a.note||undefined};
  S.tx.unshift(t); S.newId = t.id; a.step = 'saved'; render();
  setTimeout(() => { if (S.screen === 'add'){ S.screen = S.base; S.add = null; render(); post(); } }, 1500);
}

/* ---------- render ---------- */
function render(){
  applyTheme();
  const view = {home, transactions, budget, analytics}[S.base] || home;
  document.getElementById('root').innerHTML = `<div class="app"><main class="wrap" id="main">${view()}</main>${tabbar()}</div>${S.screen==='add'?add():''}${protoSwitch()}`;
  if (S.focus){ const el = document.getElementById(S.focus); if (el){ el.focus(); const v = el.value; el.setSelectionRange && el.setSelectionRange(v.length, v.length); } S.focus = null; }
  else if (S.screen === 'add' && S.add.step === 'name'){ const el = document.getElementById('nm'); el && el.focus(); }
  else if (S.screen === 'add' && S.add.step === 'amount'){ const k = document.querySelector('.sheet'); k && k.focus({preventScroll:true}); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.themeToggle !== undefined){ S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); return; }
  if (d.view){ S.view = d.view; render(); return; }
  if (S.screen === 'add'){
    const a = S.add;
    if (d.close !== undefined){ S.screen = S.base; S.add = null; render(); post(); return; }
    if (d.key){
      let s = a.digits;
      if (d.key === 'del') s = s.slice(0,-1);
      else if (d.key === '.'){ if (!s.includes('.')) s = (s || '0') + '.'; }
      else if (!(s.includes('.') && s.split('.')[1].length >= 2) && s.replace('.','').length < 8) s = (s === '0' ? '' : s) + d.key;
      a.digits = s; render(); return;
    }
    if (d.step){ if (d.step === 'category' && !addMinor(a)) return; a.step = d.step; render(); return; }
    if (d.pick){ a.cat = d.pick; a.step = 'name'; render(); return; }
    if (d.name){ a.name = d.name; render(); document.querySelector('[data-save]').focus(); return; }
    if (d.more !== undefined){ a.more = !a.more; render(); return; }
    if (d.date){ a.date = d.date; render(); return; }
    if (d.toggle === 'shared'){ a.shared = !a.shared; render(); return; }
    if (d.toggle === 'kind'){ a.kind = a.kind === 'income' ? 'expense' : 'income'; a.cat = null; if (a.step === 'name') a.step = 'category'; render(); return; }
    if (d.save !== undefined){ if (a.name.trim()) saveAdd(); return; }
    return;
  }
  if (d.jump){ document.getElementById(d.jump).scrollIntoView({behavior:'smooth'}); return; }
  if (d.clear !== undefined){ S.q = ''; S.filter = 'all'; render(); return; }
  if (d.open){ S.open = S.open === d.open ? null : d.open; render(); return; }
  if (d.go){ if (d.filter) S.filter = d.filter; go(d.go, {cat:d.cat, back:d.back}); return; }
  if (d.filter){ S.filter = d.filter; render(); return; }
  if (d.cat){ S.cat = d.cat; render(); window.scrollTo({top:0}); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.q = e.target.value; S.focus = 'q'; render(); }
  if (e.target.id === 'nm' && S.add){ S.add.name = e.target.value; const s = document.querySelector('[data-save]'); if (s) s.disabled = !S.add.name.trim(); const n = document.querySelector('[data-step="name"]'); if (n){ n.innerHTML = S.add.name ? S.add.name.replace(/</g,'&lt;') : '&nbsp;'; } }
  if (e.target.id === 'note' && S.add){ S.add.note = e.target.value; }
});
document.addEventListener('keydown', e => {
  if (S.screen !== 'add') return;
  if (e.key === 'Escape'){ S.screen = S.base; S.add = null; render(); post(); return; }
  if (S.add.step === 'amount' && !e.metaKey && !e.ctrlKey){
    const k = /^[0-9]$/.test(e.key) ? e.key : (e.key === '.' || e.key === ',') ? '.' : e.key === 'Backspace' ? 'del' : null;
    if (k){ e.preventDefault(); document.querySelector(`[data-key="${k}"]`).click(); }
    if (e.key === 'Enter' && addMinor(S.add)){ e.preventDefault(); S.add.step = 'category'; render(); }
  }
  if (S.add.step === 'name' && e.key === 'Enter' && S.add.name.trim()){ e.preventDefault(); saveAdd(); }
  if (e.key === 'Tab'){ // keep focus inside the dialog
    const f = [...document.querySelectorAll('.sheet button:not([disabled]), .sheet input')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});
let lastDesk = isDesk();
window.addEventListener('resize', () => { if (isDesk() !== lastDesk){ lastDesk = isDesk(); render(); } });

// self-check: totals from the data must match the data's own summary
const C0 = calc(D.transactions);
console.assert(C0.total === D.summary.spent_minor && C0.budget === D.summary.budget_total_minor && C0.shared === D.summary.shared.shared_spending_minor, 'totals drift from summary');
console.assert(addMinor({digits:'45.5'}) === 4550 && addMinor({digits:'0.05'}) === 5 && addMinor({digits:'120'}) === 12000, 'amount parse');

if (S.screen === 'add') S.add = newAdd();
render(); post();
})();
</script>
