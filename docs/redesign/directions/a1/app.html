<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow: Banknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Colour rule: intaglio banknote inks. One engraving ink per account (sepia = personal, slate = shared),
   then two status inks only: green = money left or in, vermilion = over. Everything else is ink on paper. */
:root{
  --ground:#EEEFF2; --paper:#FFFFFF; --paper-2:#F6F7F9;
  --ink:#14161C; --ink-2:#464C58; --ink-3:#5F6674;
  --rule:#DCDFE5; --rule-2:#C5CAD3;
  --personal:#4A2C20; --personal-ink:#F6EEE6; --personal-line:rgba(246,238,230,.16);
  --shared:#2E3C47; --shared-ink:#EEF2F5; --shared-line:rgba(238,242,245,.16);
  --shared-text:#3D5466;
  --personal-text:#7A4630;
  --in:#1D7443; --in-bg:#DDF0E4; --in-pill:#145C33;
  --over:#B83118; --over-bg:#FBE4DC; --over-pill:#952510;
  --accent:#4A2C20; --accent-ink:#FFFFFF;
  --grey-line:#A9AFBA;
  --focus:#3B5BDB;
  --shadow:0 1px 0 rgba(20,22,28,.04), 0 10px 30px -12px rgba(20,22,28,.28);
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans:"Hanken Grotesk", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"]{
  --ground:#0D0F14; --paper:#161921; --paper-2:#1C2029;
  --ink:#ECEDF1; --ink-2:#B7BCC7; --ink-3:#959BA8;
  --rule:#272B36; --rule-2:#363B48;
  --personal:#4E2F21; --personal-ink:#F6EEE6; --personal-line:rgba(246,238,230,.15);
  --shared:#34495A; --shared-ink:#EEF2F5; --shared-line:rgba(238,242,245,.15);
  --shared-text:#A8C1D3;
  --personal-text:#E2B394;
  --in:#62CF91; --in-bg:#163322; --in-pill:#86E0AC;
  --over:#FF7D5E; --over-bg:#3A1A12; --over-pill:#FFA088;
  --accent:#E2B394; --accent-ink:#2A170E;
  --grey-line:#5A606E;
  --focus:#9DB0FF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:var(--serif)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;padding:47px 16px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:8px 10px 34px;display:flex;align-items:center;gap:2px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;min-height:48px;font-size:11.5px;color:var(--ink-3);border-radius:10px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--personal-text)}
.addbtn{flex:none;display:flex;align-items:center;gap:6px;height:46px;padding:0 16px 0 12px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;margin-left:6px}

.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:6px;position:relative}
.top h1{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--ink-3)}
.top.center{justify-content:center}
.top.center h1{font-size:17px;font-family:var(--sans);font-weight:600}
.back{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}

.section{margin-top:28px}
.section > h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 10px;letter-spacing:-.005em;display:flex;justify-content:space-between;align-items:baseline}
.section > h2 small{font-family:var(--sans);font-size:13px;color:var(--ink-3);font-weight:400}
.panel{background:var(--paper);border-radius:16px;padding:4px 16px}
.lead{font-size:14px;color:var(--ink-2);margin:0 0 10px}

/* ---------- the note (card) ---------- */
.note{position:relative;border-radius:20px;color:var(--personal-ink);background:var(--personal);padding:18px 20px 18px;overflow:hidden;box-shadow:var(--shadow);isolation:isolate}
.note.shared{background:var(--shared);color:var(--shared-ink)}
.note svg.engrave{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.note svg.engrave path{fill:none;stroke:var(--personal-line);stroke-width:.8}
.note.shared svg.engrave path{stroke:var(--shared-line)}
.note::after{content:"";position:absolute;inset:7px;border-radius:14px;border:1px solid var(--personal-line);box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4px var(--personal-line);pointer-events:none}
.note.shared::after{border-color:var(--shared-line);box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4px var(--shared-line)}
.rosette{position:absolute;top:10px;right:10px;width:128px;height:128px;z-index:0}
.rosette path{fill:none;stroke:currentColor;stroke-width:.7;opacity:.55}
.rosette circle.hole{fill:var(--personal)}
.rosette circle.ring{fill:none;stroke:currentColor;stroke-width:.8;opacity:.7}
.rosette text{font-family:var(--serif);font-weight:500;font-size:46px;fill:currentColor;font-variant-numeric:lining-nums}
.rosette-l{position:absolute;top:140px;right:10px;width:128px;text-align:center;font-size:12.5px;opacity:.88}
.note .head{position:relative;z-index:1;min-height:132px;padding-right:130px}
.note .cyc{font-family:var(--serif);font-size:20px;line-height:1.2}
.note .cyc small{display:block;font-family:var(--sans);font-size:13px;opacity:.82;margin-top:2px}
.note .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.note .lbl{font-size:13.5px;opacity:.82}
.note .mark{font-family:var(--serif);font-size:13px;opacity:.82;letter-spacing:.01em}
.hero{font-family:var(--serif);font-weight:500;font-size:60px;line-height:1;letter-spacing:-.02em;margin:22px 0 8px;font-variant-numeric:lining-nums proportional-nums}
.hero .frac{font-size:.42em;vertical-align:.95em;margin-left:1px;letter-spacing:0}
.hero .cur{font-size:.34em;margin-left:6px;opacity:.8;letter-spacing:0}
.note .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;gap:12px}
.note .days{font-family:var(--serif);font-size:30px;line-height:1}
.note .days small{font-family:var(--sans);font-size:13.5px;opacity:.82;margin-left:6px}
.note .perday{text-align:right;font-size:13.5px;opacity:.82}
.note .perday b{display:block;font-weight:500;opacity:1;font-size:15px}
.cyclebar{display:flex;gap:2px;margin-top:16px}
.cyclebar i{flex:1;height:6px;border-radius:2px;background:currentColor;opacity:.22}
.cyclebar i.past{opacity:.75}
.cyclebar i.today{opacity:1;height:10px;margin-top:-2px}

.shared-note{padding:16px 18px}
.shared-note .big{font-family:var(--serif);font-size:30px;font-weight:500;margin:10px 0 2px;font-variant-numeric:lining-nums}
.pair{display:flex}
.pair span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;border:2px solid var(--shared);}
.pair span:first-child{background:#E9D3C4;color:#4A2C20}
.pair span+span{margin-left:-8px;background:#EEF2F5;color:#2E3C47}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:14px 0 8px;gap:2px}
.split i{display:block;background:var(--shared-ink)}
.split i+i{opacity:.4}

/* ---------- ledger rows ---------- */
.ledger{width:100%;border-collapse:collapse}
.lrow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.lrow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px}
.dot.p{background:var(--personal-text)}
.dot.s{background:var(--shared-text)}
.dot.m{border:1.5px dashed var(--ink-3)}
.lrow .t{font-size:15px}
.lrow .t small{display:block;font-size:13px;color:var(--ink-3)}
.amt{font-family:var(--serif);font-size:16px;text-align:right;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.amt.muted{color:var(--ink-3)}
.amt.in{color:var(--in)}
.total{border-top:1px solid var(--ink)!important;}
.total .amt{font-weight:600}
.dbl{border-bottom:3px double var(--ink);padding-bottom:1px}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.pill.left{background:var(--in-bg);color:var(--in-pill)}
.pill.over{background:var(--over-bg);color:var(--over-pill)}
.pill.even{background:var(--paper-2);color:var(--ink-2)}

/* over budget block (red card with the next step) */
.overs{background:var(--over-bg);border-radius:16px;padding:6px 16px}
.overs button{display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--over) 22%,transparent)}
.overs button:first-child{border-top:0}
.overs .nm{font-weight:500}
.overs .nm small{display:block;font-weight:400;font-size:13px;color:var(--ink-2)}
.overs .v{font-family:var(--serif);font-size:17px;color:var(--over-pill);font-variant-numeric:tabular-nums}
.overs .v em{font-style:normal;font-family:var(--sans);font-size:13px;margin-left:4px}

/* chart */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11.5px;fill:var(--ink-3)}
.chart .now{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.chart .ln-cur{fill:none;stroke:var(--personal-text);stroke-width:2.2}
.chart .ln-last{fill:none;stroke:var(--grey-line);stroke-width:1.5}
.chart .ln-budget{stroke:var(--ink-2);stroke-width:1}
.chart .axis{stroke:var(--rule-2);stroke-width:1}
.chart .pt{fill:var(--personal-text);stroke:var(--paper);stroke-width:2}
.chart .over-area{fill:var(--over);opacity:.12}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2.2px solid var(--personal-text)}
.legend i.g{border-top:1.5px solid var(--grey-line)}
.legend i.b{border-top:1px solid var(--ink-2)}
.legend i.sw{width:10px;height:10px;border:0;border-radius:2px;background:var(--personal-text)}
.legend i.sw.s{background:var(--shared-text)}
.legend i.tick{width:2px;height:12px;border:0;background:var(--ink)}

/* transactions */
.filters{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.seg{display:inline-flex;background:var(--paper);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:14px;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:0 10px;height:42px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink);font-size:15px}
.day{margin-top:22px}
.day h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;padding:0 2px;font-weight:500;font-family:var(--serif);font-size:17px}
.day h3 .amt{font-size:14px;color:var(--ink-3);font-family:var(--sans)}
.tx{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--rule);min-height:56px}
.panel .tx:first-child{border-top:0}
.tx .nm{font-size:15.5px}
.tx .meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-top:1px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:1px 7px 1px 5px;border-radius:6px}
.tag.shared{color:var(--shared-text);background:color-mix(in srgb,var(--shared-text) 12%,transparent)}
.tag.moved{color:var(--ink-2);border:1px dashed var(--ink-3)}
.tx.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--in) 18%,transparent)}to{background:transparent}}
.detail{padding:2px 0 14px;font-size:14px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.detail dt{color:var(--ink-3)}
.detail dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* budgets */
.btable{width:100%;border-collapse:collapse}
.btable th{font-weight:400;font-size:12.5px;color:var(--ink-3);text-align:right;padding:10px 0 6px}
.btable th:first-child{text-align:left}
.btable td{padding:0;border-top:1px solid var(--rule)}
.btable tr:first-child td{border-top:0}
.brow{display:grid;grid-template-columns:1fr 92px 112px;gap:6px;align-items:center;width:100%;text-align:left;padding:10px 0 9px}
.brow .c{font-size:15px}
.brow .s{font-family:var(--serif);text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.brow .s small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.brow .p{text-align:right}
.brow .bar{grid-column:1/-1;height:4px;background:var(--paper-2);border-radius:2px;position:relative;overflow:hidden;margin-top:2px}
.brow .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--personal-text);border-radius:2px}
.brow .bar i.o{background:var(--over)}
.brow[aria-current="true"] .c{font-weight:600}
.bhead{display:grid;grid-template-columns:1fr 92px 112px;gap:6px;font-size:12.5px;color:var(--ink-3);padding:10px 0 4px}
.bhead span+span{text-align:right}

.meter{position:relative;height:14px;border-radius:7px;background:var(--paper-2);margin:16px 0 8px;overflow:visible}
.meter i{position:absolute;top:0;bottom:0;left:0;border-radius:7px 0 0 7px;background:var(--personal-text)}
.meter i.o{border-radius:0 7px 7px 0;background:var(--over)}
.meter b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}

.overline{display:inline-flex;align-items:baseline;gap:6px;background:var(--over-bg);color:var(--over-pill);border-radius:10px;padding:6px 12px;font-size:15px;font-weight:500}
.overline .serif{font-size:20px}

/* analytics bars */
.cbar{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.cbar:first-child{border-top:0}
.cbar .c{font-size:14.5px}
.cbar .track{position:relative;height:12px}
.cbar .track i{position:absolute;top:0;bottom:0;border-radius:2px}
.cbar .track i.p{background:var(--personal-text)}
.cbar .track i.s{background:var(--shared-text)}
.cbar .track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.cbar .nums{grid-column:2;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cbar .nums .a{font-family:var(--serif);color:var(--ink);font-size:15px}
.cbar .nums .up{color:var(--over-pill)}
.cbar .nums .dn{color:var(--in)}
.answer{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:6px 0 6px}
.answer .hl{color:var(--personal-text)}

/* states */
.state-msg{padding:22px 4px;text-align:left}
.state-msg p{margin:0 0 12px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--paper-2);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.skel{height:14px;border-radius:4px;background:var(--rule);margin:18px 0;animation:none}
.skel.w6{width:60%}.skel.w4{width:40%}.skel.w8{width:80%}
.loading .figure{opacity:.55}
.updating{font-size:13px;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center}
.err{display:flex;gap:10px;align-items:flex-start;background:var(--over-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.err svg{color:var(--over)}

/* proto switcher */
.proto{position:fixed;top:8px;right:8px;z-index:20;display:flex;gap:2px;background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px dashed var(--ink-3);border-radius:9px;padding:2px;font-size:11px}
.proto button{padding:4px 7px;border-radius:7px;color:var(--ink-2)}
.proto button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- add ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:10;background:var(--ground);display:flex;flex-direction:column}
.sheet{flex:1;display:flex;flex-direction:column;padding:47px 16px 34px;min-height:0}
.entry{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-family:var(--serif);font-size:17px;padding:10px 0 12px;border-bottom:3px double var(--rule-2);min-height:46px}
.entry button{padding:2px 4px;border-radius:6px;color:var(--ink)}
.entry button.todo{color:var(--ink-3)}
.entry button.cur{color:var(--personal-text);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.entry .sep{color:var(--ink-3)}
.steps{display:flex;gap:6px;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.amount-read{font-family:var(--serif);font-weight:500;font-size:64px;line-height:1;letter-spacing:-.02em;text-align:center;margin:auto 0 0;padding:20px 0 8px;font-variant-numeric:tabular-nums lining-nums;min-height:100px}
.amount-read .cur{font-size:24px;color:var(--ink-3);margin-left:6px}
.amount-read.empty{color:var(--ink-3)}
.amount-read .caret{display:inline-block;width:2px;height:.8em;background:var(--personal-text);vertical-align:-.04em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.off{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0 14px}
.off button{font-size:13.5px;padding:7px 11px;border-radius:10px;background:var(--paper);color:var(--ink-2);min-height:36px;display:inline-flex;gap:6px;align-items:center}
.off button[aria-pressed="true"]{background:var(--shared);color:var(--shared-ink)}
.off button.inc[aria-pressed="true"]{background:var(--in-bg);color:var(--in-pill)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;border-radius:14px;background:var(--paper);font-size:24px;font-family:var(--serif)}
.keypad button:active{background:var(--paper-2)}
.next{margin-top:10px;width:100%;height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.next[disabled]{opacity:.35;cursor:not-allowed}
.cats{display:flex;flex-direction:column;margin-top:14px;overflow:auto}
.cats h3{font-size:13px;color:var(--ink-3);font-weight:400;margin:10px 0 4px}
.cat{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-top:1px solid var(--rule);text-align:left;font-size:16px}
.cat small{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.namefield label{display:block;font-size:13px;color:var(--ink-3);margin:18px 0 6px}
.namefield input{width:100%;height:52px;border-radius:12px;border:1px solid var(--rule-2);background:var(--paper);padding:0 14px;font-size:17px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sugg span{font-size:13px;color:var(--ink-3);margin-right:2px}

</head>
<body>
<div id="root"></div>
<script src="../../data/cashflow-fake.js"></script>
<script>
(function(){
const D = window.CASHFLOW_DATA;
const SCREENS = ['home','add','transactions','budget','analytics'];
const params = new URLSearchParams(location.search);
const P = window.PROTO || {};
const S = {
  screen: SCREENS.includes(P.screen) ? P.screen : (SCREENS.includes(params.get('screen')) ? params.get('screen') : 'home'),
  theme: (P.theme || params.get('theme')) === 'dark' ? 'dark' : 'light',
  base: 'home', back: null, view: 'content', cat: 'eating_out',
  filter: 'all', q: '', open: null, newId: null, focus: null,
  tx: D.transactions.slice(),
  add: null
};
if (S.screen !== 'add') S.base = S.screen;

/* ---------- money and dates: integer øre, Intl at the edge ---------- */
const nf = o => new Intl.NumberFormat(D.locale, Object.assign({style:'currency', currency:D.currency}, o));
const F2 = nf({}), F0 = nf({maximumFractionDigits:0, minimumFractionDigits:0}), FS = nf({signDisplay:'exceptZero'}), F0S = nf({maximumFractionDigits:0, minimumFractionDigits:0, signDisplay:'exceptZero'});
const MINUS = '−';
const m = (minor, o={}) => (o.whole ? (o.sign ? F0S : F0) : o.sign ? FS : F2).format(minor/100).replace('-', MINUS);
function heroMoney(minor){
  return F2.formatToParts(minor/100).map(p => {
    if (p.type === 'decimal' || p.type === 'fraction') return `<span class="frac">${p.value}</span>`;
    if (p.type === 'currency') return `<span class="cur">${p.value}</span>`;
    if (p.type === 'literal') return '';
    if (p.type === 'minusSign') return MINUS;
    return p.value;
  }).join('').replace('</span><span class="frac">','');
}
const pct = (a,b) => Math.round(a*100/b);
const dt = s => { const [y,mo,d] = s.split('-').map(Number); return new Date(y, mo-1, d); };
const dayIdx = (s, start) => Math.round((dt(s) - dt(start)) / 864e5);
const DF = (o) => new Intl.DateTimeFormat(D.locale, o);
function dayLabel(s){
  const diff = dayIdx(D.today, s);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  const parts = DF({weekday:'short', day:'numeric', month:'short'}).formatToParts(dt(s));
  return parts.filter(p => p.type !== 'literal').map(p => p.value).join(' ');
}
const cycleRange = DF({day:'numeric', month:'short'}).format(dt(D.cycle.start)) + ' \u2013 ' + DF({day:'numeric', month:'short'}).format(new Date(dt(D.cycle.next_payday) - 864e5));
const CAT = Object.fromEntries(D.categories.map(c => [c.id, c]));
const EXP = D.categories.filter(c => c.kind === 'expense');

/* ---------- everything computed from transactions ---------- */
function calc(tx){
  const spent = {}, spentShared = {}, lastSpent = {};
  EXP.forEach(c => { spent[c.id] = 0; spentShared[c.id] = 0; lastSpent[c.id] = 0; });
  let myTop = 0, annaTop = 0, income = 0, moved = 0, savings = 0;
  const cum = new Array(D.cycle.days_total).fill(0);
  for (const t of tx){
    if (t.kind === 'expense'){ spent[t.category] += t.amount_minor; if (t.shared) spentShared[t.category] += t.amount_minor; cum[dayIdx(t.date, D.cycle.start)] += t.amount_minor; }
    else if (t.kind === 'topup'){ if (t.paid_by === 'me') myTop += t.amount_minor; else annaTop += t.amount_minor; }
    else if (t.kind === 'income') income += t.amount_minor;
    else if (t.kind === 'transfer') savings += t.amount_minor;
  }
  const lastCum = new Array(D.cycle.days_total).fill(0);
  for (const t of D.last_cycle_transactions){
    if (t.kind !== 'expense') continue;
    lastSpent[t.category] += t.amount_minor;
    lastCum[dayIdx(t.date, D.last_cycle.start)] += t.amount_minor;
  }
  for (let i=1;i<cum.length;i++){ cum[i] += cum[i-1]; lastCum[i] += lastCum[i-1]; }
  const budget = EXP.reduce((a,c) => a + c.budget_minor, 0);
  const total = Object.values(spent).reduce((a,b) => a+b, 0);
  const shared = Object.values(spentShared).reduce((a,b) => a+b, 0);
  const lastTotal = Object.values(lastSpent).reduce((a,b) => a+b, 0);
  const allTop = myTop + annaTop;
  const todayIdx = dayIdx(D.today, D.cycle.start);
  const left = budget - total;
  return {
    spent, spentShared, lastSpent, budget, total, shared, personal: total - shared, lastTotal,
    left, perDay: Math.floor(left / D.cycle.days_left), income, savings,
    myTop, annaTop, allTop,
    myShare: allTop ? Math.round(shared * myTop / allTop) : 0,
    myPct: allTop ? pct(myTop, allTop) : 0,
    sharedLeft: allTop - shared,
    cum, lastCum, todayIdx,
    overs: EXP.filter(c => spent[c.id] > c.budget_minor).map(c => ({c, over: spent[c.id] - c.budget_minor})).sort((a,b) => b.over - a.over)
  };
}
function catCum(tx, id, start, len){
  const a = new Array(len).fill(0);
  tx.forEach(t => { if (t.kind === 'expense' && t.category === id){ const i = dayIdx(t.date, start); if (i>=0 && i<len) a[i] += t.amount_minor; }});
  for (let i=1;i<len;i++) a[i] += a[i-1];
  return a;
}

/* ---------- icons: one family, 1.6 stroke, round ends ---------- */
const I = {
  cycle:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z" fill="currentColor" stroke="none" opacity=".9"/>',
  ledger:'<path d="M5 6h14M5 10h14M5 14h9M5 18h6"/>',
  budgets:'<path d="M4 7h11M4 12h16M4 17h7"/><path d="M15 5v4M20 10v4M11 15v4"/>',
  compare:'<path d="M6 20V10M12 20V4M18 20v-7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  shared:'<circle cx="9" cy="12" r="4.5"/><circle cx="15" cy="12" r="4.5"/>',
  moved:'<path d="M4 12h13M13 7l5 5-5 5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  del:'<path d="M9 6h10v12H9l-5-6z"/><path d="M12 10l4 4M16 10l-4 4"/>',
  alert:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.3"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8 3.5v4M16 3.5v4"/>',
  noteI:'<path d="M5 5h14v10l-4 4H5z"/><path d="M15 19v-4h4"/>',
  inI:'<path d="M12 19V6M6 12l6-6 6 6"/>'
};
const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* engraving: fine wave lines like a banknote, drawn once */
function engraving(seed){
  let p = '';
  for (let i=0;i<22;i++){
    let d = '';
    for (let x=0;x<=420;x+=6){
      const y = 14 + i*10 + 7*Math.sin(x/34 + i*0.42 + seed) + 4*Math.sin(x/11 + i*0.9);
      d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
    }
    p += `<path d="${d}"/>`;
  }
  return `<svg class="engrave" viewBox="0 0 420 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${p}</svg>`;
}

function rosette(n){
  let p = '';
  const c = 64;
  [[9,4,3.2,0],[9,4,4.4,10],[9,4,5.6,20],[7,3,4.8,0]].forEach(([R,r,d,rot]) => {
    const k = (c - 3) / (R - r + d), a0 = rot*Math.PI/180;
    let path = '';
    for (let t=0; t<=r*2*Math.PI + .01; t+=.02){
      const x = (R-r)*Math.cos(t) + d*Math.cos((R-r)/r*t), y = (R-r)*Math.sin(t) - d*Math.sin((R-r)/r*t);
      path += (t ? 'L' : 'M') + (c + k*(x*Math.cos(a0) - y*Math.sin(a0))).toFixed(1) + ' ' + (c + k*(x*Math.sin(a0) + y*Math.cos(a0))).toFixed(1);
    }
    p += `<path d="${path}Z"/>`;
  });
  return `<svg class="rosette" viewBox="0 0 128 128" aria-hidden="true">${p}<circle class="hole" cx="64" cy="64" r="30"/><circle class="ring" cx="64" cy="64" r="30"/><circle class="ring" cx="64" cy="64" r="27"/><text x="64" y="80" text-anchor="middle">${n}</text></svg>`;
}

/* ---------- navigation ---------- */
function post(){ try { parent.postMessage({type:'at', screen:S.screen}, '*'); } catch(e){} }
function go(screen, opts={}){
  if (!SCREENS.includes(screen)) return;
  if (screen === 'add'){ S.add = newAdd(); }
  else { S.back = opts.back || null; S.base = screen; S.open = null; }
  if (opts.cat) S.cat = opts.cat;
  S.screen = screen;
  render(); post();
  if (screen !== 'add') window.scrollTo(0,0);
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'go') go(d.screen);
  if (d.type === 'theme'){ S.theme = d.theme === 'dark' ? 'dark' : 'light'; applyTheme(); }
});
function applyTheme(){ document.documentElement.setAttribute('data-theme', S.theme); }

/* ---------- shared pieces ---------- */
const TABS = [['home','Cycle','cycle'],['transactions','Ledger','ledger'],['budget','Budgets','budgets'],['analytics','Compare','compare']];
function chrome(){
  const cur = S.base;
  const tabs = TABS.map(([id,l,i]) => `<button class="tab" data-go="${id}" ${cur===id?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('');
  const rail = TABS.map(([id,l,i]) => `<button class="nav" data-go="${id}" ${cur===id?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('');
  return {
    rail: `<nav class="rail" aria-label="Main"><div class="brand">Cashflow</div><div class="cyc">${D.cycle.label} cycle, ${D.cycle.days_left} days to payday</div>${rail}<button class="addbtn" data-go="add">${ic('plus')}Add</button></nav>`,
    bar: `<nav class="tabbar" aria-label="Main">${tabs}<button class="addbtn" data-go="add" aria-label="Add a transaction">${ic('plus')}Add</button></nav>`
  };
}
function protoSwitch(){
  if (S.screen === 'add') return '';
  const b = v => `<button data-view="${v}" aria-pressed="${S.view===v}">${v[0].toUpperCase()+v.slice(1)}</button>`;
  return `<div class="proto" role="group" aria-label="Prototype state">${b('content')}${b('empty')}${b('loading')}${b('error')}<button data-theme-toggle aria-label="Switch theme">${S.theme==='dark'?'Light':'Dark'}</button></div>`;
}
const skel = (n=4) => Array.from({length:n}, (_,i) => `<div class="skel ${['w8','w6','w4','w6'][i%4]}"></div>`).join('');
const errBox = what => `<div class="err" role="alert">${ic('alert')}<div>${what} could not load. Check your connection and try again.<div style="margin-top:10px"><button class="btn ghost" data-view="content">Retry</button></div></div></div>`;
const emptyBox = text => `<div class="state-msg"><p>${text}</p><button class="btn" data-go="add">${ic('plus')}Add a transaction</button></div>`;
const listState = (what, empty, body) => S.view === 'loading' ? skel() : S.view === 'error' ? errBox(what) : S.view === 'empty' ? emptyBox(empty) : body;
const updating = () => S.view === 'loading' ? `<span class="updating">Updating…</span>` : '';

/* ---------- pace chart ---------- */
function paceChart(cur, last, budget, todayIdx, opts={}){
  const w = 360, h = opts.h || 150, padT = 18, padB = 22;
  const max = Math.max(budget, cur[todayIdx], ...last) * 1.06;
  const min = opts.floor ? Math.min(cur[0], last[0]) * 0.92 : 0;
  const x = i => (i/(cur.length-1))*w;
  const y = v => padT + (h-padT-padB) * (1 - (v-min)/(max-min));
  const pts = (a, n) => a.slice(0, n).map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  const by = y(budget);
  const overArea = cur[todayIdx] > budget ? `<rect class="over-area" x="0" y="${y(max)}" width="${w}" height="${by - y(max)}"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${opts.label}">
    ${overArea}
    <line class="ln-budget" x1="0" x2="${w}" y1="${by}" y2="${by}"/>
    <text x="0" y="${by-6}">Budget ${m(budget,{whole:1})}</text>
    <path class="ln-last" d="${pts(last, last.length)}"/>
    <path class="ln-cur" d="${pts(cur, todayIdx+1)}"/>
    <circle class="pt" cx="${x(todayIdx)}" cy="${y(cur[todayIdx])}" r="5"/>
    <line class="axis" x1="0" x2="${w}" y1="${h-padB}" y2="${h-padB}"/>
    <text x="0" y="${h-6}">${DF({day:'numeric',month:'short'}).format(dt(D.cycle.start))}</text>
    <text x="${x(todayIdx)-10}" y="${y(cur[todayIdx])+18}" text-anchor="end" class="now">Today ${m(cur[todayIdx],{whole:1})}</text>
    <text x="${w}" y="${h-6}" text-anchor="end">Payday ${DF({day:'numeric',month:'short'}).format(dt(D.cycle.next_payday))}</text>
  </svg>
  <div class="legend"><span><i></i>${D.cycle.label}</span><span><i class="g"></i>${D.last_cycle.label}</span><span><i class="b"></i>Budget</span></div>`;
}

/* ---------- screens ---------- */
function home(){
  const C = calc(S.view === 'empty' ? [] : S.tx);
  const days = Array.from({length:D.cycle.days_total}, (_,i) => `<i class="${i<C.todayIdx?'past':i===C.todayIdx?'today':''}"></i>`).join('');
  const lastAt = C.lastCum[C.todayIdx];
  const diff = C.cum[C.todayIdx] - lastAt;
  const paceLine = diff >= 0 ? `${m(diff,{whole:1})} more than ${D.last_cycle.label} by this day.` : `${m(-diff,{whole:1})} less than ${D.last_cycle.label} by this day.`;
  const note = `<div class="note figure-wrap" aria-label="Left to spend">
    ${engraving(0)}
    ${rosette(D.cycle.days_left)}<div class="rosette-l">days to payday</div>
    <div class="head"><div class="cyc">${D.cycle.label} cycle<small>${cycleRange}</small></div><div class="lbl" style="margin-top:40px">Left to spend</div></div>
    <div class="hero figure" style="margin-top:4px">${heroMoney(C.left)}</div>
    <div class="lbl">of ${m(C.budget,{whole:1})} budgeted</div>
    <div class="cyclebar" aria-hidden="true">${days}</div>
    <div class="foot"><div class="lbl">Day ${C.todayIdx+1} of ${D.cycle.days_total}</div><div class="perday">About<b class="num">${m(C.perDay,{whole:1})} a day until payday</b></div></div>
  </div>`;
  const split = splitPanel(C);
  const sharedNote = sharedCard(C);
  const overs = C.overs.length ? `<div class="section"><h2>Over budget</h2><div class="overs">${C.overs.map(o =>
    `<button data-go="budget" data-cat="${o.c.id}" data-back="home"><span class="nm">${o.c.name}<small class="num">${m(C.spent[o.c.id],{whole:1})} of ${m(o.c.budget_minor,{whole:1})}</small></span><span class="v">${m(o.over)}<em>over</em></span>${ic('chev','s')}</button>`).join('')}</div></div>` : '';
  const pace = `<div class="section"><h2>Pace ${updating()}</h2><p class="lead">${S.view==='empty' ? 'Nothing spent yet this cycle.' : paceLine}</p><div class="panel" style="padding:14px 16px 12px">${
    S.view==='loading' ? skel(3) : S.view==='error' ? errBox('Pace') : S.view==='empty' ? `<p class="lead" style="margin:6px 0">The line starts with your first transaction.</p>` :
    paceChart(C.cum, C.lastCum, C.budget, C.todayIdx, {floor:1, h:170, label:`Spending through the cycle: ${m(C.total,{whole:1})} by today, budget ${m(C.budget,{whole:1})}`})}</div></div>`;
  const recent = groupDays(S.tx.slice(0,6));
  const latest = `<div class="section desk-only"><h2>Latest <small><button data-go="transactions" style="color:var(--personal-text)">All transactions</button></small></h2>${listState('Transactions','No transactions yet this cycle.', recent)}</div>`;
  return `<div class="${S.view==='loading'?'loading':''}">
    <h1 class="sr">${D.cycle.label} cycle</h1>
    <div class="grid2"><div class="col">${note}${split}${sharedNote}</div><div class="col">${pace}${S.view==='content'||S.view==='loading'?overs:''}${isDesk()?latest:''}</div></div>
  </div>`;
}
function splitPanel(C){ return `<div class="section"><h2>Spent this cycle <small class="num">${m(C.total)}</small></h2><div class="panel">
    <div class="lrow"><i class="dot p"></i><div class="t">Personal</div><div class="amt">${m(C.personal)}</div></div>
    <div class="lrow"><i class="dot s"></i><div class="t">Shared with ${D.partner}</div><div class="amt">${m(C.shared)}</div></div>
    <div class="lrow"><i class="dot m"></i><div class="t">Moved to the shared account<small>Not spending</small></div><div class="amt muted">${m(C.myTop)}</div></div>
  </div></div>`; }
function sharedCard(C){ return `<div class="section"><button class="note shared shared-note" data-go="transactions" data-filter="shared" style="width:100%;text-align:left" aria-label="Shared account with ${D.partner}, see shared transactions">
    ${engraving(2)}
    <div class="row"><span class="lbl">Shared account with ${D.partner}</span><span class="pair" aria-hidden="true"><span>${D.partner[0]}</span><span>You</span></span></div>
    <div class="big num">${m(C.sharedLeft)}</div><div class="lbl">left in the account</div>
    <div class="split" aria-hidden="true"><i style="flex:${C.myTop}"></i><i style="flex:${C.annaTop}"></i></div>
    <div class="row"><span class="lbl">You put in ${C.myPct}%, so your share of ${m(C.shared,{whole:1})} spent is <b class="num">${m(C.myShare,{whole:1})}</b></span></div>
  </button></div>`; }
const isDesk = () => window.innerWidth >= 900;

function txRow(t){
  const c = t.category ? CAT[t.category] : null;
  let meta = '', amt = '', cls = 'amt';
  if (t.kind === 'expense'){ meta = c.name; amt = m(t.amount_minor); }
  else if (t.kind === 'income'){ meta = c.name; amt = m(t.amount_minor,{sign:1}); cls += ' in'; }
  else if (t.kind === 'topup'){ meta = t.paid_by === 'me' ? `<span class="tag moved">${ic('moved','s')}Moved to shared</span><span>Not spending</span>` : `<span class="tag moved">${ic('moved','s')}${D.partner}'s top-up</span>`; amt = m(t.amount_minor); cls += ' muted'; }
  else if (t.kind === 'transfer'){ meta = `<span class="tag moved">${ic('moved','s')}Moved to savings</span><span>Not spending</span>`; amt = m(t.amount_minor); cls += ' muted'; }
  const shared = t.shared && t.kind === 'expense' ? `<span class="tag shared">${ic('shared','s')}Shared</span>` : '';
  const C = S._c;
  const open = S.open === t.id;
  const det = open ? `<dl class="detail">
      <dt>Date</dt><dd>${DF({weekday:'long',day:'numeric',month:'long'}).format(dt(t.date))}</dd>
      ${t.kind==='expense' ? `<dt>Account</dt><dd>${t.shared ? `Shared with ${D.partner}` : 'Personal'}</dd>` : ''}
      ${t.shared && t.kind==='expense' && C.allTop ? `<dt>Your share, ${C.myPct}%</dt><dd>${m(Math.round(t.amount_minor*C.myTop/C.allTop))}</dd>` : ''}
      ${t.note ? `<dt>Note</dt><dd>${t.note}</dd>` : ''}</dl>` : '';
  return `<button class="tx ${S.newId===t.id?'new':''}" data-open="${t.id}" aria-expanded="${open}"><span><span class="nm">${t.name}</span><span class="meta">${meta}${shared ? ' '+shared : ''}</span></span><span class="${cls}">${amt}</span></button>${det}`;
}
function groupDays(list){
  S._c = S._c || calc(S.tx);
  const days = {};
  list.forEach(t => (days[t.date] = days[t.date] || []).push(t));
  return Object.keys(days).sort().reverse().map(d => {
    const out = days[d].filter(t => t.kind === 'expense').reduce((a,t) => a + t.amount_minor, 0);
    return `<section class="day"><h3><span>${dayLabel(d)}</span><span class="amt num">${out ? m(out) : ''}</span></h3><div class="panel">${days[d].map(txRow).join('')}</div></section>`;
  }).join('');
}
function transactions(){
  S._c = calc(S.tx);
  const q = S.q.trim().toLowerCase();
  let list = S.tx.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  if (S.filter === 'personal') list = list.filter(t => !t.shared);
  if (S.filter === 'shared') list = list.filter(t => t.shared);
  if (q) list = list.filter(t => (t.name + ' ' + (t.category ? CAT[t.category].name : '')).toLowerCase().includes(q));
  const f = (v,l) => `<button data-filter="${v}" aria-pressed="${S.filter===v}">${l}</button>`;
  const C = S._c;
  const sum = S.filter === 'shared' ? `Shared spending ${m(C.shared)}` : S.filter === 'personal' ? `Personal spending ${m(C.personal)}` : `Spent ${m(C.total)}`;
  const body = list.length ? groupDays(list) : `<div class="state-msg"><p>Nothing matches ${S.q ? 'this search' : 'this filter'}.</p><button class="btn ghost" data-clear>Show all</button></div>`;
  return `<header class="top"><div><h1>Ledger</h1><div class="sub num">${D.cycle.label} cycle, ${sum}</div></div></header>
    <div class="filters"><div class="seg" role="group" aria-label="Show">${f('all','All')}${f('personal','Personal')}${f('shared','Shared')}</div>
    <label class="search">${ic('search','s')}<span class="sr">Search</span><input id="q" type="search" placeholder="Search" value="${S.q.replace(/"/g,'&quot;')}"></label></div>
    ${updating()}
    ${isDesk() ? `<div class="grid-t"><div class="col">${listState('Transactions', 'No transactions yet this cycle.', body)}</div><aside class="col side">${splitPanel(C)}${sharedCard(C)}</aside></div>` : listState('Transactions', 'No transactions yet this cycle.', body)}`;
}

function budgetRows(C){
  return `<div class="bhead"><span>Category</span><span>Spent</span><span>Left</span></div>` + EXP.map(c => {
    const s = C.spent[c.id], b = c.budget_minor, d = b - s;
    const pill = d < 0 ? `<span class="pill over">${m(-d,{whole:1})} over</span>` : d === 0 ? `<span class="pill even">Used up</span>` : `<span class="pill left">${m(d,{whole:1})}</span>`;
    const w = Math.min(100, s*100/b);
    return `<div style="border-top:1px solid var(--rule)"><button class="brow" data-cat="${c.id}" ${S.cat===c.id?'aria-current="true"':''} aria-label="${c.name}, ${m(s,{whole:1})} of ${m(b,{whole:1})}">
      <span class="c">${c.name}</span><span class="s">${m(s,{whole:1})}<small>of ${m(b,{whole:1})}</small></span><span class="p">${pill}</span>
      <span class="bar"><i class="${d<0?'o':''}" style="width:${w}%"></i></span></button></div>`;
  }).join('');
}
function budget(){
  const tx = S.view === 'empty' ? [] : S.tx;
  const C = calc(tx);
  const c = CAT[S.cat], s = C.spent[c.id], b = c.budget_minor, over = s - b;
  const cur = catCum(tx, c.id, D.cycle.start, D.cycle.days_total);
  const last = catCum(D.last_cycle_transactions, c.id, D.last_cycle.start, D.cycle.days_total);
  const lastTotal = C.lastSpent[c.id];
  const scale = Math.max(s, b);
  const meter = over > 0
    ? `<div class="meter"><i style="width:${b*100/scale}%"></i><i class="o" style="left:${b*100/scale}%;width:${over*100/scale}%"></i><b style="left:calc(${b*100/scale}% - 1px)"></b></div>`
    : `<div class="meter"><i style="width:${s*100/scale}%;border-radius:7px"></i><b style="left:calc(100% - 1px)"></b></div>`;
  const status = over > 0 ? `<span class="overline"><span class="serif num">${m(over)}</span> over</span>` : `<span class="pill left" style="font-size:15px;padding:6px 12px">${m(-over)} left</span>`;
  const list = tx.filter(t => t.category === c.id).sort((a,b) => a.date < b.date ? 1 : -1);
  S._c = C;
  const lastDiff = s - lastTotal;
  const detail = `<div class="figure-wrap">
      <div class="hero figure" style="margin:4px 0 6px;font-size:${isDesk()?64:52}px">${heroMoney(s)}</div>
      <div style="color:var(--ink-2);font-size:15px">of ${m(b,{whole:1})} budget, ${D.cycle.days_left} days to payday</div>
      ${meter}
      <div style="margin-top:12px">${status}</div>
    </div>
    <div class="section"><h2>Pace ${updating()}</h2><div class="panel" style="padding:14px 16px 12px">${S.view==='loading'?skel(3):S.view==='error'?errBox('Pace'):S.view==='empty'?'<p class="lead" style="margin:6px 0">Nothing spent here yet this cycle.</p>':paceChart(cur, last, b, C.todayIdx, {h:140, label:`${c.name} through the cycle against ${D.last_cycle.label}`})}</div></div>
    <div class="section"><h2>Against ${D.last_cycle.label}</h2><div class="panel">
      <div class="lrow" style="grid-template-columns:1fr auto"><div class="t">${D.cycle.label} so far</div><div class="amt">${m(s)}</div></div>
      <div class="lrow" style="grid-template-columns:1fr auto"><div class="t">${D.last_cycle.label}, whole cycle</div><div class="amt muted">${m(lastTotal)}</div></div>
      <div class="lrow total" style="grid-template-columns:1fr auto"><div class="t">Difference</div><div class="amt"><span class="dbl">${m(lastDiff,{sign:1})}</span></div></div>
    </div></div>
    <div class="section"><h2>This cycle <small>${list.length} transactions</small></h2>${listState(c.name, `No ${c.name.toLowerCase()} yet this cycle.`, `<div class="panel">${list.map(txRow).join('')}</div>`)}</div>`;
  const all = `<div class="section"><h2>All budgets <small class="num">${m(C.total,{whole:1})} of ${m(C.budget,{whole:1})}</small></h2><div class="panel">${S.view==='loading'?skel(6):S.view==='error'?errBox('Budgets'):budgetRows(C)}</div></div>`;
  const back = S.back ? `<button class="back" data-go="${S.back}" aria-label="Back">${ic('back')}</button>` : '';
  if (isDesk()) return `<header class="top"><div><h1>Budgets</h1><div class="sub">${D.cycle.label} cycle, ${D.cycle.days_left} days to payday</div></div></header>
    <div class="grid-b"><div class="col">${all}</div><div class="col"><div style="display:flex;align-items:center;gap:6px;margin:-6px 0 4px">${S.back ? `<button class="iconbtn" data-go="${S.back}" aria-label="Back" style="margin-left:-12px">${ic('back')}</button>` : ''}<h2 class="serif" style="font-weight:500;font-size:22px;margin:0">${c.name}</h2></div>${detail}</div></div>`;
  return `<header class="top center">${back}<h1>${c.name}</h1><button class="iconbtn" style="position:absolute;right:-8px;font-size:14px;width:auto;padding:0 8px;color:var(--personal-text)" data-jump="allb">All budgets</button></header>${detail}<div id="allb">${all}</div>`;
}

function analytics(){
  const tx = S.view === 'empty' ? [] : S.tx;
  const C = calc(tx);
  const rows = EXP.map(c => ({c, s:C.spent[c.id], sh:C.spentShared[c.id], l:C.lastSpent[c.id]})).filter(r => r.s || r.l).sort((a,b) => b.s - a.s);
  const max = Math.max(...rows.map(r => Math.max(r.s, r.l)), 1);
  const diff = C.total - C.lastTotal;
  const top = rows.slice().sort((a,b) => (b.s-b.l) - (a.s-a.l))[0];
  const answer = S.view === 'empty' ? `<p class="answer"><span class="hl num">${m(0,{whole:1})}</span> so far. ${D.last_cycle.label} came to ${m(C.lastTotal,{whole:1})} in all.</p>` :
    `<p class="answer"><span class="hl num">${m(C.total,{whole:1})}</span> so far, ${m(Math.abs(diff),{whole:1})} ${diff>=0?'more':'less'} than all of ${D.last_cycle.label}.</p>
     <p class="lead">Home takes the most. The biggest change is ${top.c.name}, up ${m(top.s-top.l,{whole:1})} on ${D.last_cycle.label}.</p>`;
  const bars = rows.map(r => {
    const d = r.s - r.l;
    return `<div class="cbar"><span class="c">${r.c.name}</span>
      <span class="track" aria-hidden="true"><i class="p" style="left:0;width:${(r.s-r.sh)*100/max}%"></i><i class="s" style="left:${(r.s-r.sh)*100/max}%;width:${r.sh*100/max}%"></i><b style="left:${r.l*100/max}%"></b></span>
      <span class="nums"><span class="a">${m(r.s,{whole:1})}</span><span class="${d>0?'up':d<0?'dn':''}">${d===0?'Same as '+D.last_cycle.label:m(d,{whole:1,sign:1})+' vs '+D.last_cycle.label.slice(0,3)}</span></span></div>`;
  }).join('');
  const chart = `<div class="panel" style="padding:8px 16px" role="list" aria-label="Spending by category against ${D.last_cycle.label}">${bars}</div>
    <div class="legend"><span><i class="sw"></i>Personal</span><span><i class="sw s"></i>Shared</span><span><i class="tick"></i>${D.last_cycle.label}</span></div>`;
  return `<header class="top"><div><h1>Where it went</h1><div class="sub">${D.cycle.label} cycle against ${D.last_cycle.label}</div></div></header>
    ${answer} ${updating()}
    <div class="section" style="margin-top:16px">${listState('Spending', 'Each category shows here after your first transaction.', chart)}</div>`;
}

/* ---------- add: amount, category, name, saved ---------- */
function newAdd(){ return {step:'amount', digits:'', cat:null, name:'', kind:'expense', shared:false, date:D.today, note:'', more:false}; }
function addMinor(a){
  if (!a.digits) return 0;
  const [i, f=''] = a.digits.split('.');
  return parseInt(i || '0', 10) * 100 + parseInt((f + '00').slice(0,2), 10);
}
function typedAmount(a){
  const [i, f] = a.digits.split('.');
  const parts = F0.formatToParts(parseInt(i || '0', 10));
  let out = '', cur = '';
  parts.forEach(p => { if (p.type === 'currency') cur = p.value; else if (p.type !== 'literal') out += p.value; });
  const dec = F2.formatToParts(1.5).find(p => p.type === 'decimal').value;
  if (f !== undefined) out += dec + f;
  return {out, cur};
}
function add(){
  const a = S.add;
  const minor = addMinor(a);
  const catName = a.cat ? CAT[a.cat].name : 'Category';
  const step = (id, label, done) => `<button class="${a.step===id?'cur':done?'':'todo'}" data-step="${id}" ${!done && a.step!==id ? 'disabled' : ''}>${label}</button>`;
  const entry = `<div class="entry" aria-label="New entry">
    ${step('amount', minor ? m(minor) : 'Amount', !!minor)}<span class="sep">,</span>
    ${step('category', catName, !!a.cat)}<span class="sep">,</span>
    ${step('name', a.name || 'Name', !!a.name)}</div>`;
  const offRow = `<div class="off">
    <button data-more aria-expanded="${a.more}">${ic('cal','s')}${a.date===D.today?'Today':dayLabel(a.date)}</button>
    <button data-toggle="shared" aria-pressed="${a.shared}">${ic('shared','s')}${a.shared?'Shared with '+D.partner:'Personal'}</button>
    <button class="inc" data-toggle="kind" aria-pressed="${a.kind==='income'}">${a.kind==='income'?'Income':'Expense'}</button>
    <button data-more aria-expanded="${a.more}">${ic('noteI','s')}${a.note?'Note added':'Note'}</button></div>`;
  const more = a.more ? `<div class="more">
    <div class="r"><span>Date</span><span class="seg">${[0,1,2].map(n => { const d = new Date(dt(D.today) - n*864e5); const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; return `<button data-date="${iso}" aria-pressed="${a.date===iso}">${dayLabel(iso)}</button>`; }).join('')}</span></div>
    <div class="r"><label for="note">Note</label><input id="note" value="${a.note.replace(/"/g,'&quot;')}" placeholder="Note"></div></div>` : '';
  let body = '';
  if (a.step === 'amount'){
    const t = typedAmount(a);
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'];
    const dec = F2.formatToParts(1.5).find(p => p.type === 'decimal').value;
    body = `<div class="amount-read ${a.digits?'':'empty'}" role="status" aria-live="polite" aria-label="Amount ${minor?m(minor):'empty'}">${t.out}<span class="caret"></span><span class="cur">${t.cur}</span></div>
      <div style="text-align:center;font-size:13.5px;color:var(--ink-3)" class="num">${m(calc(S.tx).left)} left this cycle</div>
      ${offRow}${more}
      <div class="keypad" role="group" aria-label="Amount keypad">${keys.map(k => `<button data-key="${k}" aria-label="${k==='del'?'Delete':k==='.'?'Decimal':k}">${k==='del'?ic('del'):k==='.'?dec:k}</button>`).join('')}</div>
      <button class="next" data-step="category" ${minor?'':'disabled'}>Next</button>`;
  } else if (a.step === 'category'){
    const C = calc(S.tx);
    const recent = D.suggestions.last_used_categories;
    const list = a.kind === 'income' ? D.categories.filter(c => c.kind === 'income') : EXP;
    const row = c => `<button class="cat" data-pick="${c.id}"><span>${c.name}</span><small class="num">${!c.budget_minor ? '' : c.budget_minor === C.spent[c.id] ? 'Used up' : m(Math.abs(c.budget_minor - C.spent[c.id]),{whole:1}) + (c.budget_minor < C.spent[c.id] ? ' over' : ' left')}</small></button>`;
    body = a.kind === 'income' ? `<div class="cats">${list.map(row).join('')}</div>` :
      `<div class="cats"><h3>Recent</h3>${recent.map(id => row(CAT[id])).join('')}<h3>All</h3>${list.filter(c => !recent.includes(c.id)).map(row).join('')}</div>`;
    body = offRow + more + body;
  } else if (a.step === 'name'){
    const sug = (D.suggestions.name_suggestions[a.cat] || topNames(a.cat)).slice(0,4);
    body = `<div class="namefield"><label for="nm">Name</label><input id="nm" autocomplete="off" enterkeyhint="done" value="${a.name.replace(/"/g,'&quot;')}" placeholder="Shop or person"></div>
      ${sug.length ? `<div class="sugg"><span>Suggested</span>${sug.map(n => `<button data-name="${n}">${n}</button>`).join('')}</div>` : ''}
      <div style="flex:1"></div>${offRow}${more}
      <button class="next" data-save ${a.name.trim()?'':'disabled'}>Save</button>`;
  } else {
    body = `<div class="saved" role="status"><div class="tick">${ic('check')}</div><p class="num">Saved ${m(minor)}</p><small>${catName}, ${a.name}${a.shared?', shared with '+D.partner:''}</small></div>`;
  }
  return `<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="Add a transaction"><div class="sheet" tabindex="-1" style="outline:none">
    <button class="closex" data-close aria-label="Close">${ic('close')}</button>
    <div style="font-weight:600;font-size:17px;padding:10px 0 0">${a.kind==='income'?'New income':'New expense'}</div>
    ${a.step!=='saved'?entry:''}
    ${body}</div></div>`;
}
function topNames(cat){
  const n = {}; S.tx.forEach(t => { if (t.category === cat) n[t.name] = (n[t.name]||0) + 1; });
  return Object.keys(n).sort((a,b) => n[b]-n[a]);
}
function saveAdd(){
  const a = S.add;
  const t = {id:'n'+Date.now(), date:a.date, amount_minor:addMinor(a), kind:a.kind, category:a.cat, name:a.name.trim(), shared:a.shared, paid_by:'me', note:a.note||undefined};
  S.tx.unshift(t); S.newId = t.id; a.step = 'saved'; render();
  setTimeout(() => { if (S.screen === 'add'){ S.screen = S.base; S.add = null; render(); post(); } }, 1500);
}

/* ---------- render ---------- */
function render(){
  applyTheme();
  const ch = chrome();
  const view = {home, transactions, budget, analytics}[S.base] || home;
  document.getElementById('root').innerHTML = `<div class="app">${ch.rail}<main class="main" id="main">${view()}</main>${ch.bar}</div>${S.screen==='add'?add():''}${protoSwitch()}`;
  if (S.focus){ const el = document.getElementById(S.focus); if (el){ el.focus(); const v = el.value; el.setSelectionRange && el.setSelectionRange(v.length, v.length); } S.focus = null; }
  else if (S.screen === 'add' && S.add.step === 'name'){ const el = document.getElementById('nm'); el && el.focus(); }
  else if (S.screen === 'add' && S.add.step === 'amount'){ const k = document.querySelector('.sheet'); k && k.focus({preventScroll:true}); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.themeToggle !== undefined){ S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); return; }
  if (d.view){ S.view = d.view; render(); return; }
  if (S.screen === 'add'){
    const a = S.add;
    if (d.close !== undefined){ S.screen = S.base; S.add = null; render(); post(); return; }
    if (d.key){
      let s = a.digits;
      if (d.key === 'del') s = s.slice(0,-1);
      else if (d.key === '.'){ if (!s.includes('.')) s = (s || '0') + '.'; }
      else if (!(s.includes('.') && s.split('.')[1].length >= 2) && s.replace('.','').length < 8) s = (s === '0' ? '' : s) + d.key;
      a.digits = s; render(); return;
    }
    if (d.step){ if (d.step === 'category' && !addMinor(a)) return; a.step = d.step; render(); return; }
    if (d.pick){ a.cat = d.pick; a.step = 'name'; render(); return; }
    if (d.name){ a.name = d.name; render(); document.querySelector('[data-save]').focus(); return; }
    if (d.more !== undefined){ a.more = !a.more; render(); return; }
    if (d.date){ a.date = d.date; render(); return; }
    if (d.toggle === 'shared'){ a.shared = !a.shared; render(); return; }
    if (d.toggle === 'kind'){ a.kind = a.kind === 'income' ? 'expense' : 'income'; a.cat = null; if (a.step === 'name') a.step = 'category'; render(); return; }
    if (d.save !== undefined){ if (a.name.trim()) saveAdd(); return; }
    return;
  }
  if (d.jump){ document.getElementById(d.jump).scrollIntoView({behavior:'smooth'}); return; }
  if (d.clear !== undefined){ S.q = ''; S.filter = 'all'; render(); return; }
  if (d.open){ S.open = S.open === d.open ? null : d.open; render(); return; }
  if (d.go){ if (d.filter) S.filter = d.filter; go(d.go, {cat:d.cat, back:d.back}); return; }
  if (d.filter){ S.filter = d.filter; render(); return; }
  if (d.cat){ S.cat = d.cat; render(); window.scrollTo({top:0}); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.q = e.target.value; S.focus = 'q'; render(); }
  if (e.target.id === 'nm' && S.add){ S.add.name = e.target.value; const s = document.querySelector('[data-save]'); if (s) s.disabled = !S.add.name.trim(); const n = document.querySelector('[data-step="name"]'); if (n){ n.textContent = S.add.name || 'Name'; } }
  if (e.target.id === 'note' && S.add){ S.add.note = e.target.value; }
});
document.addEventListener('keydown', e => {
  if (S.screen !== 'add') return;
  if (e.key === 'Escape'){ S.screen = S.base; S.add = null; render(); post(); return; }
  if (S.add.step === 'amount' && !e.metaKey && !e.ctrlKey){
    const k = /^[0-9]$/.test(e.key) ? e.key : (e.key === '.' || e.key === ',') ? '.' : e.key === 'Backspace' ? 'del' : null;
    if (k){ e.preventDefault(); document.querySelector(`[data-key="${k}"]`).click(); }
    if (e.key === 'Enter' && addMinor(S.add)){ e.preventDefault(); S.add.step = 'category'; render(); }
  }
  if (S.add.step === 'name' && e.key === 'Enter' && S.add.name.trim()){ e.preventDefault(); saveAdd(); }
  if (e.key === 'Tab'){ // keep focus inside the dialog
    const f = [...document.querySelectorAll('.sheet button:not([disabled]), .sheet input')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});
let lastDesk = isDesk();
window.addEventListener('resize', () => { if (isDesk() !== lastDesk){ lastDesk = isDesk(); render(); } });

// self-check: totals from the data must match the data's own summary
const C0 = calc(D.transactions);
console.assert(C0.total === D.summary.spent_minor && C0.budget === D.summary.budget_total_minor && C0.shared === D.summary.shared.shared_spending_minor, 'totals drift from summary');
console.assert(addMinor({digits:'45.5'}) === 4550 && addMinor({digits:'0.05'}) === 5 && addMinor({digits:'120'}) === 12000, 'amount parse');

if (S.screen === 'add') S.add = newAdd();
render(); post();
})();
</script>
</body>
</html>
