<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cashflow Night Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Colour rule: amber is the instrument light and always means money still left; red means past the line (over budget);
   green is money in; ice blue, the cluster's second light, is the shared account with Anna. Readings are warm white (dark) or ink (light); the rest is night blue. */
:root{
  --ground:#E1E5EE; --surface:#F1F3F8; --raised:#FFFFFF; --line:#C9CEDC; --line-2:#DDE1EA;
  --ink:#10152A; --ink-2:#4A5068; --ink-3:#656B83;
  --amber:#F2A12E; --amber-ink:#1A1405; --amber-text:#9A5500; --amber-bg:#FCEBD0; --amber-line:#EFC98A;
  --over:#B8321E; --over-bg:#F8DDD6; --over-line:#EDB5A8;
  --in:#127349; --shared:#0A6496; --shared-card:#0F4C6E; --shared-ink:#FFFFFF; --shared-dim:rgba(255,255,255,.74); --anna:#8FD3FF;
  --dial-track:#DCE0EA; --dial-used:#BBC2D3; --knob:#10152A; --tick:#9AA0B5; --meter:#10152A;
  --panel:#FFFFFF; --skel:#DCE0EA; --scrim:rgba(16,21,42,.45); --focus:#0A6496;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ground:#0E1324; --surface:#151B30; --raised:#1A2139; --line:#2C3557; --line-2:#232B48;
  --ink:#F3F1EA; --ink-2:#AEB3C8; --ink-3:#9197B0;
  --amber:#FFB547; --amber-ink:#1A1405; --amber-text:#FFC266; --amber-bg:rgba(255,181,71,.13); --amber-line:rgba(255,181,71,.35);
  --over:#FF7D66; --over-bg:rgba(255,125,102,.12); --over-line:rgba(255,125,102,.35);
  --in:#63D9A6; --shared:#7DCBFF; --shared-card:#123A55; --shared-ink:#EEF8FF; --shared-dim:rgba(238,248,255,.72); --anna:#7DCBFF;
  --dial-track:#1D2443; --dial-used:#343E6A; --knob:#F3F1EA; --tick:#59618A; --meter:#C9CCDA;
  --panel:#141A30; --skel:#232B48; --scrim:rgba(0,0,0,.6); --focus:#7DCBFF;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:15.5px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:16px;height:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{height:100%;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;padding:47px 16px 24px}
.wrap{max-width:640px;margin:0 auto}

.hd{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:10px}
.hd h1{font-size:17px;font-weight:600;flex:1;text-align:center}
.hd .side{width:76px;display:flex}
.hd .side.r{justify-content:flex-end}
.back{display:flex;align-items:center;gap:2px;min-height:44px;padding-right:8px;color:var(--ink-2)}
.cyc{font-size:13.5px;color:var(--ink-2)}

.tabs{display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--line-2);padding:6px 10px 34px;gap:2px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;color:var(--ink-3);min-height:48px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ico{color:var(--amber-text)}
.addkey{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 16px;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-weight:650;font-size:15.5px}
.addkey:active{transform:translateY(1px)}
.top{display:none}
@media (min-width:900px){
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;padding:0 32px;background:var(--panel);border-bottom:1px solid var(--line-2)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:18px}
  .tnav{display:flex;gap:2px;background:var(--ground);padding:4px;border-radius:12px}
  .tnav button{padding:8px 16px;border-radius:9px;color:var(--ink-2);font-weight:550}
  .tnav button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .topr{display:flex;justify-content:flex-end;align-items:center;gap:20px}
  .main{padding:28px 32px 48px}
  .wrap{max-width:1180px}
  .tabs{display:none}
  .hd.ph{display:none}
}

/* the dial */
.dialcard{background:var(--panel);border-radius:28px;padding:16px 14px 18px;box-shadow:0 0 0 1px var(--line-2)}
.dialtop{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 0;font-size:14px;color:var(--ink-2)}
.dialtop b{color:var(--ink);font-weight:650;font-size:16px}
.dialbox{position:relative;max-width:380px;margin:0 auto;touch-action:none;cursor:grab;border-radius:50%}
.dialbox svg{width:100%;height:auto;display:block}
.dialbox .trk{fill:none;stroke:var(--dial-track)}
.dialbox .used{fill:none;stroke:var(--dial-used)}
.dialbox .left{fill:none;stroke:var(--amber)}
.dialbox .ov{fill:none;stroke:var(--over)}
.dialbox .tk{stroke:var(--tick);stroke-width:1.5;stroke-linecap:round}
.dialbox .tk.red{stroke:var(--over)}
.dialbox .now{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.dialbox text{font-family:inherit;font-size:14px;fill:var(--ink-2);font-weight:500}
.dialbox text.b{fill:var(--ink);font-weight:650}
.dialbox .knob{fill:var(--panel);stroke:var(--knob);stroke-width:3.5}
.dialc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dialc .l{font-size:14px;color:var(--ink-2);font-weight:500}
.dialc .v{font-weight:550;font-size:58px;line-height:1;letter-spacing:-.02em;margin:4px 0 6px;white-space:nowrap}
.dialc .v small{font-size:22px;font-weight:500;margin-left:3px;letter-spacing:0;color:var(--ink-2)}
.dialc .d{font-size:15px;font-weight:600;color:var(--amber-text)}
.dialc .d2{font-size:13px;color:var(--ink-2);margin-top:2px}
.dialfoot{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:10px;background:var(--line-2);border-radius:14px;overflow:hidden}
.dialfoot>div{background:var(--panel);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.dialfoot b{display:block;font-size:18px;color:var(--ink);font-weight:620}
.dialfoot b.am{color:var(--amber-text)}
.hint{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.upd{display:inline-block;font-size:12px;font-weight:600;background:var(--amber-bg);color:var(--amber-text);padding:2px 8px;border-radius:6px}

.sec{margin-top:22px}
.sec h2{font-size:16px;font-weight:620;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 .a{font-size:13.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;min-height:32px}
.card{background:var(--panel);border-radius:18px;padding:2px 14px;box-shadow:0 0 0 1px var(--line-2)}

/* over budget: the biggest leads, the rest are quiet rows */
.over{background:var(--panel);border-radius:18px;box-shadow:0 0 0 1px var(--line-2);overflow:hidden}
.over .lead{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px;background:var(--over-bg);box-shadow:inset 0 -1px 0 var(--over-line)}
.over .lead .mini{width:48px;height:48px}
.over .lead .n{display:block;font-weight:620;font-size:17px}
.over .lead .of{font-size:13px;color:var(--ink-2)}
.over .lead .v{text-align:right;color:var(--over);font-weight:650;font-size:20px}
.over .lead .v small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.qrow{display:grid;grid-template-columns:22px 1fr auto 16px;gap:10px;align-items:center;width:100%;padding:0 14px;min-height:46px;border-top:1px solid var(--line-2);font-size:14.5px;color:var(--ink-2)}
.qrow:first-of-type{border-top:0}
.qrow .ic{color:var(--ink-3);display:grid}
.qrow .v{color:var(--over);font-weight:600}
.lamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.lamp{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:var(--over-bg);box-shadow:inset 0 0 0 1px var(--over-line);color:var(--ink);min-height:104px}
.lamp .ico{color:var(--over)}
.lamp .n{font-weight:600;font-size:14.5px}
.lamp .v{font-weight:650;color:var(--over);font-size:16px;margin-top:auto}
.lamp .v small{font-weight:500;font-size:12.5px;color:var(--ink-2);margin-left:3px}

/* shared account card */
.joint{background:var(--shared-card);color:var(--shared-ink);border-radius:22px;padding:16px 16px 14px}
.joint .head{display:flex;align-items:center;gap:10px}
.avs{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;border:2px solid var(--shared-card)}
.av.me{background:#F3F1EA;color:#10152A}
.av.an{background:var(--anna);color:#0B2233;margin-left:-9px}
.joint .tt{flex:1;font-weight:600;font-size:15.5px}
.joint .bal{font-size:40px;font-weight:550;letter-spacing:-.015em;line-height:1;margin:16px 0 2px}
.joint .bal small{font-size:18px;font-weight:500;margin-left:3px;color:var(--shared-dim)}
.joint .bl{font-size:13.5px;color:var(--shared-dim)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:3px;margin-top:14px}
.split i{background:var(--shared-ink)}
.split i+i{background:var(--anna)}
.splitl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--shared-dim);margin:6px 0 6px}
.joint .kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.18);font-size:14px}
.joint .kv span:first-child{color:var(--shared-dim)}
.joint .kv .v{font-weight:620}
.joint .moved{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--shared-dim);padding-top:10px;border-top:1px solid rgba(255,255,255,.18)}

/* rows, Linear-calm */
.tx{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;width:100%;padding:11px 0;border-top:1px solid var(--line-2);min-height:58px}
.tx:first-child{border-top:0}
.mk{display:grid;place-items:center;color:var(--ink-2)}
.mk.sh{color:var(--shared)}
.tx .nm{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .sub{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:3px;font-weight:560;padding:1px 6px 1px 4px;border-radius:6px}
.tag.sh{color:var(--shared);background:color-mix(in srgb,var(--shared) 14%,transparent)}
.tag.ps{color:var(--ink-2)}
.tx .amt{text-align:right;font-weight:600;white-space:nowrap}
.tx .amt small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.amt.in{color:var(--in)}
.amt.mv{color:var(--ink-2);font-weight:500}
.tx[aria-pressed="true"]{background:var(--surface);margin:0 -10px;padding:11px 10px;width:calc(100% + 20px);border-radius:12px;box-shadow:inset 3px 0 0 var(--amber)}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 6px;font-weight:650;font-size:15px}
.day .dt{font-size:13px;font-weight:500;color:var(--ink-2)}
.day .dt b{color:var(--ink);font-weight:620;font-size:14.5px}
.daylist{background:var(--panel);border-radius:18px;padding:2px 14px;box-shadow:0 0 0 1px var(--line-2)}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 180px;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:0 12px;height:42px;color:var(--ink-3);box-shadow:0 0 0 1px var(--line-2)}
.search input{border:0;background:none;outline:none;flex:1;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink-3)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;box-shadow:0 0 0 1px var(--line-2)}
.seg button{padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:560;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.strip{display:grid;grid-template-columns:1fr 1fr 1.25fr;margin:12px 0 0;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line-2)}
.strip>div{display:flex;gap:7px;align-items:flex-start;padding:10px;font-size:12.5px;color:var(--ink-2)}
.strip>div+div{border-left:1px solid var(--line-2)}
.strip .ico{margin-top:1px}
.strip b{display:block;font-size:16px;color:var(--ink);font-weight:620;margin-top:1px}
.strip .sh,.strip .sh b{color:var(--shared)}

/* budgets */
.brow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line-2);min-height:62px}
.brow:first-child{border-top:0}
.brow .nm{font-weight:580}
.brow .of{font-size:13px;color:var(--ink-2)}
.brow[aria-current="true"]{background:var(--surface);margin:0 -10px;padding:10px;width:calc(100% + 20px);border-radius:12px}
.mini{width:40px;height:40px;display:block}
.mini .trk{fill:none;stroke:var(--dial-track)}
.mini .used{fill:none;stroke:var(--dial-used)}
.mini .left{fill:none;stroke:var(--amber)}
.mini .ov{fill:none;stroke:var(--over)}
.pill{display:inline-block;min-width:96px;text-align:right;padding:6px 10px;border-radius:10px;font-weight:650;font-size:14px;background:var(--amber-bg);color:var(--amber-text)}
.pill small{font-weight:500;font-size:12px;margin-left:3px}
.pill.o{background:var(--over-bg);color:var(--over)}
.pill.z{background:var(--surface);color:var(--ink-2)}
.thead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);padding:12px 0 6px}
.tfoot{display:flex;justify-content:space-between;padding:12px 2px 4px;font-weight:620}

.cathead{display:grid;grid-template-columns:1fr;justify-items:center}
.ringwrap{position:relative;width:100%;max-width:330px}
.ringwrap svg{width:100%;height:auto;display:block}
.ringwrap .trk{fill:none;stroke:var(--dial-track)}
.ringwrap .used{fill:none;stroke:var(--dial-used)}
.ringwrap .left{fill:none;stroke:var(--amber)}
.ringwrap .ov{fill:none;stroke:var(--over)}
.ringwrap .tk{stroke:var(--tick);stroke-width:1.5;stroke-linecap:round}
.ringwrap .tk.red{stroke:var(--over);stroke-width:2.2}
.ringwrap text{font-family:inherit;font-size:12px;fill:var(--ink-2);font-weight:500}
.ringwrap .dialc .v{font-size:50px}
.stateline{margin-top:6px;font-weight:650;font-size:16px;text-align:center}
.stateline.o{color:var(--over)}
.stateline.a{color:var(--amber-text)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2);margin-top:14px}
.cmp>div{background:var(--panel);padding:11px 14px}
.cmp .l{font-size:13px;color:var(--ink-2)}
.cmp .v{font-weight:620;font-size:18px;margin-top:2px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .bud{stroke:var(--over);stroke-width:1.2;opacity:.8}
.chart .last{fill:none;stroke:var(--ink-3);stroke-width:1.6;opacity:.75}
.chart .cur{fill:none;stroke:var(--ink);stroke-width:2.4}
.chart .cur.o{stroke:var(--ink)}
.chart text{font-family:inherit;font-size:11.5px;fill:var(--ink-2)}
.chart .tl{font-weight:650;fill:var(--ink)}
.chart .tl.o{fill:var(--over)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:16px;height:3px;background:var(--ink);vertical-align:middle;margin-right:6px}
.legend i.l{background:var(--ink-3);height:2px}

/* analytics: change first */
.ahead{margin:2px 0 4px}
.ahead .l{font-size:14px;color:var(--ink-2)}
.ahead .big{font-weight:550;font-size:64px;line-height:1;letter-spacing:-.02em;margin:4px 0}
.ahead .big small{font-size:24px;margin-left:3px;color:var(--ink-2);letter-spacing:0;font-weight:500}
.ahead p{font-size:15.5px;color:var(--ink-2);max-width:560px}
.ahead p b{color:var(--ink);font-weight:620}
.drow{display:grid;grid-template-columns:104px 1fr 1fr 92px;gap:0 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2);width:100%;min-height:48px}
.drow .nm{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .neg,.drow .pos{position:relative;height:20px}
.drow .neg{border-right:1.5px solid var(--ink-3)}
.drow .neg i{position:absolute;right:0;top:3px;bottom:3px;background:var(--dial-used);border-radius:3px 0 0 3px}
.drow .pos i{position:absolute;left:0;top:3px;bottom:3px;background:var(--amber);border-radius:0 3px 3px 0}
.drow .pos span,.drow .neg span{position:absolute;top:1px;font-size:12.5px;font-weight:620;white-space:nowrap}
.drow .v{text-align:right;font-weight:600}
.drow .v small{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.dhd{display:grid;grid-template-columns:104px 1fr 1fr 92px;gap:0 10px;font-size:12.5px;color:var(--ink-2);padding:12px 0 6px}
.dhd span:nth-child(2){text-align:right;padding-right:6px}
.dhd span:nth-child(3){padding-left:6px}
.dhd span:last-child{text-align:right}
@media (max-width:899px){
  .drow,.dhd{grid-template-columns:84px 1fr 1fr 78px}
  .ahead .big{font-size:56px}
}

.sk{background:var(--skel);border-radius:6px;height:12px}
.skrow{display:grid;grid-template-columns:24px 1fr 70px;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.skrow:first-child{border-top:0}
.empty,.err{padding:22px 16px;text-align:center;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line-2)}
.empty p,.err p{color:var(--ink-2);margin-bottom:12px;font-size:14.5px}
.empty p b,.err p b{display:block;color:var(--ink);font-size:16px;font-weight:620;margin-bottom:3px}
.err{background:var(--over-bg);box-shadow:inset 0 0 0 1px var(--over-line);text-align:left;display:flex;gap:12px;align-items:flex-start}
.err .ico{color:var(--over);margin-top:2px}
.err div{flex:1}
.err p{margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-weight:650}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{background:var(--line-2);color:var(--ink-3);cursor:default}

.hgrid{display:grid;gap:22px}
@media (min-width:900px){
  .hgrid{grid-template-columns:500px 1fr;align-items:start;gap:28px}
  .hgrid .sec:first-child{margin-top:0}
  .dialcard{padding:22px 22px 22px}
  .dialbox{max-width:420px}
  .dialc .v{font-size:72px}
  .split2{display:grid;grid-template-columns:420px 1fr;gap:40px;align-items:start}
  .tsplit{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start}
  .pane{position:sticky;top:0}
  .dtitle{font-size:28px;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
  .catcols{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
}
.pane .card{padding:18px}

.det .amt{font-size:52px;font-weight:550;line-height:1;letter-spacing:-.02em}
.det .amt.in{color:var(--in)}
.det .amt.mv{color:var(--ink-2)}
.det .nm{font-size:19px;font-weight:620;margin:10px 0 2px}

<body>
<div id="app" class="app"></div>
<script src="../../data/cashflow-fake.js"></script>
<script>
(function(){
const D = window.CASHFLOW_DATA;
const LOC = D.locale, CUR = D.currency;
const F2 = new Intl.NumberFormat(LOC,{style:'currency',currency:CUR});
const F0 = new Intl.NumberFormat(LOC,{style:'currency',currency:CUR,maximumFractionDigits:0,minimumFractionDigits:0});
const FS = new Intl.NumberFormat(LOC,{style:'currency',currency:CUR,signDisplay:'exceptZero',maximumFractionDigits:0,minimumFractionDigits:0});
const FS2 = new Intl.NumberFormat(LOC,{style:'currency',currency:CUR,signDisplay:'exceptZero'});
const PCT = new Intl.NumberFormat(LOC,{style:'percent',maximumFractionDigits:0});
const minus = s => s.replace(/-/g,'−');
const m2 = v => minus(F2.format(v/100));
const m0 = v => minus(F0.format(Math.round(v/100)));
const s0 = v => minus(FS.format(Math.round(v/100)));
const s2 = v => minus(FS2.format(v/100));
// hero number split into figure and currency, both from Intl parts
function parts0(v){ const p = F0.formatToParts(Math.round(v/100)); const cur = p.filter(x=>x.type==='currency').map(x=>x.value).join(''); const num = p.filter(x=>x.type!=='currency'&&x.type!=='literal').map(x=>x.value).join(''); return [minus(num),cur]; }

const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const DAY = 864e5;
const TODAY = pd(D.today);
const dIdx = (s, start) => Math.round((pd(s) - pd(start))/DAY);
const DF = new Intl.DateTimeFormat(LOC,{weekday:'short',day:'numeric',month:'short'});
const DM = new Intl.DateTimeFormat(LOC,{day:'numeric',month:'short'});
const DL = new Intl.DateTimeFormat(LOC,{weekday:'long',day:'numeric',month:'long'});
const joinParts = (fmt,d) => fmt.formatToParts(d).filter(p=>p.type!=='literal').map(p=>p.value).join(' ');
function dayName(s){ const n = dIdx(D.today, s); if(n===0) return 'Today'; if(n===1) return 'Yesterday'; return joinParts(DF,pd(s)); }
const dm = d => joinParts(DM,d);
const PR = new Intl.PluralRules(LOC);
const days = n => n + (PR.select(n)==='one' ? ' day' : ' days');

const CATS = D.categories, CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const EXP = CATS.filter(c=>c.kind==='expense');
let TX = D.transactions.slice();
const LAST = D.last_cycle_transactions;
const CYC = D.cycle, START = CYC.start, TOT = CYC.days_total, LEFTD = CYC.days_left, GONE = TOT - LEFTD;
const NEXTPAY = pd(CYC.next_payday);
const RANGE = dm(pd(START)) + ' – ' + dm(new Date(NEXTPAY - DAY));

const FIXED = ['home','bills'];
function calc(list){
  const by = {}; EXP.forEach(c=>by[c.id]=0);
  let spent=0, income=0, myTop=0, anTop=0, shSpent=0, personal=0;
  list.forEach(t=>{
    if(t.kind==='expense'){ by[t.category]=(by[t.category]||0)+t.amount_minor; spent+=t.amount_minor; if(t.shared) shSpent+=t.amount_minor; else personal+=t.amount_minor; }
    else if(t.kind==='income') income+=t.amount_minor;
    else if(t.kind==='topup'){ if(t.paid_by==='me') myTop+=t.amount_minor; else anTop+=t.amount_minor; }
  });
  const budget = EXP.reduce((s,c)=>s+c.budget_minor,0);
  const flex = EXP.filter(c=>!FIXED.includes(c.id)), flexBudget = flex.reduce((s,c)=>s+c.budget_minor,0), flexSpent = flex.reduce((s,c)=>s+by[c.id],0);
  const ratio = (myTop+anTop) ? myTop/(myTop+anTop) : 0;
  return {by,spent,income,budget,left:budget-spent,myTop,anTop,shSpent,personal,ratio,myPart:Math.round(shSpent*ratio),shBal:myTop+anTop-shSpent,
    // pace counts flexible spending only: rent and bills land at the start of the cycle and would read as a false alarm
    flexBudget, flexSpent, fixedBudget: budget-flexBudget, ahead: flexSpent - Math.round(flexBudget*GONE/TOT), perDay: Math.floor((budget-spent)/LEFTD)};
}
function cum(list, start, n, fn){ const a = new Array(n).fill(0); list.forEach(t=>{ if(t.kind==='expense' && (!fn||fn(t))){ const i = dIdx(t.date,start); if(i>=0&&i<n) a[i]+=t.amount_minor; } }); for(let i=1;i<n;i++) a[i]+=a[i-1]; return a; }
const LASTC = calc(LAST);
const LASTN = dIdx(D.last_cycle.end_exclusive, D.last_cycle.start);

// self-checks: numbers match the data's own summary
(function(){ const c = calc(TX), S = D.summary;
  console.assert(c.left === S.budget_total_minor - S.spent_minor, 'left');
  console.assert(c.spent === S.spent_minor && c.myPart === S.shared.my_share_minor && c.shBal === S.shared.shared_balance_minor, 'shared');
  console.assert(amountMinor('45,5')===4550 && amountMinor('1200')===120000 && amountMinor('0,07')===7, 'parse');
})();
function amountMinor(s){ if(!s) return 0; const [a,b='']=s.split(','); return parseInt(a||'0',10)*100 + parseInt((b+'00').slice(0,2),10); }

/* icons: one line family, 24 grid */
const P = {
  basket:'M3.5 9h17l-1.8 10.2a1 1 0 0 1-1 .8H6.3a1 1 0 0 1-1-.8z M8.5 9 11 4.5 M15.5 9 13 4.5 M9.5 13v3.5 M14.5 13v3.5',
  cup:'M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z M16 10h1.5a2.5 2.5 0 0 1 0 5H16 M8.5 3.5v2 M12 3.5v2',
  train:'M7 3.5h10a2 2 0 0 1 2 2V15a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5.5a2 2 0 0 1 2-2z M5 11h14 M8.5 14.5h.01 M15.5 14.5h.01 M8 18l-2 3 M16 18l2 3',
  house:'M4 11 12 4l8 7 M6 9.5V20h12V9.5 M10 20v-5h4v5',
  bolt:'M13 3 5 13.5h6L10 21l8-10.5h-6z',
  bag:'M5 8h14l-1 12H6z M9 8V6.5a3 3 0 0 1 6 0V8',
  ticket:'M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z M14.5 7v10',
  cross:'M9.5 4h5v5.5H20v5h-5.5V20h-5v-5.5H4v-5h5.5z',
  gift:'M4 9h16v4H4z M5.5 13v7h13v-7 M12 9v11 M12 9C10 5 6.5 5 6.5 7.2S10 9 12 9c2 0 5.5.5 5.5-1.8S14 5 12 9',
  'arrow-in':'M12 4v11 M7 10.5l5 5 5-5 M5 20h14',
  person:'M12 11.5a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5z M5 20c1-3.4 3.8-5.4 7-5.4s6 2 7 5.4',
  people:'M9 11a3.4 3.4 0 1 0 0-6.8A3.4 3.4 0 0 0 9 11z M3 20c.8-3.2 3.1-4.9 6-4.9s5.2 1.7 6 4.9 M15.5 4.4a3.4 3.4 0 0 1 0 6.4 M17.5 15.4c1.6.6 2.8 2 3.4 4.6',
  move:'M4 8h14 M14 4l4 4-4 4 M20 16H6 M10 12l-4 4 4 4',
  gauge:'M3.5 17.5a8.5 8.5 0 1 1 17 0 M12 17.5l4.2-5 M12 9v1.2 M6.8 12.2l.9.8 M17.2 12.2l-.9.8',
  list:'M9 6h11 M9 12h11 M9 18h11 M4.5 6h.01 M4.5 12h.01 M4.5 18h.01',
  budgets:'M4 6h9 M4 12h13 M4 18h6 M16 4v4 M16 10v4 M16 16v4',
  chart:'M4 20h16 M7 16v-5 M12 16V6 M17 16v-8',
  plus:'M12 5v14 M5 12h14', back:'M15 5l-7 7 7 7', chev:'M9 5l7 7-7 7',
  search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M16 16l4 4', check:'M5 12.5l4.5 4.5L19 7', close:'M6 6l12 12 M18 6 6 18',
  cal:'M4 6h16v14H4z M4 10h16 M8 3.5v4 M16 3.5v4', note:'M5 4h14v16H5z M8 9h8 M8 13h8 M8 17h5',
  del:'M9 6h11v12H9l-5-6z M12 9.5l5 5 M17 9.5l-5 5', warn:'M12 4 21 20H3z M12 10v4.5 M12 17.5h.01', retry:'M4 12a8 8 0 1 0 2.5-5.8 M4 4v4.5h4.5'
};
const ico = (n,cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* state */
const params = new URLSearchParams(location.search);
const init = window.PROTO || {};
const SCREENS = ['home','add','transactions','budget','analytics'];
const st = {
  screen: SCREENS.includes(init.screen) ? init.screen : (SCREENS.includes(params.get('screen')) ? params.get('screen') : 'home'),
  theme: init.theme || params.get('theme') || 'light',
  stack: [], mode:{home:'content',transactions:'content',budget:'content',analytics:'content'},
  cat:'eating_out', budView:'one', filter:'all', q:'', sel:null, sheet:false, focus:null,
  add:null, addFrom:'home'
};
const isDesk = () => innerWidth >= 900;
function newAdd(){ return {step:'amount', amt:'', kind:'expense', cat:null, name:'', when:0, note:null, shared:false}; }
if(st.screen==='add') st.add = newAdd();

function go(screen, opts={}){
  if(screen===st.screen && !opts.force){ render(); return; }
  if(screen==='add'){ st.addFrom = st.screen==='add' ? st.addFrom : st.screen; st.add = newAdd(); }
  if(!opts.noPush) st.stack.push(st.screen);
  st.screen = screen; st.sheet=false;
  render(true);
  try{ parent.postMessage({type:'at', screen}, '*'); }catch(e){}
}
function back(){ const prev = st.stack.pop() || 'home'; st.screen = prev==='add' ? 'home' : prev; st.sheet=false; render(true); try{ parent.postMessage({type:'at', screen:st.screen}, '*'); }catch(e){} }
addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='go' && SCREENS.includes(d.screen)) go(d.screen,{force:true}); if(d.type==='theme'){ st.theme = d.theme==='dark'?'dark':'light'; render(); } });

/* pieces */
function mark(t){
  if(t.kind==='topup'||t.kind==='transfer') return `<span class="mk">${ico('move')}</span>`;
  const c = CAT[t.category]; return `<span class="mk${t.shared?' sh':''}">${ico(c.mark)}</span>`;
}
function txSub(t,c){
  if(t.kind==='topup') return t.paid_by==='me' ? 'Moved to shared account' : 'Anna to shared account';
  if(t.kind==='transfer') return 'Moved to savings';
  const cn = CAT[t.category].name;
  if(t.kind==='income') return `${cn}`;
  return t.shared ? `${cn} <span class="tag sh">${ico('people','s')}Shared</span>` : `${cn} <span class="tag ps">${ico('person','s')}Personal</span>`;
}
function txAmt(t,c){
  if(t.kind==='income') return `<span class="amt in num">+${m2(t.amount_minor)}</span>`;
  if(t.kind==='topup'||t.kind==='transfer') return `<span class="amt mv num">${m2(t.amount_minor)}<small>moved</small></span>`;
  if(t.shared) return `<span class="amt num">${m2(t.amount_minor)}<small>yours ${m2(Math.round(t.amount_minor*c.ratio))}</small></span>`;
  return `<span class="amt num">${m2(t.amount_minor)}</span>`;
}
function txRow(t,c){
  const pressed = isDesk() && st.screen==='transactions' && st.sel===t.id;
  return `<button class="tx" data-act="tx" data-id="${t.id}" ${pressed?'aria-pressed="true"':''}>${mark(t)}<span style="min-width:0"><span class="nm" style="display:block">${esc(t.name)}</span><span class="sub">${txSub(t,c)}</span></span>${txAmt(t,c)}</button>`;
}
const skel = n => `<div>${Array.from({length:n},(_,i)=>`<div class="skrow"><div class="sk" style="height:36px;border-radius:10px"></div><div><div class="sk" style="width:${55+i*7%30}%"></div><div class="sk" style="width:35%;margin-top:7px;height:9px"></div></div><div class="sk"></div></div>`).join('')}</div>`;
const empty = (t,s) => `<div class="empty"><p><b>${t}</b>${s||''}</p><button class="btn" data-act="go" data-s="add">${ico('plus')}Add a transaction</button></div>`;
const err = (t,s) => `<div class="err">${ico('warn')}<div><p><b>${t}</b>${s}</p><button class="btn ghost" data-act="retry">${ico('retry','s')}Retry</button></div></div>`;
function hdr(title, opts={}){
  const l = opts.back ? `<button class="back" data-act="${opts.backAct||'back'}" aria-label="Back to ${esc(opts.back)}">${ico('back')}${esc(opts.back)}</button>` : '';
  return `<div class="hd ph"><div class="side">${l}</div><h1>${title}</h1><div class="side r">${opts.right||''}</div></div>`;
}

/* the dial: one instrument. The ring is the cycle's budget, with a gap at the top where the cycle starts and ends.
   Amber is what is left; the ticks around it are the days, so the today tick is where an even pace would be. */
const A0 = 22, SWEEP = 316;
function pt(cx,cy,r,f){ const a = (-90 + A0 + SWEEP*f) * Math.PI/180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function arc(cx,cy,r,f0,f1){ f0=Math.max(0,f0); f1=Math.min(1,f1); if(f1-f0<=0.0005) return ''; const [x0,y0]=pt(cx,cy,r,f0),[x1,y1]=pt(cx,cy,r,f1); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${SWEEP*(f1-f0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
const SERIES = () => cum(TX, START, GONE+1);
const FLEXS = () => cum(TX, START, GONE+1, t=>!FIXED.includes(t.category));
function dialInner(c, mode, scrub){
  const S=340, cx=170, cy=170, r=126, sw=26;
  const d = scrub==null ? GONE : scrub;
  const spent = mode==='empty' ? 0 : SERIES()[d];
  const ff = c.fixedBudget/c.budget, tf = i => ff + (1-ff)*i/TOT; // day ticks spread over the flexible part of the ring
  const left = c.budget - spent, fs = Math.min(1, spent/c.budget), fd = tf(d);
  let ticks='';
  for(let i=0;i<=TOT;i++){ const [x0,y0]=pt(cx,cy,r+sw/2+5,tf(i)), [x1,y1]=pt(cx,cy,r+sw/2+(i%7===0?12:9),tf(i)); ticks += `<line class="tk" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`; }
  const [n0x,n0y]=pt(cx,cy,r-sw/2-2,fd), [n1x,n1y]=pt(cx,cy,r+sw/2+16,fd), [tx,ty]=pt(cx,cy,r+sw/2+26,fd);
  const [kx,ky]=pt(cx,cy,r,fs);
  const [sx,sy]=pt(cx,cy,r+sw/2+14,0), [ex,ey]=pt(cx,cy,r+sw/2+14,1);
  const dayLbl = scrub==null ? 'Today' : joinParts(DM, new Date(pd(START).getTime()+d*DAY));
  const [n,cur] = parts0(Math.abs(left));
  const ahead = (mode==='empty'?0:FLEXS()[d]) - Math.round(c.flexBudget*d/TOT);
  const [fx,fy]=pt(cx,cy,r+sw/2+12,ff*0.5), [g0x,g0y]=pt(cx,cy,r-sw/2,ff), [g1x,g1y]=pt(cx,cy,r+sw/2+12,ff);
  const big = n.length>5 ? 46 : null;
  return `<svg viewBox="-36 0 ${S+72} ${S}" aria-hidden="true">
    <path class="trk" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,0,1)}"/>
    <path class="used" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,0,fs)}"/>
    <path class="left" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,fs,1)}"/>
    ${ticks}

function dialCard(c, mode){

    <div class="dialbox" id="dial" tabindex="0" role="slider" aria-label="Money left through the cycle. Use the arrow keys to look back by day." aria-valuemin="1" aria-valuemax="${GONE+1}" aria-valuenow="${GONE+1}" aria-valuetext="${m0(left)} left, ${days(LEFTD)} to payday">${dialInner(c,mode,null)}</div>
    <div class="dialfoot num"><div>${mode==='empty'?'Nothing spent yet':ahead>0?'Flexible, ahead of pace':'Flexible, under pace'}<b>${m0(Math.abs(ahead))}</b></div><div>A day until payday<b class="am">${m0(Math.max(0,Math.floor(left/LEFTD)))}</b></div></div>
    <p class="hint">Drag the ring to see any day of the cycle</p>
  </section>`;
}
function bindDial(){
  const el = document.getElementById('dial'); if(!el) return;
  const c = calc(TX), mode = st.mode.home;
  const set = d => { el.innerHTML = dialInner(c, mode, d); el.setAttribute('aria-valuenow', (d==null?GONE:d)+1); };
  const at = e => { const b = el.getBoundingClientRect(); const a = Math.atan2(e.clientY-(b.top+b.height/2), e.clientX-(b.left+b.width/2))*180/Math.PI; let f = (((a + 90 - A0) % 360) + 360) % 360 / SWEEP; if(f>1) f = f>1+(360-SWEEP)/SWEEP/2 ? 0 : 1; return Math.max(0, Math.min(GONE, Math.round(f*TOT))); };
  let on = false, cur = null;
  el.addEventListener('pointerdown', e=>{ on = true; el.setPointerCapture(e.pointerId); cur = at(e); set(cur); });
  el.addEventListener('pointermove', e=>{ if(on){ const d = at(e); if(d!==cur){ cur = d; set(d); } } });
  const end = ()=>{ if(on){ on = false; cur = null; set(null); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ cur = Math.max(0,(cur==null?GONE:cur)-1); set(cur); e.preventDefault(); } else if(e.key==='ArrowRight'||e.key==='ArrowUp'){ cur = Math.min(GONE,(cur==null?GONE:cur)+1); set(cur===GONE?null:cur); if(cur===GONE) cur=null; e.preventDefault(); } else if(e.key==='Escape'){ cur=null; set(null); } });
  el.addEventListener('blur', ()=>{ if(cur!=null){ cur=null; set(null); } });
}
function lamps(c){
  const over = EXP.filter(x=>c.by[x.id]>x.budget_minor).sort((a,b)=>(c.by[b.id]-b.budget_minor)-(c.by[a.id]-a.budget_minor));

  const [top,...rest] = over, ts = c.by[top.id], tb = top.budget_minor;

    <div class="over"><button class="lead" data-act="cat" data-c="${top.id}">${catRing(ts,tb,48,false)}<span><span class="n">${top.name}</span><span class="of num">${m0(ts)} of ${m0(tb)}</span></span><span class="v num">${m2(ts-tb)}<small>over</small></span></button>

}
function joint(c){

function latest(c, mode, n){
  if(mode==='loading') return `<div class="card">${skel(3)}</div>`;

function home(){

/* transactions */
function filtered(){
  const q = st.q.trim().toLowerCase();
  return TX.filter(t=>{
    const k = t.kind==='expense' ? (t.shared?'shared':'personal') : (t.kind==='income'?'in':'moved');
    if(st.filter!=='all' && st.filter!==k) return false;
    if(q && !(t.name.toLowerCase().includes(q) || (t.category && CAT[t.category].name.toLowerCase().includes(q)))) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
}
function txList(c, mode){
  if(mode==='loading') return `<div class="day"><span class="sk" style="width:80px"></span></div><div class="daylist">${skel(6)}</div>`;
  if(mode==='empty') return `<div class="sec">${empty('No transactions yet this cycle.',' Spending and income you add show up here, grouped by day.')}</div>`;
  if(mode==='error') return `<div class="sec">${err('Transactions did not load.',' Check the connection, then try again.')}</div>`;
  const list = filtered();
  if(!list.length) return `<div class="sec"><div class="empty"><p><b>Nothing matches.</b>Try another name or filter.</p></div></div>`;
  const groups = []; list.forEach(t=>{ const g = groups[groups.length-1]; if(g && g.date===t.date) g.items.push(t); else groups.push({date:t.date, items:[t]}); });
  return groups.map(g=>{ const out = g.items.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount_minor,0); const inn = g.items.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount_minor,0);
    return `<div class="day"><span>${dayName(g.date)}</span><span class="dt num">${inn?`<span style="color:var(--in);font-weight:600">+${m2(inn)}</span>${out?' &nbsp; ':''}`:''}${out?`spent <b>${m2(out)}</b>`:''}</span></div><div class="daylist">${g.items.map(t=>txRow(t,c)).join('')}</div>`; }).join('');
}
function detail(t,c){
  if(!t) return '';
  const cat = t.category ? CAT[t.category] : null;
  let amt, rows = '';
  if(t.kind==='income') amt = `<div class="amt in num">+${m2(t.amount_minor)}</div>`;
  else if(t.kind==='topup'||t.kind==='transfer') amt = `<div class="amt mv num">${m2(t.amount_minor)}</div>`;
  else amt = `<div class="amt num">${m2(t.amount_minor)}</div>`;
  const dn = dayName(t.date);
  rows += `<div class="kv"><span>Date</span><span class="v">${dn==='Today'||dn==='Yesterday'?dn+', ':''}${joinParts(DL,pd(t.date))}</span></div>`;
  if(cat) rows += `<div class="kv"><span>Category</span><span class="v">${cat.name}</span></div>`;
  if(t.kind==='expense' && t.shared) rows += `<div class="kv"><span>Shared with ${D.partner}</span><span class="v num">yours ${m2(Math.round(t.amount_minor*c.ratio))}</span></div><div class="kv"><span>${D.partner}'s part</span><span class="v num">${m2(t.amount_minor-Math.round(t.amount_minor*c.ratio))}</span></div>`;
  if(t.kind==='expense' && !t.shared) rows += `<div class="kv"><span>Personal</span><span class="v">All yours</span></div>`;
  if(t.kind==='topup') rows += `<div class="moved">${ico('move','s')}<span>Money moved to the shared account. It is not counted as spending; it sets each share of what you spend together.</span></div>`;
  if(t.kind==='transfer') rows += `<div class="moved">${ico('move','s')}<span>Moved to savings. Not counted as spending.</span></div>`;

  return `<div class="det">${amt}<div class="nm">${esc(t.name)}</div><div class="sub">${txSub(t,c)}</div>${rows}</div>`;
}
function transactions(){

/* budget: each category is a small tachometer with a red line at its budget */
function catRing(s, b, size, big){
  const S=size, cx=S/2, cy=S/2, sw=big?20:5.5, r=S/2-(big?34:sw/2+1);
  const max = big ? Math.max(b*1.25, s*1.04) : Math.max(b, s);
  const fb = b/max, fs = Math.min(1, s/max);
  let ticks='';
  if(big){ for(let i=0;i<=20;i++){ const f=i/20, red = f>fb+0.001; const [x0,y0]=pt(cx,cy,r+sw/2+5,f),[x1,y1]=pt(cx,cy,r+sw/2+(i%5===0?13:9),f); ticks+=`<line class="tk${red?' red':''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`; }
}
  return `<svg ${big?'':'class="mini"'} viewBox="${big?'-30 0 '+(S+60)+' '+S:'0 0 '+S+' '+S}" aria-hidden="true">
    <path class="trk" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,0,big?1:1)}"/>
    <path class="used" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,0,Math.min(fs,fb))}"/>
    ${s<b?`<path class="left" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,fs,fb)}"/>`:''}
    ${s>b?`<path class="ov" stroke-width="${sw}" stroke-linecap="round" d="${arc(cx,cy,r,fb,fs)}"/>`:''}
    ${ticks}</svg>`;
}
function paceChart(id, W, H){
  const x = CAT[id];
  const cur = cum(TX, START, GONE+1, t=>t.category===id), last = cum(LAST, D.last_cycle.start, LASTN, t=>t.category===id);
  const b = x.budget_minor, top = Math.max(b, cur[cur.length-1], last[last.length-1])*1.12 || 1;
  const L=6, R=W-6, T=14, B=H-22;
  const X = i => L + (R-L)*i/(TOT-1), Y = v => B - (B-T)*v/top;
  const path = a => a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const ov = cur[cur.length-1] > b, xe = X(cur.length-1), ye = Y(cur[cur.length-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${x.name} this cycle ${m0(cur[cur.length-1])} against budget ${m0(b)}; last cycle ${m0(last[last.length-1])}">
    <line class="ax" x1="${L}" x2="${R}" y1="${B}" y2="${B}"/>
    <line class="bud" x1="${L}" x2="${R}" y1="${Y(b)}" y2="${Y(b)}"/>
    <text x="${L}" y="${Y(b)-5}" style="fill:var(--over)">Budget ${m0(b)}</text>
    <path class="last" d="${path(last)}"/>
    <path class="cur" d="${path(cur)}"/>
    <circle cx="${xe}" cy="${ye}" r="4.5" style="fill:${ov?'var(--over)':'var(--amber)'}"/>
    <text class="tl${ov?' o':''}" x="${xe-7}" y="${ye-9}" text-anchor="end">${m0(cur[cur.length-1])}</text>
    <text x="${L}" y="${H-4}">${dm(pd(START))}</text><text x="${R}" y="${H-4}" text-anchor="end">${dm(new Date(NEXTPAY-DAY))}</text>
  </svg>`;
}
function budgetList(c){

function catDetail(c, desk){

  return desk ? `<div class="catcols">${ring}<div>${body.replace('<div class="sec">','<div class="sec" style="margin-top:0">')}</div></div>` : ring + body;

function budget(){

/* analytics: what changed against last cycle, category by category */
function analytics(){
  const c = calc(TX), desk = isDesk(), mode = st.mode.analytics;
  const rows = EXP.map(x=>({x, s:c.by[x.id], l:LASTC.by[x.id]||0})).map(r=>({...r,d:r.s-r.l})).sort((a,b)=>b.s-a.s);
  const maxD = Math.max(...rows.map(r=>Math.abs(r.d))) || 1;
  const diff = c.spent - LASTC.spent;
  const ups = rows.filter(r=>r.d>0).sort((a,b)=>b.d-a.d).slice(0,3);
  const lf = new Intl.ListFormat(LOC,{type:'conjunction'});
  const [n,cur] = parts0(Math.abs(diff));
  let body;
  if(mode==='loading') body = `<div class="sk" style="height:56px;width:60%;margin:8px 0 14px"></div><div class="card">${skel(6)}</div>`;
  else if(mode==='error') body = err('This comparison did not load.',' Check the connection, then try again.');
  else if(mode==='empty') body = `<div class="empty"><p><b>Too early to compare.</b>After a few days of spending this cycle, it shows here next to last cycle.</p></div>`;
  else body = `<div class="ahead"><div class="l">This cycle against last</div><div class="big num">${diff>0?'+':diff<0?'−':''}${n}<small>${cur}</small></div>
      <p>${m0(c.spent)} spent so far, ${days(LEFTD)} before payday. Last cycle was ${m0(LASTC.spent)} in total. The difference is mostly ${lf.format(ups.map(r=>r.x.name))}.</p></div>
    <div class="dhd"><span>Category</span><span>Less</span><span>More</span><span>This cycle</span></div>
    <div class="card" style="padding:0 14px">${rows.map(r=>{ const w = Math.abs(r.d)/maxD*100;
      return `<button class="drow" data-act="cat" data-c="${r.x.id}" aria-label="${r.x.name}: ${m0(r.s)}, ${r.d?s0(r.d)+' against last cycle':'same as last cycle'}"><span class="nm">${r.x.name}</span>
        <span class="neg">${r.d<0?`<i style="width:${w}%"></i><span class="num" style="right:calc(${w}% + 6px)">${s0(r.d)}</span>`:''}</span>
        <span class="pos">${r.d>0?`<i style="width:${w}%"></i><span class="num" style="${w>62?`right:calc(${100-w}% + 6px);color:var(--amber-ink)`:`left:calc(${w}% + 6px)`}">${s0(r.d)}</span>`:r.d===0?`<span style="left:6px;color:var(--ink-3);font-weight:500">same</span>`:''}</span>
        <span class="v num">${m0(r.s)}<small>last ${m0(r.l)}</small></span></button>`; }).join('')}</div>`;
  return `<div class="wrap" style="${desk?'max-width:900px':''}">${hdr('Where the money went')}${desk?`<div class="dtitle">Where the money went</div>`:''}${body}</div>`;
}

/* add */
function addScreen(){
  const a = st.add, c = calc(TX), desk = isDesk();
  const amt = amountMinor(a.amt);
  const stepIx = {amount:0,category:1,name:2,saved:3}[a.step];
  const steps = [['amount','Amount'],['category','Category'],['name','Name']];
  const stepBar = a.step==='saved' ? '' : `<div class="steps">${steps.map(([k,l],i)=>`<button data-act="step" data-k="${k}" ${i===stepIx?'aria-current="step"':''} class="${i<stepIx?'done':''}" ${i>stepIx?'disabled':''}>${i+1} ${l}</button>`).join('')}</div>`;
  const close = `<button class="back" data-act="closeadd" aria-label="Close">${ico('close')}</button>`;
  const title = a.kind==='income' ? 'New income' : 'New expense';
  let body='';
  const amtText = amt ? m2(amt) : m2(0);
  if(a.step==='amount'){
    const hasDec = a.amt.includes(',');
    const shown = a.amt ? (()=>{ const [i,d] = a.amt.split(','); const p = F2.formatToParts(parseInt(i||'0',10)); const intS = p.filter(x=>x.type==='integer'||x.type==='group').map(x=>x.value).join(''); const curS = p.filter(x=>x.type==='currency').map(x=>x.value).join(''); return `${intS}${hasDec?','+d:''}<span class="caret"></span> <span style="font-size:.45em">${curS}</span>`; })() : `0<span class="caret"></span> <span style="font-size:.45em">kr.</span>`;
    const after = a.kind==='expense' && amt ? `Left this cycle after this: <b class="num">${m0(c.left-amt)}</b>` : a.kind==='income' ? 'Income is not counted against budgets' : 'Type the amount';
    const whenL = a.when===0 ? 'Today' : 'Yesterday';
    body = `<div class="amtbox"><div class="v num ${amt?'':'zero'}" aria-live="polite">${shown}</div><div class="after">${after}</div></div>
      ${a.note!==null?`<input class="notein" id="note" placeholder="Note" aria-label="Note" value="${esc(a.note)}">`:''}
      <div class="offp">
        <button class="chip" data-act="when">${ico('cal','s')}${whenL}</button>
        <button class="chip" data-act="note" aria-pressed="${a.note!==null}">${ico('note','s')}Note</button>
        ${a.kind==='expense'?`<button class="chip" data-act="shared" aria-pressed="${a.shared}">${ico('people','s')}Shared with ${D.partner}</button>`:''}
        <button class="chip inc" data-act="kind" aria-pressed="${a.kind==='income'}">${ico('arrow-in','s')}Income</button>
      </div>
      <input class="vh" id="amtin" inputmode="decimal" aria-label="Amount" value="${esc(a.amt)}">
      <div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','del'].map(k=>`<button data-act="key" data-k="${k}" aria-label="${k==='del'?'Delete digit':k===','?'Decimal comma':k}">${k==='del'?ico('del'):k}</button>`).join('')}</div>
      <button class="btn next" data-act="next" ${amt?'':'disabled'}>Next: category</button>`;
  } else if(a.step==='category'){
    const recap = `<div class="recap"><span style="color:var(--ink-2)">${a.kind==='income'?'Income':'Expense'}${a.shared?', shared':''}</span><span class="v num">${a.kind==='income'?'+':''}${m2(amt)}</span></div>`;
    if(a.kind==='income'){
      body = recap + `<div class="lbl">Category</div><div class="clist">${CATS.filter(x=>x.kind==='income').map(x=>`<button data-act="pick" data-c="${x.id}"><span style="color:var(--in)">${ico(x.mark)}</span><span style="font-weight:560">${x.name}</span>${ico('chev','s')}</button>`).join('')}</div>`;
    } else {
      const rec = D.suggestions.last_used_categories;
      const leftTxt = x => { const l = x.budget_minor - c.by[x.id]; return l<0 ? `<span class="s o num">${m0(-l)} over</span>` : `<span class="s num">${m0(l)} left</span>`; };
      body = recap + `<div class="lbl">Recent</div><div class="recent">${rec.map(id=>{ const x=CAT[id]; return `<button data-act="pick" data-c="${id}">${ico(x.mark)}<span class="n">${x.name}</span>${leftTxt(x)}</button>`; }).join('')}</div>
        <div class="lbl">All categories</div><div class="clist">${EXP.filter(x=>!rec.includes(x.id)).map(x=>`<button data-act="pick" data-c="${x.id}"><span style="color:var(--ink-2)">${ico(x.mark)}</span><span style="font-weight:560">${x.name}</span>${leftTxt(x)}</button>`).join('')}</div>`;
    }
  } else if(a.step==='name'){
    const x = CAT[a.cat];
    let sugg = (D.suggestions.name_suggestions[a.cat]||[]).slice();
    if(sugg.length<3) TX.concat(LAST).forEach(t=>{ if(t.category===a.cat && !sugg.includes(t.name) && sugg.length<3) sugg.push(t.name); });
    body = `<div class="recap"><span style="color:var(--ink-2)">${ico(x.mark)}</span><span style="font-weight:560">${x.name}${a.shared?' <span class="tag sh">'+ico('people','s')+'Shared</span>':''}</span><span class="v num">${a.kind==='income'?'+':''}${m2(amt)}</span></div>
      <div class="namein"><label for="nm">Name</label><input id="nm" value="${esc(a.name)}" placeholder="Shop or payee" autocomplete="off" enterkeyhint="done"></div>
      ${sugg.length?`<div class="lbl">Suggested for ${x.name}</div><div class="sugg">${sugg.map(s=>`<button data-act="sugg" data-n="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}
      <div class="spacer"></div><button class="btn next" id="save" data-act="save" ${a.name.trim()?'':'disabled'}>Save</button>`;
  } else {
    const x = CAT[a.cat];
    const segL = Math.round(c.spent/c.budget*TOT);
    body = `<div class="saved" role="status"><div class="ok"><span>${ico('check')}</span>Saved</div>
      <div class="recap" style="margin:0"><span style="color:var(--ink-2)">${ico(x.mark)}</span><span><span style="font-weight:600">${esc(a.name)}</span><span style="display:block;font-size:12.5px;color:var(--ink-2)">${x.name}${a.shared?', shared with '+D.partner:''}</span></span><span class="v num">${a.kind==='income'?'+':''}${m2(amt)}</span></div>
      ${a.kind==='expense'?`<div class="recap" style="margin:0;gap:14px">${catRing(c.by[a.cat],CAT[a.cat].budget_minor,40,false)}<span><span style="display:block;font-size:13px;color:var(--ink-2)">Left this cycle, ${days(LEFTD)} to payday</span><span class="num" style="font-size:26px;font-weight:600">${m0(c.left)}</span></span><span class="v num" style="font-size:14px;color:${CAT[a.cat].budget_minor<c.by[a.cat]?'var(--over)':'var(--amber-text)'}">${CAT[a.cat].budget_minor<c.by[a.cat]?m0(c.by[a.cat]-CAT[a.cat].budget_minor)+' over':m0(CAT[a.cat].budget_minor-c.by[a.cat])+' left'}<br><span style="font-weight:500;color:var(--ink-2)">in ${CAT[a.cat].name}</span></span></div>`:''}
      <p style="color:var(--ink-2);font-size:13.5px">Back to ${({home:'the cycle',transactions:'transactions',budget:'budgets',analytics:'analytics'})[st.addFrom]||'the cycle'} in a moment.</p>
      <button class="btn" data-act="done">Done</button></div>`;
  }
  return `<div class="add"><div class="hd ph" style="display:flex"><div class="side">${a.step==='saved'?'':close}</div><h1>${title}</h1><div class="side r"></div></div>${stepBar}${body}</div>`;
}

/* chrome */
const NAV = [['home','Cycle','gauge'],['transactions','Transactions','list'],['budget','Budgets','budgets'],['analytics','Analytics','chart']];
function topbar(){
  const cur = st.screen==='add' ? st.addFrom : st.screen;
  return `<header class="top"><div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 18.7A8 8 0 1 1 17.7 18.7" fill="none" stroke="var(--dial-used)" stroke-width="3.2" stroke-linecap="round"/><path d="M17.7 18.7A8 8 0 0 0 20 12" fill="none" stroke="var(--amber)" stroke-width="3.2" stroke-linecap="round"/></svg>Cashflow</div>
    <nav class="tnav" aria-label="Main">${NAV.map(([s,l])=>`<button data-act="go" data-s="${s}" ${cur===s?'aria-current="page"':''}>${l}</button>`).join('')}</nav>
    <div class="topr"><span class="cyc">${CYC.label} cycle, ${days(LEFTD)} to payday</span><button class="addkey" data-act="go" data-s="add">${ico('plus')}Add</button></div></header>`;
}
function tabbar(){
  const t = ([s,l,i]) => `<button class="tab" data-act="go" data-s="${s}" ${st.screen===s?'aria-current="page"':''}>${ico(i)}${l}</button>`;
  return `<nav class="tabs" aria-label="Main">${NAV.map(t).join('')}<button class="addkey" data-act="go" data-s="add" aria-label="Add a transaction">${ico('plus')}Add</button></nav>`;
}
function proto(scr){
  const themeBtn = `<button data-act="theme" aria-label="Switch theme">${st.theme==='dark'?'Light':'Dark'}</button>`;
  if(!st.mode[scr]) return `<div class="proto" aria-label="Prototype controls">${themeBtn}</div>`;
  return `<div class="proto" role="group" aria-label="Prototype state"><span>State</span>${[['content','Data'],['loading','Loading'],['empty','Empty'],['error','Error']].map(([k,l])=>`<button data-act="mode" data-m="${k}" aria-pressed="${st.mode[scr]===k}">${l}</button>`).join('')}${themeBtn}</div>`;
}
const VIEWS = {home, transactions, budget, analytics};
const app = document.getElementById('app');
let lastKey = '';
function render(reset){
  document.documentElement.dataset.theme = st.theme;
  const desk = isDesk();
  const main = document.getElementById('main'); const top = main ? main.scrollTop : 0;
  const base = st.screen==='add' ? st.addFrom : st.screen;
  let h = topbar();
  if(st.screen==='add' && !desk) h += addScreen();
  else {
    h += `<main class="main" id="main">${VIEWS[base]()}</main>` + tabbar();
    if(st.screen==='add') h += `<div class="scrim" data-act="closeadd"></div><div class="addpanel" role="dialog" aria-modal="true" aria-label="Add a transaction">${addScreen()}</div>`;
  }
  if(st.sheet && !desk && st.sel){ const t = TX.find(x=>x.id===st.sel); h += `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t.name)}"><div class="grab"></div><button class="x" data-act="closesheet" aria-label="Close">${ico('close')}</button>${detail(t,calc(TX))}</div>`; }
  h += proto(st.screen==='add' ? 'add' : st.screen);
  app.innerHTML = h;
  const m2el = document.getElementById('main'); if(m2el && !reset && lastKey===base) m2el.scrollTop = top;
  lastKey = base;
  if(st.focus==='q'){ const q = document.getElementById('q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  if(st.screen==='add' && st.add.step==='name'){ const n = document.getElementById('nm'); if(n && document.activeElement!==n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }
  bindDial();
  if(st.screen==='add' && st.add.step==='amount'){ const n = document.getElementById('amtin'); if(n && reset) n.focus({preventScroll:true}); }
}
let savedTimer;
function key(k){
  const a = st.add; let s = a.amt;
  if(k==='del') s = s.slice(0,-1);
  else if(k===','){ if(!s.includes(',')) s = (s||'0') + ','; }
  else { const [i,d] = s.split(','); if(d!==undefined){ if(d.length<2) s += k; } else if((i||'').length<6) s = (s==='0'?'':s) + k; }
  a.amt = s; render();
}
function save(){
  const a = st.add; if(!a.name.trim()) return;
  const d = new Date(TODAY - a.when*DAY), iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  TX.unshift({id:'n'+Date.now(), date:iso, amount_minor:amountMinor(a.amt), kind:a.kind, category:a.cat, name:a.name.trim(), shared:a.kind==='expense'&&a.shared, paid_by:'me', note:a.note||undefined});
  a.step='saved'; render();
  clearTimeout(savedTimer); savedTimer = setTimeout(()=>{ if(st.screen==='add' && st.add.step==='saved') finish(); }, 2600);
}
function finish(){ clearTimeout(savedTimer); const to = st.addFrom||'home'; st.stack.pop(); st.screen = to; render(true); try{ parent.postMessage({type:'at', screen:to}, '*'); }catch(e){} }

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act; st.focus = null;
  if(act==='go'){ if(b.dataset.s==='budget'){ st.budView = b.dataset.v==='all' ? 'all' : (st.screen==='budget'?'all':st.budView); if(b.closest('.tabs,.tnav')) st.budView='all'; } go(b.dataset.s); }
  else if(act==='back') back();
  else if(act==='allbud'){ st.budView='all'; render(true); }
  else if(act==='cat'){ st.cat = b.dataset.c; st.budView='one'; if(st.screen!=='budget') go('budget'); else render(true); }
  else if(act==='tx'){ st.sel = b.dataset.id; if(isDesk()){ if(st.screen!=='transactions') go('transactions'); else render(); } else { st.sheet = true; render(); } }
  else if(act==='closesheet'){ st.sheet=false; render(); }
  else if(act==='filter'){ st.filter = b.dataset.f; render(); }
  else if(act==='mode'){ const s = st.screen; st.mode[s] = b.dataset.m; render(); }
  else if(act==='theme'){ st.theme = st.theme==='dark'?'light':'dark'; render(); }
  else if(act==='retry'){ st.mode[st.screen] = 'loading'; render(); setTimeout(()=>{ st.mode[st.screen]='content'; render(); }, 900); }
  else if(act==='closeadd'){ finishClose(); }
  else if(act==='key') key(b.dataset.k);
  else if(act==='next'){ if(amountMinor(st.add.amt)){ st.add.step='category'; render(true); } }
  else if(act==='step'){ st.add.step = b.dataset.k; render(true); }
  else if(act==='when'){ st.add.when = st.add.when ? 0 : 1; render(); }
  else if(act==='note'){ st.add.note = st.add.note===null ? '' : null; render(); if(st.add.note!==null) document.getElementById('note').focus(); }
  else if(act==='shared'){ st.add.shared = !st.add.shared; render(); }
  else if(act==='kind'){ st.add.kind = st.add.kind==='income'?'expense':'income'; st.add.cat=null; render(); }
  else if(act==='pick'){ st.add.cat = b.dataset.c; st.add.step='name'; st.add.name=''; render(true); }
  else if(act==='sugg'){ st.add.name = b.dataset.n; render(); }
  else if(act==='save') save();
  else if(act==='done') finish();
});
function finishClose(){ clearTimeout(savedTimer); const to = st.addFrom||'home'; st.stack.pop(); st.screen = to; render(true); try{ parent.postMessage({type:'at', screen:to}, '*'); }catch(e){} }
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ st.q = e.target.value; st.focus='q'; render(); }
  else if(e.target.id==='nm'){ st.add.name = e.target.value; const s = document.getElementById('save'); if(s) s.disabled = !st.add.name.trim(); }
  else if(e.target.id==='note'){ st.add.note = e.target.value; }
  else if(e.target.id==='amtin'){ const v = e.target.value.replace('.',',').replace(/[^0-9,]/g,''); st.add.amt = v; render(); document.getElementById('amtin').focus(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(st.sheet){ st.sheet=false; render(); } else if(st.screen==='add') finishClose(); return; }
  if(st.screen!=='add') return;
  const a = st.add;
  if(a.step==='amount' && e.target.id!=='note' && e.target.id!=='amtin'){
    if(/^[0-9]$/.test(e.key)){ key(e.key); e.preventDefault(); }
    else if(e.key===','||e.key==='.'){ key(','); e.preventDefault(); }
    else if(e.key==='Backspace'){ key('del'); e.preventDefault(); }
    else if(e.key==='Enter' && amountMinor(a.amt)){ a.step='category'; render(true); }
  } else if(a.step==='name' && e.key==='Enter' && e.target.id==='nm') save();
});
let rw; addEventListener('resize', ()=>{ clearTimeout(rw); rw = setTimeout(()=>render(), 80); });
render(true);
})();
</script>
</body>
</html>
